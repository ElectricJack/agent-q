[package]
name = "aq-responses-transport"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded owner-scoped Responses HTTP policy and cancelable streaming transport"

[dependencies]
anyhow = "1"
aq-session-protocol = { path = "../aq-session-protocol-0.1.0", version = "=0.1.0" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
axum = "0.8"

[features]
test-support = []
