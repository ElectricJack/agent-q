[package]
edition = "2024"
name = "aq-admission"
version = "0.3.2"
build = false
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "AQ native execution wire contracts, delegated sandbox permits, schemas and conformance fixtures"
readme = "README.md"

[lib]
name = "aq_admission"
path = "src/lib.rs"

[[example]]
name = "export"
path = "examples/export.rs"

