[dependencies.aq-lifecycle-protocol]
version = "=0.1.0"

[dependencies.aq-session-protocol]
version = "=0.1.0"

[dependencies.schemars]
version = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.uuid]
version = "1"
features = [
    "serde",
    "v5",
]

