# Development overlay: builds from source, uses the example vault and a local
# updater spool, publishes the listeners on loopback only and keeps
# cloudflared off by default. compose.yaml still requires AQ_VAULT_DIR and
# AQ_UPDATER_SPOOL to be set (scripts/dev-up and scripts/smoke set them).
services:
  server:
    build:
      context: .
      target: server
    image: ${AQ_SERVER_IMAGE:-agent-q-server:dev}
    environment:
      # compose.yaml sets production; the example vault is a development vault.
      AQ_DEPLOYMENT: development
    volumes:
      - type: bind
        source: ./vault.example
        target: /vault
        read_only: true
      # The updater spool (scripts/dev-up creates it; gitignored). The example
      # vault has no [updates] section, so updates stay unavailable in dev.
      - type: bind
        source: ./state.dev/updater-spool/requests
        target: /updater/requests
      - type: bind
        source: ./state.dev/updater-spool/status
        target: /updater/status
        read_only: true
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8081:8081'
  cloudflared:
    profiles: [tunnel]
  # Only used by scripts/smoke: the worker image, run as a container.
  # scripts/smoke sets AQ_WORKER_IMAGE when it tests a prebuilt image.
  worker:
    build:
      context: .
      target: worker
    image: ${AQ_WORKER_IMAGE:-agent-q-worker:dev}
    profiles: [smoke]
    networks: [edge]
    volumes:
      - worker_config:/config
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  worker_config:
secrets:
  postgres_password:
    file: ./secrets.dev/postgres_password
