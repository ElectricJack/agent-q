# Development-only override for a locally built aq-dashboard bundle.
# Production uses the digest-verified bundle embedded in the server image.
# Explicit opt-in: docker compose -f compose.yaml -f compose.dashboard.yaml up
services:
  server:
    environment:
      AQ_DASHBOARD_DIR: /usr/share/agent-q/dashboard
    volumes:
      - type: bind
        source: ${AQ_DASHBOARD_BUNDLE:?Set AQ_DASHBOARD_BUNDLE to the absolute dashboard dist directory}
        target: /usr/share/agent-q/dashboard
        read_only: true
