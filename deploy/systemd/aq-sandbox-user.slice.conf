# Aggregate cap for every sandbox of the dedicated rootless sandbox daemon (E1c).
# Install as /etc/systemd/system/user-<sandbox-uid>.slice.d/50-aq-sandbox.conf,
# then `systemctl daemon-reload`. All of that user's processes (Podman service,
# conmon and every sandbox container) are charged to this slice, so the
# per-sandbox C2 limits can never sum past it. Values target the Bluehost NVMe 8
# VPS, 4 vCPU / 8 GB, with one cloud sandbox at a time (docs/implementation/E5.md);
# the stack's own Compose caps take the rest. On the 8 vCPU / 16 GB upgrade path
# go back to CPUQuota=400% and MemoryMax=8G (docs/implementation/E1c.md).
[Slice]
CPUQuota=200%
CPUWeight=50
MemoryMax=4G
MemorySwapMax=0
TasksMax=4096
