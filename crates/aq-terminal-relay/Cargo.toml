[package]
name = "aq-terminal-relay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aq-session-api = { path = "../aq-session-api", version = "=0.1.0" }
aq-session-protocol = { path = "../../vendor/aq-session-protocol-0.1.0", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
schemars = { version = "1", features = ["uuid1"] }
aq-terminal-relay-protocol = { path = "../aq-terminal-relay-protocol", version = "=0.1.0" }
