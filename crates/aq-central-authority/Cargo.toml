[package]
name = "aq-central-authority"
version = "0.1.0"
edition = "2024"
publish = false
description = "Taskless central session model and dormant durable lifecycle owner"
[dependencies]
aq-session-protocol = { path = "../../vendor/aq-session-protocol-0.1.0", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
async-trait.workspace = true
sqlx.workspace = true
sqlx-postgres.workspace = true
tokio.workspace = true
