[package]
name = "aq-lifecycle-api"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure AQ-owned wait, continuation acknowledgment and lifecycle inspection contracts"
[dependencies]
aq-lifecycle-protocol = { path = "../../vendor/aq-lifecycle-protocol-0.1.0", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["uuid1"] }
uuid = { version = "1", features = ["serde"] }
