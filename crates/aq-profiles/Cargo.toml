[package]
name = "aq-profiles"
version = "0.1.2"
edition = "2024"
publish = false

[[bin]]
name = "aq-profile"
path = "src/main.rs"

[dependencies]
schemars = "1"
aq-agent-api = { path = "../aq-agent-api", version = "=0.1.0" }
aq-session-protocol = { path = "../../vendor/aq-session-protocol-0.1.0", version = "=0.1.0" }
aq-session-api = { path = "../aq-session-api", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
