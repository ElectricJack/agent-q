[package]
name = "aq-observation-admission"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded observation transport ownership and activation contract"
[dependencies]
aq-lifecycle-protocol = { path = "../../vendor/aq-lifecycle-protocol-0.1.0", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["serde"] }
[dev-dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
