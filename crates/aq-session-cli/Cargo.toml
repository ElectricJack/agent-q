[package]
name = "aq-session-cli"
version = "0.1.0"
edition = "2024"
publish = false
[[bin]]
name = "aq-session"
path = "src/main.rs"
[dependencies]
aq-human-http = { path = "../aq-human-http", version = "=0.1.0" }
aq-terminal-relay = { path = "../aq-terminal-relay", version = "=0.1.0" }
