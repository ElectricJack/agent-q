# Production overlay (E1c): central supervisor host and cloud worker.
# Use together with compose.yaml, e.g. COMPOSE_FILE=compose.yaml:compose.workers.yaml.
# Limits and the sandbox daemon decision are recorded in docs/implementation/E1c.md.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  aq-supervisor-host:
    <<: *hardening
    # F1a image (Dockerfile.supervisor-host); session lifecycle belongs to F1a.
    image: ${AQ_SUPERVISOR_HOST_IMAGE:?set AQ_SUPERVISOR_HOST_IMAGE to a digest-pinned supervisor host reference}
    # The root host drops each native child to UID/GID 10001 (crates/aq-supervisor-host).
    user: '0:0'
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    command: [run, /config/supervisor.json]
    volumes:
      # Root-owned 0600 CONFIG plus secret_file; mounted into no other service.
      - type: bind
        source: ${AQ_SUPERVISOR_CONFIG_DIR:?set AQ_SUPERVISOR_CONFIG_DIR to the root-owned supervisor config directory}
        target: /config
        read_only: true
      - aq_supervisor_host:/host
      - aq_supervisor_workspace:/workspace
      - aq_supervisor_homes:/native-homes
    tmpfs: [/tmp]
    # Central identity: database and provider egress only. Not a worker node and
    # no Docker socket; private PID namespace is Compose's default.
    networks: [database, supervisor]
    depends_on:
      server: {condition: service_healthy}
    init: true
    stop_grace_period: 45s
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
  aq-worker-cloud:
    <<: *hardening
    # aq-worker with the docker-local backend (C2/B5b). Must come from aq-worker's
    # packaging, not this repository's vendored 0.3.1 Dockerfile.worker.
    image: ${AQ_WORKER_IMAGE:?set AQ_WORKER_IMAGE to a digest-pinned aq-worker reference with docker-local}
    # Owner of the dedicated rootless sandbox daemon socket.
    user: ${AQ_SANDBOX_UID:?set AQ_SANDBOX_UID to the sandbox user UID}:${AQ_SANDBOX_GID:?set AQ_SANDBOX_GID to the sandbox user GID}
    command: [run, --controller-config, /config/controller.json]
    environment:
      # Public machine hostname behind Cloudflare Access; never the Compose network.
      AQ_SERVER_URL: https://${AQ_PUBLIC_HOSTNAME:?set AQ_PUBLIC_HOSTNAME to the public Access hostname}
      DOCKER_HOST: unix:///run/aq-sandbox/podman.sock
    volumes:
      - type: bind
        source: ${AQ_WORKER_CONFIG_DIR:?set AQ_WORKER_CONFIG_DIR to the worker config directory}
        target: /config
        read_only: true
      # Only the dedicated rootless sandbox daemon; never the host's main Docker socket.
      - type: bind
        source: ${AQ_SANDBOX_SOCKET_DIR:?set AQ_SANDBOX_SOCKET_DIR to the rootless sandbox socket directory}
        target: /run/aq-sandbox
      - aq_worker_journal:/state
      - aq_worker_leases:/var/lib/aq-worker/leases
    tmpfs: [/tmp]
    networks: [workers]
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
networks:
  supervisor: {}
  workers: {}
volumes:
  aq_supervisor_host:
  aq_supervisor_workspace:
  aq_supervisor_homes:
  aq_worker_journal:
  aq_worker_leases:
