# cargo-nextest configuration. CI runs
#   cargo nextest run --workspace --locked --no-fail-fast --profile ci
# nextest runs every test in its own process (cargo test runs one binary at a
# time, its tests as threads of one process). In-process gates therefore
# serialize nothing under nextest: tests that must not overlap belong to a test
# group below. Fresh test-database migrations are serialized across processes
# by an advisory lock (aq-server src/test_support.rs, `migration_slot`).

[profile.default]
# A test still running after 60 s is reported as slow; one still running after
# 10 min is stopped, so a hang cannot hold the whole run.
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

[test-groups]
# Selection fixtures (tests/common/selection.rs and selection_actual.rs) drive
# the production external admission gate, which is process-wide and fail-fast.
# Under cargo test their in-process fixture gate runs them one at a time. Under
# nextest each has its own process (and its own admission gate), so the limit
# only bounds load: with all 24 local cores running them at once they fail with
# "request deadline exceeded". One at a time, the 233 fixture tests (~5 s each)
# would take ~20 min alone; two at a time keeps them under the CI test budget.
selection-fixture = { max-threads = 2 }
# store::*_tests run several fresh frozen-profile migrations each; one at a time
# they do not queue on the cross-process migration slot while holding a slot.
fresh-migrations = { max-threads = 1 }

# Every test that builds a selection fixture must be in this filter: the fixture
# gate panics under nextest for a test outside the group. To add one, add its
# `binary_id(aq-server::<group>) & test(=<module>::...)` (or the whole module,
# `test(/^<module>::/)`) below. Integration test names start with the module
# that was their own test binary before the groups (tests/<group>/main.rs).
[[profile.default.overrides]]
filter = """
  (binary_id(aq-server::it_native) & (test(/^native_accepted_preparation::/) | test(/^native_offers::/) | test(/^native_preparation::/) | test(/^native_proposal_scope::/) | test(/^native_result_startup::/) | test(/^scoped_presence_inventory::/)))
  | (binary_id(aq-server::it_phase) & (test(/^phase_execution::/) | test(/^phase_execution_transport::/) | test(/^phase_initial_lease::/) | test(/^phase_never_granted::/) | test(/^phase_refresh_execution::/) | test(/^phase_refresh_terminal::/) | test(/^phase_results::/) | test(/^phase_terminal_closure::/) | test(/^phase_terminal_fixture::/) | test(/^phase_terminal_history::/) | test(/^phase_terminal_started::/) | test(/^phase_terminal_stopped::/) | test(/^terminal_tail::/)))
  | (binary_id(aq-server::it_playbook) & (test(/^project_bindings::/) | test(/^repository_onboarding::/)))
  | (binary_id(aq-server::it_playbook) & test(=actual_codex_task::actual_finite_codex_task_claim_source_and_protected_graph_closure))
  | (binary_id(aq-server::it_native) & (test(=delegated_permit_runtime::accept_issues_and_grant_atomically_upgrades_same_permit) | test(=delegated_permit_runtime::expired_permit_is_refused_by_every_runner_route) | test(=delegated_permit_runtime::node_reboot_requires_readoption_before_renewal_extends) | test(=delegated_permit_runtime::readoption_refuses_backend_template_capability_changes_and_expired_grants) | test(=delegated_permit_runtime::reboot_after_native_stop_readopts_only_result_and_exact_stopped_replay) | test(=delegated_permit_runtime::server_restart_mid_attempt_resumes_or_preserves)))
  | (binary_id(aq-server::it_native) & (test(=granted_closure::actual_grant_closes_once_and_replays_without_release_or_execution_clock) | test(=granted_closure::actual_host_stopped_variant_retains_absent_prestart_pane_without_inventing_started) | test(=granted_closure::closure_http_uses_reserved_control_capacity_and_refuses_at_its_shared_bound) | test(=granted_closure::credential_rotation_during_node_lock_wait_cannot_commit_a_closure) | test(=granted_closure::expiry_and_active_policy_retirement_do_not_block_historical_closure) | test(=granted_closure::failed_receipt_insert_rolls_back_revocation_and_preserves_retry) | test(=granted_closure::policy_replacement_fences_old_owner_but_exact_history_can_use_new_current_policy) | test(=granted_closure::renewal_counter_fences_old_suppression_and_closure_fences_all_later_authority) | test(=granted_closure::started_and_closure_serialize_to_exactly_one_terminal_history)))
  | (binary_id(aq-server::it_native) & (test(=native_cancellation::native_cancel_before_grant_releases_claim) | test(=native_cancellation::native_cancel_owner_validation_attempt_replay_and_concurrency) | test(=native_cancellation::native_cancel_slow_offer_continues_after_prompt_directive)))
  | (binary_id(aq-server::it_native) & (test(=native_expiry::configured_runtime_closes_offline_offer_and_obeys_shutdown) | test(=native_expiry::published_offer_actual_accept_and_expiry_preserve_source_while_revoking_material)))
  | (binary_id(aq-server::it_native) & (test(=native_initial_grant::accept_quota_charges_incoming_jsonb_expansion_at_the_same_retained_byte_boundary) | test(=native_initial_grant::actual_accepted_plan_without_original_native_publication_cannot_issue_a_grant) | test(=native_initial_grant::published::actual_initial_grant_reconciliation_returns_history_without_live_clock_or_mutation) | test(=native_initial_grant::published::actual_published_prepare_is_atomic_and_replays_original_versions_after_hot_record_changes) | test(=native_initial_grant::published::ambiguous_historical_grant_receipts_refuse_instead_of_choosing_a_replacement) | test(=native_initial_grant::published::changed_current_private_material_and_cancellation_never_issue_a_grant) | test(=native_initial_grant::published::concurrent_exact_prepare_never_creates_two_grants_or_extends_the_original) | test(=native_initial_grant::published::credential_rotation_during_actual_private_git_wait_is_rechecked_without_sql_locks_held) | test(=native_initial_grant::published::exact_full_artifact_and_material_receipt_coverage_is_mandatory) | test(=native_initial_grant::published::final_fence_refuses_expiry_after_observed_shared_quota_lock_wait) | test(=native_initial_grant::published::graph_changes_during_preparation_refuse_without_retiming_original_inputs) | test(=native_initial_grant::published::initial_deadline_respects_actual_pinned_lineage_policy_shorter_than_wall_time) | test(=native_initial_grant::published::material_receipts::existing_or_replayed_changed_installation_claims_are_refused) | test(=native_initial_grant::published::material_receipts::grant_failure_rolls_back_new_installation_receipt_with_authority) | test(=native_initial_grant::published::material_receipts::installation_receipt_is_atomic_exact_and_replay_never_reconstructs_a_missing_row) | test(=native_initial_grant::published::material_receipts::retained_installation_json_bytes_refuse_new_grant_under_shared_budget) | test(=native_initial_grant::published::mounted_prepare_uses_typed_outbound_control_and_never_mounts_on_human_listener) | test(=native_initial_grant::published::presence::expired_permit_cannot_make_a_delayed_positive_fresh_on_receipt) | test(=native_initial_grant::published::presence::isolation::held_inventory_admission_does_not_consume_report_or_renewal_capacity) | test(=native_initial_grant::published::presence::isolation::held_report_admission_preserves_inventory_and_renewal_progress) | test(=native_initial_grant::published::presence::isolation::independent_same_node_storage_heads_keep_other_present_after_one_missing) | test(=native_initial_grant::published::presence::isolation::occupied_presence_pg_connections_do_not_consume_renewal_pool) | test(=native_initial_grant::published::presence::legacy_barrier_then_v2_restoration_requires_new_private_observation) | test(=native_initial_grant::published::presence::newer_scoped_negative_survives_renew_race_and_expiry_never_falls_back_to_present) | test(=native_initial_grant::published::presence::normalized_binding_removal_then_restore_requires_new_scoped_read) | test(=native_initial_grant::published::presence::present_fact_never_bypasses_current_private_backing_or_agent_revocation) | test(=native_initial_grant::published::presence::scoped_head_failure_rolls_back_receipt_and_exact_retry_can_succeed) | test(=native_initial_grant::published::presence::scoped_receipt_and_authority_forgery_refuse_without_retaining_a_head) | test(=native_initial_grant::published::presence::scoped_record_is_not_a_grant_and_compatible_new_inventory_preserves_renewal_fact) | test(=native_initial_grant::published::receipt_failure_rolls_back_granted_hot_state_and_prepared_journal_then_exact_retry_succeeds) | test(=native_initial_grant::published::renewal::changed_private_material_and_revoked_agent_scope_cannot_extend_a_permit) | test(=native_initial_grant::published::renewal::exact_renewal_operation_cannot_mutate_journal_or_become_superseded_authority) | test(=native_initial_grant::publ