  | (binary_id(aq-server::it_native) & (test(=native_reconciliation::actual_publication_and_preparation_are_read_without_adopting_input_journal) | test(=native_reconciliation::credential_rotation_during_observed_node_lock_wait_refuses_old_authentication) | test(=native_reconciliation::expired_snapshot_does_not_close_and_actual_never_granted_receipt_is_required) | test(=native_reconciliation::explicit_scope_owner_refusals_and_cursor_progress_do_not_leak_other_bindings) | test(=native_reconciliation::mounted_contract_requires_current_auth_exact_nonce_and_bounded_strict_body) | test(=native_reconciliation::unsupported_history_advances_cursor_without_synthesizing_missing_receipts)))
  | (binary_id(aq-server::it_playbook) & (test(=playbook_host_adapters::operation_cancel_reaches_native_attempt)))
  | (binary_id(aq-server::it_schema) & (test(=schema33_phase_terminal::actual32_history_survives33_and_reserves_cleanup_without_terminal_effects) | test(=schema33_phase_terminal::actual_grant_cannot_commit_without_reserved_terminal_capacity) | test(=schema33_phase_terminal::already_open_writer_cannot_insert_legacy_started_for_actual_phase_grant) | test(=schema33_phase_terminal::collision_rolls_back33_without_changing_actual32_history) | test(=schema33_phase_terminal::legacy_parent::actual_current33_legacy_closure_retains_parent_against_delete_and_key_update) | test(=schema33_phase_terminal::old_snapshot_classifies_actual030_origin_even_without_visible032_grant) | test(=schema33_phase_terminal::ordered::actual32_open_owner_history_survives_registered33_upgrade) | test(=schema33_phase_terminal::relational_only_over_budget_backfill_rolls_back_entire_migration)))
