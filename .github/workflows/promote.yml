name: promote

# Moves the stable channel to a published release: verifies the release
# image's manifest and cosign bundle against the release workflow's
# identity, then points agent-q-release:stable at that exact image.
# Verification needs no OIDC token, so this workflow has no id-token.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to promote to stable (X.Y.Z, no "v")
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote
  cancel-in-progress: false

env:
  RELEASE_REPO: ghcr.io/electricjack/agent-q-release
  COSIGN_RELEASE: v3.1.3
  COSIGN_IDENTITY_REGEXP: '^https://github\.com/ElectricJack/agent-q/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
  COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3"
            exit 1
          fi

      # release.yml creates the GitHub Release last, after the smoke test of
      # the pushed images, so its existence means the whole run passed.
      - name: Require the published GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          draft=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || {
            echo "::error::no GitHub Release v$VERSION: wait for a green release.yml run for that tag"
            exit 1
          }
          if [ "$draft" != false ]; then
            echo "::error::the GitHub Release v$VERSION is a draft"
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      # The tag is resolved to a digest once; everything after uses the
      # digest, so a tag moved mid-run cannot slip in unverified.
      - name: Fetch and verify the release manifest
        id: verify
        env:
          VERSION: ${{ inputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$RELEASE_REPO:$VERSION" --format '{{json .Manifest}}' |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::cannot resolve $RELEASE_REPO:$VERSION to a digest"
            exit 1
          fi
          image=$RELEASE_REPO@$digest
          echo "release image: $image"
          docker pull --quiet "$image"
          mkdir -p fetched
          # The release image is FROM scratch: create (never run) a container
          # to copy the two files out.
          id=$(docker create "$image" none)
          docker cp "$id:/manifest.json" fetched/manifest.json
          docker cp "$id:/manifest.sigstore.json" fetched/manifest.sigstore.json
          docker rm "$id" >/dev/null
          # The same bindings aq-updater uses: the signature must come from
          # release.yml on refs/tags/v<version> at the manifest's
          # source_revision, not just from some release tag.
          got=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' fetched/manifest.json)
          if [ "$got" != "$VERSION" ]; then
            echo "::error::the manifest in $RELEASE_REPO:$VERSION is for version $got"
            exit 1
          fi
          sha=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["source_revision"])' fetched/manifest.json)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the manifest's source_revision '$sha' is not a commit SHA"
            exit 1
          fi
          cosign verify-blob --bundle fetched/manifest.sigstore.json \
            --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            --certificate-github-workflow-ref "refs/tags/v$VERSION" \
            --certificate-github-workflow-sha "$sha" \
            fetched/manifest.json
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Point the stable channel at the verified release image
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          # --prefer-index=false copies the manifest as is, so :stable has
          # exactly the verified digest.
          docker buildx imagetools create --prefer-index=false \
            -t "$RELEASE_REPO:stable" "$RELEASE_REPO@$DIGEST"
          now=$(docker buildx imagetools inspect "$RELEASE_REPO:stable" --format '{{json .Manifest}}' |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          if [ "$now" != "$DIGEST" ]; then
            echo "::error::$RELEASE_REPO:stable is $now, expected $DIGEST"
            exit 1
          fi
          echo "$RELEASE_REPO:stable -> $DIGEST"
