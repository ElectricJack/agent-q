name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds are one-shot: incremental state only costs time and cache space.
  # Interactive builds keep Cargo.toml's incremental dev profile.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build budgets (test binaries and lib size ratchets)
        run: python3 scripts/build-budget.py
      - name: Verify migration numbering and parallel additions
        run: |
          python3 scripts/migration_catalog.py
          python3 scripts/test-migration-catalog.py
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: Verify the pinned standalone worker and public contracts
        run: python3 scripts/check-worker-candidate.py --official
      - name: Verify the pinned independent session contract
        run: python3 scripts/check-session-contract.py
      - name: Verify pinned aq-git sources and Docker build stages
        run: python3 scripts/check-git-candidate.py --official
      - name: Verify the pinned dashboard release and server image wiring
        run: |
          python3 scripts/check-dashboard-candidate.py
          python3 scripts/test-dashboard-candidate.py
      - name: Verify the pinned playbook source closure
        run: python3 scripts/check-playbook-source.py
      - name: Verify the pinned independent lifecycle contract
        run: python3 scripts/check-lifecycle-contract.py
      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo clippy (aq-updater with test-verifier)
        run: cargo clippy -p aq-updater --all-targets --locked --features test-verifier -- -D warnings
      # The feature only changes src/execution.rs, src/execution/api.rs,
      # src/store.rs and tests/it_server/execution.rs; lint the lib and the
      # it_server test binary (execution and readiness, which the test job runs
      # with the feature), not every test binary again.
      - name: cargo clippy (recovery fixture)
        run: cargo clippy -p aq-server --locked --features recovery-test-support --lib --test it_server -- -D warnings

  agent-contract:
    name: scoped agent contract conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned developer dependencies and check contract
        run: |
          python3 -m venv "$RUNNER_TEMP/agent-contract-venv"
          "$RUNNER_TEMP/agent-contract-venv/bin/pip" install -r protocol/agent-access/v1/requirements-dev.txt
          "$RUNNER_TEMP/agent-contract-venv/bin/python" protocol/agent-access/v1/generate.py --check
          "$RUNNER_TEMP/agent-contract-venv/bin/python" -m unittest discover -s protocol/agent-access/v1 -p test_conformance.py -v

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.148
      # The server's manifest tests pass --source-revision r, which a binary
      # stamped with AQ_SOURCE_REVISION refuses. Tests build unstamped.
      - name: Check the build is unstamped
        run: |
          if [ -n "${AQ_SOURCE_REVISION:-}" ]; then
            echo "::error::AQ_SOURCE_REVISION is set; cargo test must build unstamped"
            exit 1
          fi
      # nextest runs every test in its own process, in parallel across all test
      # binaries (cargo test runs the binaries one after another). Test groups
      # and timeouts are in .config/nextest.toml.
      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace --locked --no-fail-fast --profile ci
      # nextest does not run doctests.
      - name: cargo test --workspace --doc
        run: cargo test --workspace --locked --doc
      - name: cargo nextest run -p aq-updater --features test-verifier
        run: cargo nextest run -p aq-updater --locked --no-fail-fast --profile ci --features test-verifier
      - name: Recovery authority and reserved control capacity regressions
        run: cargo nextest run -p aq-server --locked --no-fail-fast --profile ci --features recovery-test-support --test it_server -E 'test(/^execution::/) | test(/^readiness::/)'

  # The static updater and v2 CLI that release.yml ships, built the same way,
  # so musl breakage shows up here rather than at tag time.
  musl:
    name: aq-updater static build (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain with the static (musl) target
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build aq-updater (release, no features)
        run: cargo build --release --locked -p aq-updater --target x86_64-unknown-linux-musl
      # ring needs a C compiler for the musl target (release.yml does the same).
      - name: Build the v2 CLI (release, static)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends musl-tools
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --release --locked -p aqv2 --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/aqv2 | grep -q 'statically linked\|static-pie linked'

  postgres-only:
    name: no SQLite in Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: grep Cargo.lock for SQLite crates
        run: |
          if grep -E 'name = "(libsqlite3-sys|sqlx-sqlite)"' Cargo.lock; then
            echo "::error::Cargo.lock contains a SQLite crate; Agent Q is PostgreSQL only"
            exit 1
          fi

  smoke:
    name: smoke (built images)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Start the dedicated rootless sandbox daemon
        run: scripts/ci-sandbox-socket
      - name: scripts/smoke
        env:
          AQ_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/foundation-compatibility
        run: scripts/smoke
      - name: Retain foundation compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-compatibility
          path: ${{ runner.temp }}/foundation-compatibility
          if-no-files-found: ignore

  execution-smoke:
    name: real daemon and standalone synthetic worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Start the dedicated rootless sandbox daemon
        run: scripts/ci-sandbox-socket
      - name: scripts/execution-smoke
        env:
          AQ_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/synthetic-execution
        run: scripts/execution-smoke
      - name: Retain synthetic execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-execution
          path: ${{ runner.temp }}/synthetic-execution
          if-no-files-found: ignore

  recovery-smoke:
    name: distributed recovery failure matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: scripts/recovery-smoke
        env:
          AQ_RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/distributed-recovery
        run: scripts/recovery-smoke
      - name: Retain distributed recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributed-recovery
          path: ${{ runner.temp }}/distributed-recovery
          if-no-files-found: ignore
          retention-days: 7

  update-lifecycle:
    name: update lifecycle suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: scripts/update-lifecycle
        env:
          AQ_UPDATE_EVIDENCE_DIR: ${{ runner.temp }}/update-lifecycle-evidence
        run: scripts/update-lifecycle
      # On failure the suite copies its logs to /tmp/aq-update-lifecycle-logs.*
      - name: Upload the suite's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-lifecycle-logs
          path: |
            /tmp/aq-update-lifecycle-logs.*
            ${{ runner.temp }}/update-lifecycle-evidence
          if-no-files-found: ignore
          retention-days: 7
