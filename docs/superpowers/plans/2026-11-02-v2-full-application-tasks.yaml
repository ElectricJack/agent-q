  - key: E0
    epic: E
    repo: aq-server
    title: 'Local full-stack Compose for development: graph, supervised aq-git, dev auth'
    type: chore
    class: standard-high
    needs: []
    continues: [INT-01]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-server/docs/specs/0001-infrastructure-foundation.md]
    description: |
      compose.dev.yaml gains the services:
        - aq-graph, built from its pinned revision or image;
        - a supervised aq-git serve;
        - postgres;
        - aq-server with dev auth and no Cloudflare.

      It must run on the WSL2 desktop, and it is the stack MS0 and MS1 run against.

      Seed one project binding pointing at a scratch GitHub repository the owner designates, and one graph task.
    acceptance:
      - 'Test `compose_dev_reaches_ready_with_graph_and_git` (scripted) passes: all services healthy, the server reports graph and aq-git ready.'
      - Killing aq-git causes a restart, and the server reports degraded then ready.
    deliverables:
