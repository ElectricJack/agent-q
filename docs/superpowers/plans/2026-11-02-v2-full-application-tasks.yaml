  - key: B1
    epic: B
    repo: aq-worker
    title: Own the native execution contract and add delegated runner permits
    type: design
    class: deep-high
    review: adversarial
    needs: []
    continues: [CON-01, CON-02]
    spec:
      - aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md   # §6, SBX6, SBX16
      - aq-server/docs/architecture/0002-execution-and-recovery.md
      - aq-worker/docs/specs/0002-execution-and-agent-access.md
    description: |
      ### Goal
      Decide which repository owns the native execution wire contract (`aq-admission`). Then extend that contract with delegated runner permits, node re-adoption, per-sandbox channel identity and backend/template advertisement, and publish it with fixtures that aq-worker and aq-server both pin.

      ### What to build
      - **Ownership decision.** Ecosystem §3 says the "worker wire contract, examples and conformance fixtures" live in `aq-worker/protocol`, and that "a protocol package contains wire types, validation and fixtures only". Choose one option and record the choice and reasons in `docs/implementation/B1.md`:
        - (a) move `aq-admission` into aq-worker as the published contract, and have aq-server consume a pinned version; or
        - (b) keep it in aq-server and have ecosystem §3 amended to name its owner. Under (b), do **not** edit `0001-ecosystem-and-releases.md` yourself; file a `docs` task.
      - **Delegated permit** (SBX6, 0005 §6): `scope` is `preparation` (issued at acceptance) or `execution` (after the grant). It is bound to attempt ID, grant generation, sandbox identity, node ID plus boot ID, and the grant's hard deadline. It cannot accept offers, register incarnations, act for other attempts or outlive the grant. The wire format is your choice (0005 §13).
      - **Node re-adoption request/response** (0005 §4.1): the new boot lists each live sandbox's attempt and grant generation, and the response says which permits were re-bound to the new boot.
      - **Renewal reply "awaiting node re-adoption"**: this reply extends no deadline.
      - **Runner terminal/observation channel identity**: one per sandbox (SBX16). It carries the node identity so the server can enforce per-node aggregates.
      - **Registration additions** (0005 §3.2, SBX13, SBX18): backend kind; capabilities (`vm-isolation`, `nested-docker`, `suspend-snapshot`, `persistent-disk-during-attempt`); max concurrent sandboxes; optional spend ceiling; template digests with harness versions and estimated cold-start cost.
      - **Publish schemas and fixtures** for valid, invalid, replay and compatibility cases:
        - Required cases: a permit for another attempt, an expired permit, the wrong boot, execution scope used before the grant, and re-adoption replay.
        - Schemas and Rust types derive from one source, with a drift check.
        - Older peers decline the new capabilities explicitly: an unknown required capability declines (worker spec 0002 §7).

      ### Current state
      - The contract crate is `aq-server/crates/aq-admission` 0.1.11: `src/transport.rs:140` `Register{identity,runtime,capabilities,features}`; `src/control.rs` `ControlReply` and `FailureCode`; artifacts in `artifacts/`.
      - aq-worker vendors it at `aq-worker/vendor/aq-admission-0.1.11` (`aq-worker/Cargo.toml:8`, `crates/aq-worker/Cargo.toml:17`).
      - `aq-worker/crates/aq-worker-protocol` 0.2.0 is the legacy fixture contract (`protocol/execution-v2.schema.json`).
      - No permit, re-adoption or backend-advertisement types exist anywhere (grep).

      ### Interfaces
      - **Consumes:** nothing.
      - **Produces:** the published schema is authoritative; these names are suggestions:
        - `DelegatedPermit` and `PermitScope::{Preparation,Execution}`;
        - `ReadoptionRequest` and `ReadoptionResponse`;
        - the renewal outcome `awaiting_node_readoption`;
        - a per-sandbox channel ID;
        - backend advertisement and template inventory in registration.

        These are consumed by B2, B5a, B5b, B6a2, B6c and C4.

      ### Out of scope
      - Server-side permit issuance, enforcement and persistence (B2).
      - Runner use of permits (B6a2).
      - Controller registration and re-adoption (B5a, B5b).
      - Placement use of advertisements (C4).
      - Binding material leases to permits (C5a2).
      - Editing architecture or spec documents (file a `docs` task).

      ### References
      - `aq-server/docs/architecture/0001-ecosystem-and-releases.md` §3
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §3.2, §4.1, §6, §10 (SBX6, SBX13, SBX16)
      - `aq-worker/docs/specs/0002-execution-and-agent-access.md` §7
      - `aq-worker/protocol/README.md`
    acceptance:
