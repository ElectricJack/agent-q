# AQ v2 full application: task contracts (import source for AQ v1).
# Narrative, constraints and setup: 2026-11-02-v2-full-application-plan.md
# Spec paths are relative to the aq-platform root (the read-only `platform-ref` workspace).
# Every task also inherits the plan's Global Constraints and standard footer/subtasks.
#
# Schema:
#   key, epic, repo, title, type, class, needs[], continues[], spec[], review?,
#   integration? (pull_request; default direct), verification? (human), deferred? (importer skips),
#   description, acceptance[], deliverables[{id, kind, target}]
# `repo` maps to v1 workspace kind `<repo>-repo`.
# Revised 2026-11-02 after the Fable review and the owner's scope decisions (see the plan's revision log).

version: 1
project: aq-platform

epics:
  - {key: A, title: "Tracking and provenance"}
  - {key: B, title: "Execution core"}
  - {key: C, title: "Sandboxes and templates"}
  - {key: D, title: "Work loop and policy"}
  - {key: E, title: "Deployment and release"}
  - {key: F, title: "Supervisor and communication"}
  - {key: G, title: "Dashboard and human API"}
  - {key: H, title: "Session operations"}
  - {key: I, title: "Harnesses"}
  - {key: J, title: "Hardening and acceptance"}
  - {key: M, title: "Milestone gates"}

tasks:

# ── A. Tracking and provenance ───────────────────────────────────────────────

  - key: A1
    epic: A
    repo: aq-server
    title: Freeze the 2026-10-30 plan, namespace requirement IDs, add missing requirement sources
    type: docs
    class: standard-high
    needs: []
    continues: [AUD-00]
    spec:
      - aq-server/docs/plans/0001-v2-milestones.json
      - aq-server/docs/superpowers/plans/2026-11-02-v2-full-application-plan.md
    description: |
      Mark docs/plans/0001-v2-milestones.{json,md} as the frozen historical baseline, superseded for tracking by
      the v1-tracked program plan. Add an old→new task mapping table using each task's `continues:` list.

      Namespace the colliding requirement prefixes in the documentation index: aq-git R/V become GIT-R/GIT-V,
      aq-playbooks P/T become PB-P/PB-T, aq-worker T becomes WRK-T. Do not rewrite the component specs' own
      tables; add an alias note at the top of each.

      Register the missing requirement sources (aq-git 0001, aq-playbooks 0001, aq-graph 0001–0004, aq-server
      specs 0001/0003/0004/result-media, dashboard specs 0002/0003, worker specs 0003/0004, architecture 0005)
      in a new `docs/plans/requirement-sources.md`.

      Fix the stale statements found on 2026-11-02:
        - result-media-png.md says no storage implementation is authorized;
        - ecosystem §6 says the central install starts graph and supervises aq-git;
        - aq-worker protocol/README.md says contract 0.1.1.
      The aq-worker fix is a separate one-line change, filed as an emergent task if it is outside this workspace.
    acceptance:
      - "`python3 scripts/check-v2-plan.py` still passes on the frozen file, and the frozen header names this plan."
      - "requirement-sources.md lists every spec above with its ID prefix; no two sources share a prefix."
      - "The mapping table covers every in_progress/planned task in the old JSON."
    deliverables:
      - {id: check, kind: test, target: "python3 scripts/check-v2-plan.py"}
  - key: A3a
    epic: A
    repo: aq-git
    title: Release aq-git 0.2.0 from HEAD with a verifiable artifact and Git 2.56 qualification
    type: chore
    class: standard-high
    needs: []
    continues: [GIT-01]
    spec: [aq-git/docs/specs/0001-aq-git.md, aq-server/docs/architecture/0001-ecosystem-and-releases.md]
    description: |
      The shipped aq-git pin (f3660a8) does not exist in aq-git history, and HEAD (110 tests) is ahead of it,
      including the engine-crash-after-push recovery and the quota symlink-probe fixes.

      Tag v0.2.0 on main and publish a GitHub release containing a source archive and a linux-x86_64 binary built
      for the bookworm glibc baseline, each with its SHA-256 and a build record (toolchain, target, lockfile
      digest, source revision).

      Run the full suite under Git 2.56.0 (the version the images ship) and record compatibility with 2.43.
    acceptance:
      - "Tag v0.2.0 exists on origin; release assets and checksums download and verify."
      - "`cargo test --locked --workspace` passes with Git 2.56.0 on PATH; evidence records both Git versions."
      - "docs/release-status.md names v0.2.0 and its remaining limits."
    deliverables:
      - {id: tests, kind: test, target: "cargo test --locked --workspace"}
  - key: A3b
    epic: A
    repo: aq-server
    title: Re-pin the shipped aq-git to the 0.2.0 release
    type: chore
    class: standard-high
    needs: [A3a]
    continues: [AQ-09]
    spec: [aq-server/docs/source-retention.md]
    description: |
      Replace vendor/git-candidate.json and the vendored archive with the aq-git v0.2.0 release: source revision,
      archive digest, binary digest and Git 2.56.0. Pin the builder by digest.

      Re-run the source-retention and project-binding tests that drive aq-git. Rebuild Dockerfile and
      Dockerfile.worker and verify the embedded binary digest.
    acceptance:
      - "vendor/git-candidate.json source_revision resolves in the aq-git repository."
      - "`cargo test --locked --workspace` passes; the image build verifies the aq-git digest."
    deliverables:
      - {id: tests, kind: test, target: "cargo test --locked --workspace"}
  - key: A4
    epic: A
    repo: aq-server
    title: "Image and CI hygiene: digest-pinned bases, state-format default, stale vendor trees, check scripts in CI"
    type: chore
    class: standard-high
    needs: []
    continues: [INT-01]
    spec: [aq-server/docs/architecture/0001-ecosystem-and-releases.md]
    description: |
      - Pin `rust:1.96.1-bookworm` and `debian:bookworm-slim` by digest in Dockerfile and Dockerfile.worker.
      - Make the Dockerfile `AQ_STATE_FORMAT` default derive from source, so a plain build cannot produce a label
        the updater refuses (currently 40 vs source 41).
      - Delete the vendored playbook trees excluded from the workspace (42f9449, a463e59, d3bd349).
      - Add scripts/check-playbook-source.py and scripts/check-lifecycle-contract.py to ci.yml.
    acceptance:
      - "A plain `docker build .` produces a state-format label equal to the source constant."
      - "CI runs both check scripts; the removed vendor trees are absent and the build still passes."
    deliverables:
