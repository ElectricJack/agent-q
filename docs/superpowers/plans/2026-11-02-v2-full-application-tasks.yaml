      - The milestone definition is in plan §1 ("MS3: daily driver").
      - The hosted stack and workers come from MS2.
      - boat setup (dedicated organization, scoped key, template snapshots) is described in plan §5.8 and done by C7.

      ### Interfaces
      - **Consumes:** MS2, C7, D2, D4–D9, F1a/F1b, F2–F5, F7, G1a/G1b, G2–G8 and I1.
      - **Produces:** MS3.md, the demo script and the owner's approval that this replaces v1, which gates MS4.

      ### Out of scope
