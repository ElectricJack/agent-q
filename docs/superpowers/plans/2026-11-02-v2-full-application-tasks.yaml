      ### What to build
      - **The runbook.** Follow the foundation spec's sequence: VPS and SSH/recovery console; firewall, image, Docker/Compose and host updater; DNS, Tunnel and the Access apps; secrets, release reference and data paths; start and verify; enroll a worker; reboot and verify.
