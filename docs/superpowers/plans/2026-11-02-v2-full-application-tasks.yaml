  - key: G9
    epic: G
    repo: aq-dashboard
    title: Playbook start, cancel and activation
    type: feature
    class: standard-high
    needs: [D9]
    continues: [UI-08, API-05]
    spec: [aq-dashboard/docs/specs/0002-product-design.md]
    description: |
      ### Goal
      Let the owner start a run, cancel a run, and activate or roll back a playbook artifact from the Playbooks page, pending-safe.
      ### What to build
      - Send each action through `POST /api/v1/actions` using the playbook kinds D9 registers, and poll `GET /api/v1/operations/{id}`.
        - Expected kinds: start run, cancel run, activate artifact, roll back activation.
        - Use D9's exact published names and payload schemas.
      - Placement, from `06-playbooks.png`:
        - Tabs: Runs / Definitions / Activations.
        - The run list sits beside the selected run's detail (step timeline, "Waiting on", "Child workflows", "Recent evidence").
        - Cancel goes on the selected run.
        - Start goes on a definition, or on Runs, with a typed input form; no raw JSON editor.
        - Activate and Roll back go on an artifact revision in Activations.
      - Rules (0002 §8):
        - Updating an active definition never relabels existing runs. Show "This run: definition vN" and "Definition vM is active for new runs".
        - Activation affects future runs only.
        - Install, compile and activate are separate operations.
        - Resuming a run cannot bypass an outstanding decision.
        - Cancel is an intent ("Cancellation requested") until confirmed.
        - Ask for confirmation on cancel, activate and rollback.
        - Handle pending, conflict, rejected and unknown per 0003 §7, preserving inputs.
      - Gate each control on its bootstrap capability. When an action is disallowed, show the reason from its action descriptor.
      - Phone: a vertical step timeline and one detail page.
      - Tests:
        - named `playbook_cancel_shows_pending_safe_state`;
        - mocked and live tests for each action;
        - captures at 1440 and 390 px reviewed against 06-playbooks.
      ### Current state
      - `features/playbooks/Playbooks.tsx` (103 lines) already has the Runs/Definitions/Activations tabs. It reads `/api/playbooks/inspection/runs`, `/runs/{id}` and `/admissions`, plus `CurrentCatalog.tsx` and `LoadedDefinitions.tsx`.
      - Capabilities in use: `playbooks.inspect`, `playbooks.catalog.read`, `playbooks.loaded-definitions.read`.
      - Server owner routes exist outside the union (`playbooks/api.rs:39-57`): `/api/playbooks/admissions`, `/runs/{id}/cancel`, `/drive`. There are no activation or rollback routes yet; D9 adds them.
      - What the Activations tab currently renders is (unverified).
      ### Interfaces
      Consumes: D9's install/activate/rollback API and its action-union kinds; G1a operation lookup.
      Produces: Playbooks page actions.
      ### Out of scope
      - Server API and union adapters (D9).
      - The mockup's "Create playbook" button and any authoring editor. 0002 §1 excludes arbitrary workflow editors from this release.
      - Answering decisions (Decisions page, F5). Full visual/WCAG sign-off (G11).
      ### References
      - aq-dashboard/docs/specs/0002-product-design.md §8 "Playbooks".
      - aq-dashboard/docs/specs/0003-dashboard-api.md §7.
      - aq-dashboard/docs/design/06-playbooks.png.
    acceptance:
