tasks:

# ── A. Tracking and provenance ───────────────────────────────────────────────

  - key: A1
    epic: A
    repo: aq-server
    title: Freeze the 2026-10-30 plan, namespace requirement IDs, add missing requirement sources
    type: docs
    class: standard-high
    needs: []
    continues: [AUD-00]
    spec:
      - aq-server/docs/plans/0001-v2-milestones.json
      - aq-server/docs/superpowers/plans/2026-11-02-v2-full-application-plan.md
    description: |
      ### Goal
      Freeze the 2026-10-30 milestone plan as history, give every requirement source a unique ID prefix, and correct three stale statements, so the program can be tracked against this plan without ID ambiguity.

      ### What to build
      - **Freeze** `docs/plans/0001-v2-milestones.{json,md}`: add a header naming `docs/superpowers/plans/2026-11-02-v2-full-application-plan.md` as the tracking authority. The `.md` is generated, and `check-v2-plan.py` fails unless the file equals `render()` output. So add the header through the JSON plus `render()` in `scripts/check-v2-plan.py`, then run `--render`.
      - **Old→new mapping table:** one row per old task that is `in_progress` or `planned` (66 tasks), naming the new task keys whose `continues:` lists it. Two open old tasks appear in no `continues:` list: **API-04** (review inbox discovery) and **UI-07** (live decision inbox). Record them explicitly, either as "no successor" or with the owner's decision. Don't silently omit them.
      - **New `docs/plans/requirement-sources.md`:** list every source with its ID prefix:
        - the existing sources: E, X, D, W, U, P, H, R, S, N, C;
        - architecture 0005: SBX, DEP;
        - aq-git 0001;
        - aq-playbooks 0001;
        - aq-graph 0001–0004;
        - aq-server specs 0001, 0003, 0004 and result-media;
        - dashboard specs 0002 and 0003;
        - worker specs 0003 and 0004.
      - **Namespaces:** aq-git R/V → GIT-R/GIT-V; aq-playbooks P/T → PB-P/PB-T; aq-worker T → WRK-T. Don't rewrite component tables. Add an alias note at the top of each affected spec.
      - **Stale fixes:**
        - `docs/specs/result-media-png.md` lines 3–5 say "No storage implementation or migration is authorized". Migration `0036_result_media_owner.sql` and `crates/aq-result-media` exist.
        - `docs/architecture/0001-ecosystem-and-releases.md:115` (§6) says the central install starts graph and supervises aq-git. It does neither yet (E0/E1a deliver it). Mark the sentence as the target design, with its status.
        - `aq-worker/protocol/README.md:18` says 0.1.1, but the crate is 0.2.0. That repository is outside this workspace, so file an emergent one-line task.

      ### Current state
      - `python3 scripts/check-v2-plan.py` **fails today** ("missing owner repo/directory: AUD-00"): 57 old tasks use `repo: agent-q`, now renamed `aq-server`. An alias at the `is_dir()` check makes it pass. Fix the checker, not the frozen data.
      - aq-git also uses P1–P7 (performance, §14.1). These collide with architecture 0003 P and aq-playbooks P, which the namespace list above doesn't cover.
      - Several sources have no ID table, so a prefix has to be assigned: aq-graph 0001–0004, aq-server 0001/0003/0004/result-media, dashboard 0002/0003, worker 0003/0004.
      - No "documentation index" file exists. Treat requirement-sources.md as the index.

      ### Interfaces
      Consumes: the `continues:` field of every task in the tasks YAML.
      Produces: `docs/plans/requirement-sources.md` and the namespaced prefixes (GIT-R, GIT-V, PB-P, PB-T, WRK-T). The MS4 acceptance matrix uses both.

      ### Out of scope
      - Alias notes inside aq-git, aq-playbooks or aq-worker specs, if those repositories aren't in this workspace: file emergent docs tasks.
      - Other stale topology text, such as 0005 §9 saying "aq-worker-cloud (backend boat)": record it in the evidence and file a docs task.
      - aq-worker protocol ownership (B1).
      - Changing any task's scope or edges in the 2026-11-02 YAML.

      ### References
      - `scripts/check-v2-plan.py`: `read_plan()` and `render()`.
      - Gap analysis §4, "Tracking gaps in the plan itself".
      - Program plan §3, "How old plan IDs map".
    acceptance:
