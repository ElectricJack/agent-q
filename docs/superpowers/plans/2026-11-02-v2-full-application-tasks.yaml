    title: "MS2 gate: hosted"
    type: operator
    class: standard-high
    verification: human
    needs: [MS1, A1, A4, C5b, C6b, I4b, E1a, E1b, E1c, E2, E3, E5, E6a, E6b]
    continues: []
    spec: [aq-server/docs/superpowers/plans/2026-11-02-v2-full-application-plan.md]   # §1, §5
    description: |
      ### Goal
      Demonstrate to the owner that the hosted topology works. The VPS stack runs behind Cloudflare, the MS1 scenario passes on both enrolled workers with an API key and with a ChatGPT login, a VPS reboot recovers, and off-host backups are configured. This is a human-verified gate. Its agent runs and records the scenario; it does not implement features.

      ### What to build
      1. **Topology check.** Record:
         - the VPS stack from E1a–E1c (server with built-in dashboard, PostgreSQL, aq-graph, supervised aq-git, cloudflared, supervisor host, `aq-worker-cloud`) and its image digests;
         - the human hostname (owner Access) and the machine hostname (service tokens);
         - the desktop worker running as a container on WSL2 (E6a), enrolled to the VPS machine hostname;
         - the VPS cloud worker on docker-local with its own rootless sandbox daemon (E6b).
      2. **Rerun the MS1 scenario steps 1–5** (dependent tasks with automatic completion and next start, cancel, fail and retry, worker and server restart), with Codex and an API key, once on each worker.
         - Evidence: the same IDs, receipts and graph versions as MS1, plus worker and node IDs.
      3. **Repeat once on each worker with a ChatGPT login** enrolled through C5b and installed by C6b (I4b).
         - Evidence: the credential profile name (never its contents), the refresh-lineage revision if a refresh occurred, and wipe at teardown.
      4. **Reboot the VPS mid-attempt** (Review Focus 4). Runners resume renewal if the server returns within the renewal window; otherwise they stop and preserve.
         - Evidence: timestamps, the renewal log, the attempt disposition, no duplicate effects.
      5. **Off-host backups (E5):** show the configured job and one recent encrypted off-host backup, with destination and timestamp. Don't restore; that is J5.

      Then:
      - Make the MS1 demo script take a target (local or VPS) and worker, or add an MS2 script under `scripts/`.
      - Write `docs/implementation/MS2.md` with commands, digests, results per step, VPS resource use and limits. Then request owner verification.

