  - key: H3
    epic: H
    repo: aq-server
    title: Stall ladder with nudge
    type: feature
    class: standard-high
    needs: [H1, F3]
    continues: [AQ-23]
    spec: [aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md]   # S1, S4, S5
    description: |
      ### Goal
      AQ detects stalled sessions from evidence and climbs a bounded ladder: observe, nudge at a safe boundary, notify, stop and preserve, replace. It never mistakes waits, human control or missing data for progress or for a stall.

      ### What to build
      - A deterministic, persisted state machine per session and task episode. The versioned execution policy sets evidence windows, grace periods, nudge limits and backoff, the replacement ceiling and the escalation destination (0004 §2.3).
      - Rungs:
        1. **Suspected stall.** Expose evidence and freshness. Provider backoff, a registered wait (H4), a known long check, human terminal control and unavailable observations are distinct explanations. Unknown observations raise a monitoring incident and never trigger destructive recovery.
        2. **Nudge.** Send bounded, durable guidance through F3's mailbox and safe-boundary path. Record attempted, deferred, delivered and unknown separately. While the input state is unknown or a human controller holds the pane, defer to the inbox and never inject. AQ's own nudge never resets the progress clock. Repeated deferrals escalate visibly.
        3. **Notify.** Notify through F4's policy, once per episode.
        4. **Stop and preserve, then replace.** Use the typed stop, confirm stopped writers, retain work, then schedule a replacement attempt from a bounded handoff within the shared retry budgets (B4).
        5. **Quarantine and escalate.** When recovery is exhausted or a stop is uncertain, block conflicting scheduling and record the exact held resources. Scope the quarantine to the session or lineage, never the whole worker.
      - Every action has a stable ID, an expected revision and an effect receipt that survive a daemon restart.
      - Progress opens a new evidence interval but never resets lineage-wide ceilings. Cancellation, holds, hibernation and terminal ownership are rechecked at each admission.
      - Heartbeats, repaints, transcript mtime, AQ-injected text and token growth alone do not count as progress (S5).
      - Add the owner-facing nudge action route used by the dashboard (G10), behind the action union (G1a).

      ### Current state
      - No stall ladder exists in aq-server. AQ-23 is open (0004 "Current implementation boundary").
      - Observation inspection is in `crates/aq-server/src/observations/inspection.rs`. Terminal input-uncertainty states (queued, injecting, delivery_unknown) are in `crates/aq-server/src/terminal/`.
      - Stop and cancel come from B3, and replacement attempts from B4.

      ### Interfaces
      Consumes:
      - H1/H2 observations.
      - F3 delivery receipts and the safe boundary.
      - F4 notifications.
      - H4 wait state.
      - B3 stop and B4 replacement.

      Produces:
      - Per-session stall state, nudge records and recovery receipts. G10 consumes them (session health with the nudge action).

      ### Out of scope
      - The worker-side delivery mechanics: F3.
      - Notification transport: F4.
      - Escalation reminder policy: F6.
      - Dashboard stall views: G10.
      - Playbook-authored escalation policy: D8 and D9.

      ### References
      - aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md §2.1 (nudge paragraph), §2.3, §7 S4–S5
      - aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md §5.1 (input uncertainty)
      - v1: agent-queue2/src/stall_watch.py
    acceptance:
      - "Test `stalled_session_is_nudged_then_escalated` passes."
      - "Test `nudge_never_injects_during_unknown_input_state` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace stalled_session_is_nudged_then_escalated}
      - {id: t2, kind: test, target: cargo test --locked --workspace nudge_never_injects_during_unknown_input_state}
  - key: H4
    epic: H
    repo: aq-server
    title: Durable waits registry and agent wait routes
    type: feature
    class: deep-high
    needs: [B2]
    continues: [AQ-25]
    spec: [aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md]   # C1, C4, C5
    description: |
      ### Goal
      Agents can register a durable, verified wait on a message, task, decision or question. They can inspect it and consume its outcome exactly once, with no lost wake-ups and no duplicate wake-ups across replays and restarts.

      ### What to build
      - A durable wait registry in aq-server, in SQL with the next free migration number. It drives the pure `aq-wait-engine` reducer: CAS transition plans, holds, subscriptions and resume intents.
      - The record binds:
        - caller, task and attempt;
        - continuation generation;
        - canonical predicate digest;
        - source references, revisions and cursors;
        - policy revision;
        - original creation time, deadline and immutable outcome.
      - Idempotency (C1, C5):
        - Re-registering with the same idempotency key returns the original record. Changed bytes conflict.
        - Re-registering never resets age or budgets.
      - Agent routes on the agent listener, under the per-attempt credential, using `aq-lifecycle-api` request types (`RegisterWait`, `Inspect`, `ContinuationAck`; capabilities `aq.lifecycle-api.wait`, `aq.lifecycle-api.inspect` and `aq.lifecycle-api.continuation-ack`). Choose route names (for example `/v1/agent/waits/...`) and publish their schemas and fixtures.
      - Sources in this task:
        - `Message`: thread plus exclusive cursor;
        - `Task` and `Dependency`;
        - `HumanDecision`, which also covers questions.
        - Unknown kinds refuse.
      - Register and install the central hold durably before returning success. Then re-observe authoritative state, so an event committed before or during registration is not lost. Run bounded periodic reconciliation for missed events.
      - Outcomes: `satisfied`, `source_failed`, `cancelled`, `deadline_reached` and `source_unavailable`. Temporary failures stay pending with visible freshness.
      - Races (0004 §4.3):
        - Resolving a wait commits the outcome and an idempotent resume intent in one transaction.
        - A duplicate ack returns the original receipt. A stale generation cannot consume it.
        - Task-addressed mail is held for a successor. Normal mail does not satisfy a dependency wait unless the predicate says so.
      - Bounds: at most 32 members per wait (`MAX_MEMBERS`), one active suspension wait per attempt, and a maximum age of 30 days (`MAX_AGE_MS`). Detect self-waits and known cycles.
      - Add the owner-facing read routes for waits (list and show) used by the dashboard waits view (G10).

      ### Current state
      - `crates/aq-wait-engine` is pure, with 17 tests, and is not a dependency of `crates/aq-server` (AQ-25-pure-engine.md).
      - The wire types are in `crates/aq-lifecycle-api/src/waits.rs` (`Condition` at line 31) and `lib.rs` (`Command` at line 111, constants at lines 23–29). There is no HTTP route.
      - Message cursors exist in the AQ-11 mailbox. The decision owner is in `crates/aq-server/src/reviews.rs`.

      ### Interfaces
      Consumes:
      - B2's permits and scoped credentials.
      - The AQ-11 mailbox, the graph task state and the decision owner.

      Produces:
      - Wait records, outcomes and resume intents.
      - The agent wait routes, which F5 (question waits), H5 (suspension), H6 (wake scheduling), H3 (wait-aware stall rung 1) and G10 consume.

      ### Out of scope
      - Checkpointing and physical parking: H5.
      - Scheduling continuation attempts on wake: H6.
      - Question decisions: F5.
      - Timer, operation, playbook and resource sources beyond what the tests need: later work.
      - The dashboard waits view: G10.

      ### References
      - aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md §4.1, §4.3, §6, §7 C1/C4/C5
      - aq-server/docs/implementation/AQ-25-pure-engine.md
      - v1: agent-queue2/docs/guides/agent-waits.md, docs/guides/wait-source-contract.md
    acceptance:
      - "Test `wait_on_decision_wakes_once_after_resolution` passes."
      - "Test `wait_registration_replay_is_idempotent` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace wait_on_decision_wakes_once_after_resolution}
      - {id: t2, kind: test, target: cargo test --locked --workspace wait_registration_replay_is_idempotent}
  - key: H5
    epic: H
    repo: aq-worker
    title: Hibernation checkpoint and continuation bootstrap
    type: feature
    class: deep-high
    needs: [H4, B5b]
    continues: [WRK-16]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-worker/docs/specs/0004-session-observation-and-suspension.md]   # 0005 §4 step 8
    description: |
      ### Goal
      A waiting agent can hibernate. The runner checkpoints its work to central retention and ends the attempt. Later, a continuation attempt starts in a new sandbox from that retained checkpoint.

      ### What to build
      - Physical suspension in the runner and node, following worker spec §3:
        1. Receive a durable `SuspensionIntent` bound to the wait, the continuation generation, the session/attempt, the node/boot and the assignment generation. Journal its digest before any effect. Repeats recover the same transition.
        2. Request the bounded checkpoint summary through the scoped AQ API (`Checkpoint`, summary at most 16,384 bytes). The summary is a claim, not stop proof.
        3. Close input, then stop every writer through the guardian.
        4. After a confirmed stop, take the aq-git snapshot, including supported dirty and untracked work. Upload it through the resumable retention path with exact receipts.
        5. Report a `ParkingReport` with a distinct suspended disposition, never success or failure. Report stop certainty, retained bytes, receipts and effects separately.
        6. Release compute after stop proof. Protected disk is released only by explicit directive.
      - Before retention, delete the permit, the agent credential and the subscription-login material. Nothing retained may contain them. Scan the retained state for known credential paths.
      - Continuation bootstrap (worker spec §4): a wake is a normal new grant with a `ContinuationAttachment`. Hydrate the retained source and summary from central retention on any node; a local cache is optional. Start a fresh tmux session with fresh scoped credentials. The agent must send `BootstrapAck` for the exact generation before normal operations. A lost ack keeps the same receipt identity. A stale prior attempt cannot clear the hold.
      - Crash tests cover every journal, stop, snapshot, upload, receipt and release boundary.
      - Decision already made: no boat warm start. Hibernation uses checkpoint-to-retention only.

      ### Current state
      - The CON-03 types are in `aq-worker/crates/aq-lifecycle-protocol/src/continuation.rs`: `Checkpoint` (line 83), `SuspensionIntent` (95), `ParkingReport` (205), `ContinuationAttachment` (314), `BootstrapAck` (357). No runtime uses them.
      - Source upload steps are extracted in `crates/aq-worker/src/source_transfer/steps.rs` (WRK-16A).
      - Hydration from retention is B6c's.
      - The server-side suspension directive and the acceptance of the suspended disposition are not clearly owned (unverified). Coordinate with H4 and H6. Do not let D3 settlement treat parking as a failure.

      ### Interfaces
      Consumes:
      - H4's waits and checkpoint/ack routes.
      - B5b's preserve-before-destroy and re-adopt.
      - B6c's hydration.
      - C6b's subscription wipe.

      Produces:
      - Parked continuations with retention receipts, and a continuation startup path. H6 schedules onto it.

      ### Out of scope
      - Wait registration and verification: H4.
      - Choosing when and where to wake: H6.
      - The boat warm start: deferred (0005 §4 step 8).
      - Native provider conversation resume: optional, not required.

      ### References
      - aq-worker/docs/specs/0004-session-observation-and-suspension.md §3, §4, §5 (suspension and continuation bullets)
      - aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md §4.2
      - aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md §4 step 8
    acceptance:
