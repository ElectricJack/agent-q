      - plan `2026-11-02-v2-full-application-plan.md` §1, §5 steps 3–7, Review Focus 4
      - aq-server `docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §3.1, §9
    acceptance:
      - "The owner approves."
    deliverables:
      - {id: demo, kind: file, target: "docs/implementation/MS2.md"}
  - key: MS3
