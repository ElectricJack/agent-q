  - key: G1a
    epic: G
    repo: aq-server
    title: Action union, common error envelope and operation lookup
    type: feature
    class: deep-high
    needs: []
    continues: [API-02, API-10]
    spec: [aq-dashboard/docs/specs/0003-dashboard-api.md]
    description: |
      ### Goal
      Give human clients one durable, finite mutation entry point, `POST /api/v1/actions`, plus `GET /api/v1/operations/{id}`, a common error envelope and one shared opaque cursor codec. Later tasks then only register action kinds.
      ### What to build
      - `POST /api/v1/actions` takes the envelope `{operation_id, kind, subject, expected_versions, reason?, payload}` (0003 §7). `kind` is a finite, versioned tagged union, and each kind has its own JSON Schema and adapter. An unknown kind or unknown field returns 422 in the error envelope. Never accept arbitrary command names, URLs, shell fragments or raw graph mutations.
      - Durable admission: before dispatch, bind `operation_id` to the principal, the scope and a canonical request digest (`sha256:` over canonical JSON).
        - An identical retry returns the retained disposition.
        - The same ID with changed bytes returns 409.
        - Every retry rechecks authentication and current authorization. An existing receipt never grants a new effect.
      - Dispositions are `pending | confirmed | conflict | rejected | unknown`; 202 is not completion. An operation response carries disposition, request digest, created/updated times, subject refs, receipt refs, affected entities and the permitted recovery action.
      - `GET /api/v1/operations/{id}` serves the original principal only. Another principal, or a missing row, gets a neutral 404, which clients read as "admission unknown".
      - Retention: at least 90 days plus all unresolved operations. Retired-ID tombstones block replay. Declare retention in capability metadata.
      - Error envelope for `/api/v1/*`: `{request_id, code, message, retryable, operation_id?, field_errors?, current_versions?, retry_after_ms?}` with bounded safe strings.
        - Statuses: 401, 403, neutral 404, 409, 410 (expired cursor or bytes), 413, 422, 426, 429/503.
        - Before durable admission an error may have no `operation_id`. After admission, return the retained disposition.
      - Cursors: one shared authenticated codec bound to principal, authorization partition, scope, normalized filters, sort, page size and snapshot. Expiry returns a typed restart instruction.
      - Storage: add a generic operations journal through the next migration and bump `STATE_FORMAT_VERSION` (currently 41, `crates/aq-server/src/lib.rs:52`).
      - Ship no production kinds. Exercise the lifecycle with a test-only kind (`#[cfg(test)]` / `test_support`). Leave the bootstrap capability `dashboard.actions` false.
      - Publish the schema as `aq-server/protocol/dashboard-actions/v1/` (schema.json + README), mirroring `protocol/dashboard-read/v1/`.
      ### Current state
      - No `/api/v1/actions` or `/api/v1/operations` exists (verified by grep).
      - `dashboard_api.rs:180-189` mounts bootstrap, overview, sessions, sessions/{id} and projects. Its private `Error` (lines 36-108) emits only `{request_id,code,message,retryable}` and maps cursor restart to 409 `cursor_restart_required`.
      - Per-feature journals and lookups exist: `human_graph_operations` (migration 0034, `task_id = operation_id`) with `/api/human/operations/{op}`; the supervisor conversation (0035) with `/api/human/conversations/{c}/operations/{op}`; review decisions.
      - Two cursor codecs exist: `dashboard_api/runtime.rs` and `agent_access/human/cursor.rs`.
      - The global `AppError` (`error.rs`) has another shape used by worker/admin routes; leave it unchanged outside `/api/v1`. The human router is merged in `lib.rs:247-270` under `authz::csrf_guard` (`X-AQ-Request: 1`).
      ### Interfaces
      Consumes: human identity (`authz::CurrentUser` / `RequireOwner`) and the CSRF guard.
      Produces:
      - `POST /api/v1/actions` and `GET /api/v1/operations/{id}`;
      - an action-kind registration API, where kinds are dotted `domain.verb` names such as `task.create`;
      - the shared error-envelope type and the shared cursor codec;
      - `protocol/dashboard-actions/v1/`.

      Used by G1b, G2, G4, G6, D9, F2 and F7.
      ### Out of scope
      - Migrating task create, decision resolve and supervisor send; pending operations in bootstrap; fixtures (G1b).
      - Task and knowledge kinds (G2). Playbook kinds (D9). Enqueue and graph creation (F2). `aqv2` (F7).
      - Results, comments and media endpoints (G6). Any dashboard change (G3, G8).
      - Editing `docs/specs/*`. Record spec deltas in evidence (docs steward rule).
      ### References
      - aq-dashboard/docs/specs/0003-dashboard-api.md §7 "Actions, receipts and error contract"; §2 (envelope and cursor rules); §8 (publication).
      - aq-server/protocol/dashboard-read/v1/README.md (publication pattern).
    acceptance:
      - Test `unknown_effect_operation_is_recoverable_by_lookup` passes.
      - Test `action_union_rejects_unknown_kind_with_envelope` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace unknown_effect_operation_is_recoverable_by_lookup}
      - {id: t2, kind: test, target: cargo test --locked --workspace action_union_rejects_unknown_kind_with_envelope}
    priority: high
