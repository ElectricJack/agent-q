  - key: H6
    epic: H
    repo: aq-server
    title: Hibernation wake scheduling
    type: feature
    class: standard-high
    needs: [H4, H5]
    continues: [AQ-26]
    spec: [aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md]   # C2, C3, C6
    description: |
      ### Goal
      When a hibernated wait resolves, AQ schedules exactly one continuation attempt with fresh authority on any eligible node. That includes a different node when the original is offline, and the behaviour is the same for central and remote sessions.

      ### What to build
      - Consume H4's resume intent, which is committed with the wait outcome. Derive a scheduler-ready projection. `resume_pending` is not running. Wait outcome, parking, capacity and acknowledgement are independent states (0004 §4.3).
      - Wake admission goes through ordinary project and node eligibility, profile selection, fairness (B4's fair scheduling), grants and resource admission. It never requires the original sandbox or node once central retention is complete (C3).
      - Each wake creates a new attempt, a new session and fresh scoped credentials, with lineage linking to the predecessor. Carry forward the retry, time and cost budgets; never reset them.
      - Re-resolve the current profiles and context, and record any differences from the predecessor.
      - Build the `ContinuationAttachment`: predecessor, generation, retained source and summary receipts, verified outcome, held task mail, remaining budgets.
      - Each dispatch generation has one durable winning attempt. A retry queries that attempt instead of launching another.
      - Failed launches or acks get bounded recovery and then escalation, never a permanent `resume_pending` loop.
      - Cancellation, completion and supersession serialize against wake admission. Cancelling the task prevents resume. An operator early resume is labelled `manual_override`. Extending a deadline does not reset age.
      - Wake bursts are coalesced, paginated and fairly scheduled.
      - Central supervisor sessions (F1a) use the same wait and continuation semantics through their central authority adapter. Worker nodes never receive supervisor credentials (C6).
      - Preference for a warm-start node: warm start is deferred and no warm-start snapshots exist, so this preference has nothing to act on. Do not build warm-start placement.
      - Own the server side of suspension: issue the suspend directive, accept and retain the checkpoint, and record a `suspended` disposition that D3's settlement treats as neither success nor failure.

      ### Current state
      - Native scheduling is in `crates/aq-server/src/profiled_execution/producer/workflow.rs`: `first_eligible_task` at line 191 skips tasks with `started>0`, and `poll` follows it.
      - Continuation policy code exists at `profiled_execution/continuation_policy.rs`, but its relation to waits is unverified.
      - No wake scheduler exists. AQ-26 is open.

      ### Interfaces
      Consumes:
      - H4's resume intents and outcomes.
      - H5's parking reports and continuation startup.
      - B4's replacement attempts and fair scheduling.
      - B2's fresh permits.
      - F1a's central session owner.

      Produces:
      - Continuation offers, lineage-linked attempts and wake state. G10 (waits view) consumes them.

      ### Out of scope
      - The wait registry and verification: H4.
      - Checkpointing and bootstrap inside the sandbox: H5.
      - Boat warm start: deferred.
      - The 10,000-continuation scale profile: deferred (measured in J3 instead).
      - Dashboard views: G10.

      ### References
      - aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md §4.3, §7 C3/C4/C6
      - aq-worker/docs/specs/0004-session-observation-and-suspension.md §4
      - aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md §4 step 8
    acceptance:
      - "Test `wake_schedules_continuation_on_other_node_when_original_offline` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace wake_schedules_continuation_on_other_node_when_original_offline}
  - key: H7
    epic: H
    repo: aq-worker
    title: Terminal renderer snapshots and full output path
    type: feature
    class: standard-high
    needs: [B6c]
    continues: [WRK-14, AQ-21]
    spec: [aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md]   # R4, R5
    description: |
      ### Goal
      Terminal viewers get correct snapshots and complete, sequenced output with explicit gaps over the per-sandbox channel. They can reconnect without relaunching the session, and heavy output never delays grant renewal.

      ### What to build
      - Link `aq-terminal-renderer` 0.1.0 into the runner's terminal path. Feed it ordered bytes and resizes (`Renderer::bytes`, `resize`, `gap`).
      - Produce snapshot barriers: a renderer `StateImage` (`image()` and `restore()`) bound to the terminal epoch and output sequence watermark. Prove that buffered output across the barrier is neither lost nor applied twice (R4).
      - A new terminal epoch resets renderer state. Unsupported or inconsistent input marks the renderer inconsistent; treat it as a gap and never guess.
      - Output path: one bounded read-only tmux control-mode observer per verified pane (WRK-14 output plan). It decodes `%output` and `%extended-output` to literal bytes.
      - Frames bind the epoch, sequence, length and digest. An identical retransmit is deduplicated. A reused sequence with different bytes conflicts. Missing or evicted ranges are explicit gaps.
      - Bounds from 0003 §5.3:
        - frames at most 64 KiB;
        - 256 KiB/s per watched session and 2 MiB/s per node;
        - 50 ms flush target;
        - replay buffers of 1 MiB per session and 32 MiB per node;
        - at most 4 viewers per session and 32 subscriptions per node;
        - one long poll per sandbox, held at most 20 s;
        - no poll without subscriptions.
      - Reconnect: a viewer that missed output gets a fresh snapshot plus the following frames, with no agent relaunch.
      - Flood isolation: terminal upload uses its own bounded queue. A sustained output flood must not delay permit renewal or cancellation (R5).

      ### Current state
      - `crates/aq-terminal-renderer` (lib.rs: `Renderer::bytes` at line 124, `gap` at 157, `image` at 171, `restore` at 177) is pure. It is "unpublished" and has no runtime adoption (docs/implementation/WRK-14-renderer-model.md).
      - `crates/aq-worker/Cargo.toml` links `aq-terminal-bridge` 0.1.3 and `aq-session-host` but not the renderer.
      - The server relay routes are `/v1/terminal-relay/register|poll|output-poll|upload` (`aq-server/crates/aq-server/src/terminal/api.rs:68-78`). The relay wire has `snapshots: Vec<Snapshot>` (`aq-terminal-relay-protocol/src/wire.rs:208`).
      - It is unverified whether the relay can carry renderer state images. If it can't, an additive relay-protocol change is needed in aq-server, with fixtures on both sides.

      ### Interfaces
      Consumes:
      - B6c's per-sandbox terminal channel.
      - B2's permit scope on terminal routes.
      - B6a1's guardian and tmux host.

      Produces:
      - Snapshot and sequenced output that G10 (terminal snapshot reconnect) and the dashboard terminal renderer consume.

      ### Out of scope
      - Terminal input and control fencing: the existing WRK-14 stage1.
      - The browser renderer: aq-dashboard (G10/G11).
      - Transcript observations: H1.
      - Real-harness rendering qualification for the other CLIs: I1–I3.
      - Measuring the latency profile: J3.

      ### References
      - aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md §5.2, §5.3, §7 R4–R5
      - aq-worker/docs/implementation/WRK-14-output-plan.md ("Output ownership and acquisition")
      - aq-worker/docs/implementation/WRK-14-renderer-model.md
    acceptance:
      - "Test `reconnect_after_gap_renders_from_snapshot` passes."
      - "Test `output_flood_does_not_delay_renewal` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace reconnect_after_gap_renders_from_snapshot}
      - {id: t2, kind: test, target: cargo test --locked --workspace output_flood_does_not_delay_renewal}
