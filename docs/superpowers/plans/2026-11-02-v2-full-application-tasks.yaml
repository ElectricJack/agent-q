        - as a Compose service (note that `docker:dind-rootless` normally needs `--privileged`; unverified), or
        - as a host rootless `dockerd` for a dedicated user.
      - Production servers never mount the main Docker socket into the application container (infrastructure spec, "Self-update and restart").

