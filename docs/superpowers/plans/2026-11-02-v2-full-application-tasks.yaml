        - MS1 is not a prerequisite of this task. If no MS1 measurement exists, measure the E1a–c stack and confirm with the owner.
      - **Cloudflare.**
        - Human hostname: Access with owner email-OTP, routed to the admin listener (`admin_bind` 8080).
        - Machine hostname: Access service tokens only, routed to the worker listener (`worker_bind` 8081).
        - Tokens are created by hand, two per worker (node and runner).
        - Vault: `[auth] mode = "cloudflare_access"` with `team_domain` and `audience`.
      - **Backups.** Configure off-host encrypted backups and record the credential-recovery decision.
      - **Checks.** Run the reboot recovery check and the Access origin-isolation checks: the public internet can't reach the origin, and the machine hostname can't reach human routes.
