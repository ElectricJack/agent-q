  - key: A3a
    epic: A
    repo: aq-git
    title: Release aq-git 0.2.0 from HEAD with a verifiable artifact and Git 2.56 qualification
    type: chore
    class: standard-high
    needs: []
    continues: [GIT-01]
    spec: [aq-git/docs/specs/0001-aq-git.md, aq-server/docs/architecture/0001-ecosystem-and-releases.md]
    description: |
      ### Goal
      Publish aq-git v0.2.0 from current `main`, as a traceable GitHub release with verifiable artifacts, qualified on Git 2.56.0. The shipped product can then pin a revision that actually exists.

      ### What to build
      - Bump the workspace version (`Cargo.toml` `[workspace.package] version = "0.1.0"`) to 0.2.0, update `Cargo.lock`, commit, and tag `v0.2.0` on `main`.
      - Release assets, each with a `.sha256`:
        - a source archive of the tagged tree (`git archive`);
        - a `linux-x86_64` `aq-git` binary built for the bookworm glibc baseline. Build it in `rust:1.96.1-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663`, as aq-server's recipe does; that recipe's binary needs at most GLIBC 2.34;
        - a build record: toolchain, target triple, `Cargo.lock` SHA-256, source revision, builder digest, binary and archive digests. `scripts/release-manifest` already hashes a binary plus the source inventory; reuse it.
      - Qualification:
        - Run `cargo test --locked --workspace` (and `scripts/check-all`) with Git 2.56.0 first on PATH. Use upstream `git-2.56.0.tar.xz`, SHA-256 `26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3`, from kernel.org.
        - Also run the suite with the host's Git 2.43.0 and record both results.
      - Update `docs/release-status.md`: name v0.2.0, the Git versions qualified, and the remaining limits. Those limits are already listed under "Remaining release gates": P1–P7, power loss, hosted transports, and upgrade rehearsal, which starts with the second release.

      ### Current state
      - History: `2035654` (initial) and `e05d4e6` (HEAD). No tags.
      - aq-server pins `f3660a89…`, which is not in this history.
      - HEAD has 110 tests, including the engine-crash-after-push recovery and the quota symlink-probe fix (release-status.md, 2026-10-30).
      - CI is `.github/workflows/check.yml`. It runs on ubuntu-24.04 with the system Git and has no release workflow.
      - `README.md:9` says Git 2.43 or later.

      ### Interfaces
      Produces the tag `v0.2.0`, the release asset URLs, the source revision, the archive and binary SHA-256s, and the build record. **A3b** pins exactly these, and J1 and J7 build on the tag.

      ### Out of scope
      - Re-pinning aq-server's vendored aq-git, or changing its Dockerfiles: A3b.
      - Meeting the P1–P7 performance targets or the power-loss rehearsal: J1.
      - Widening the supported repository profile: J7.
      - Changing protocol or behaviour. This is a release of the existing code. If a test fails under 2.56, fix it minimally and record it, or file a task.

      ### References
      - `aq-git/docs/specs/0001-aq-git.md` §3.1 (one executable), §5.2 (compatibility), §15 (release acceptance).
      - `aq-server/docs/architecture/0001-ecosystem-and-releases.md` §4 (executables as release artifacts with digests and build records).
      - `aq-server/docs/source-retention.md`, "Reproducible aq-git package".
    acceptance:
      - "Tag v0.2.0 exists on origin; release assets and checksums download and verify."
      - "`cargo test --locked --workspace` passes with Git 2.56.0 on PATH; evidence records both Git versions."
      - "docs/release-status.md names v0.2.0 and its remaining limits."
    deliverables:
      - {id: tests, kind: test, target: "cargo test --locked --workspace"}
    priority: high
  - key: A3b
    epic: A
    repo: aq-server
    title: Re-pin the shipped aq-git to the 0.2.0 release
    type: chore
    class: standard-high
    needs: [A3a]
    continues: [AQ-09]
    spec: [aq-server/docs/source-retention.md]
    description: |
      ### Goal
      Make aq-server's server and worker images ship aq-git v0.2.0 from the A3a release, with every input digest-verified and traceable to a real aq-git commit.

      ### What to build
      - Replace the pin set with the v0.2.0 values from A3a's build record:
        - `vendor/git-candidate.json`: `version` 0.2.0, `source_revision` (the v0.2.0 commit), `archive_sha256`, `bundle_sha256`, plus a new binary digest field;
        - `vendor/aq-git-source.tar.gz`, `vendor/aq-git-source.bundle` and `vendor/git-candidate.sha256`;
        - `source-inventory.json`.
        - Keep `git.version` 2.56.0 and its archive SHA-256 `26c56c29…`.
      - The images must embed an aq-git binary whose digest equals the release binary digest, and the build must check it (`sha256sum -c`). Ecosystem §4 says consumer images pin the released executable at build time. Copying the verified release binary therefore satisfies this more directly than rebuilding from source, which would need a reproducible build to match. Record the choice.
      - The builder stays pinned by digest. The aq-git stages already use `rust:1.96.1-bookworm@sha256:a339861a…`.
      - Keep `scripts/Dockerfile.aq-git` (canonical) and the `# BEGIN/END PINNED AQ-GIT BUILD STAGES` blocks in `Dockerfile` and `Dockerfile.worker` byte-identical; `verify_build_stages` enforces this.
      - Update `scripts/check-git-candidate.py` for any new fields or a renamed `vendor/aq-git-0.1.0/` directory. Paths are hard-coded at its `inventory=` and `git['archive']` checks.
      - Re-run the aq-git-driven tests:
        - `crates/aq-server/tests/source_retention.rs`, including the `#[ignore]` qualification `selected_real_aq_git_import_survives_worker_volume_loss_and_base_download_is_scoped` at line 537;
        - `tests/project_bindings.rs`;
        - `scripts/test-project-bindings.py`. Its `GIT_IMAGE_ID` pins the old candidate image, so update it.
      - Build both images, and record each embedded `/usr/local/bin/aq-git` digest.
      - Update the "Reproducible aq-git package" section of `docs/source-retention.md`, which names `f3660a8`.

      ### Current state
      - `vendor/git-candidate.json` pins `f3660a89cbeac0e068105af2926dfdcb06a1daad`, version 0.1.0.
      - Both Dockerfiles currently build aq-git from the vendored source tarball.
      - CI's lint job runs `python3 scripts/check-git-candidate.py --official`.

      ### Interfaces
      Consumes from **A3a**: the tag, source revision, the archive, bundle and binary digests, and the build record.
      Produces the aq-git v0.2.0 pin that D1a, E0/E1a (aq-git service) and E4 rely on.

      ### Out of scope
      - Digest-pinning the non-aq-git stages (`build`, `runtime`, `worker`) or the `AQ_STATE_FORMAT` label: A4. A4 must not edit the pinned aq-git block, so coordinate if both are open.
      - Supervising aq-git in Compose: E0 and E1a.
      - Candidate and publish integration: D1a.
      - Changing aq-git itself: A3a or a new aq-git task.

      ### References
      - `aq-server/docs/source-retention.md`, "Reproducible aq-git package".
      - `scripts/check-git-candidate.py`: `verify_build_stages()` and `candidate()`.
      - `aq-server/docs/architecture/0001-ecosystem-and-releases.md` §4.
    acceptance:
      - "vendor/git-candidate.json source_revision resolves in the aq-git repository."
      - "`cargo test --locked --workspace` passes; the image build verifies the aq-git digest."
    deliverables:
      - {id: tests, kind: test, target: "cargo test --locked --workspace"}
  - key: A4
    epic: A
    repo: aq-server
    title: "Image and CI hygiene: digest-pinned bases, state-format default, stale vendor trees, check scripts in CI"
    type: chore
    class: standard-high
    needs: []
    continues: [INT-01]
    spec: [aq-server/docs/architecture/0001-ecosystem-and-releases.md]
    description: |
      ### Goal
      Close four image and CI hygiene gaps, so official and plain builds are reproducible and labelled correctly, and existing pin checks actually run in CI.

      ### What to build
      - **Digest-pin the base images** outside the aq-git block:
        - `Dockerfile:27` `FROM rust:1.96.1-bookworm AS build` and `Dockerfile:45` `FROM debian:bookworm-slim AS runtime`;
        - `Dockerfile.worker:16` (`build`) and `Dockerfile.worker:34` (`worker`).
        - Reuse the existing rust digest `sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663`. Resolve the bookworm-slim digest with `docker buildx imagetools inspect` and record it.
      - **State-format label:**
        - `Dockerfile:57` has `ARG AQ_STATE_FORMAT=40`, but `crates/aq-server/src/lib.rs:52` has `STATE_FORMAT_VERSION: u32 = 41`.
        - A Docker label can't be computed from a `RUN` step. So set the default to the source value and add a cargo test that parses `Dockerfile` and fails when `ARG AQ_STATE_FORMAT=` ≠ `STATE_FORMAT_VERSION`. Optionally also check `AQ_PROTOCOL_MAX` against `SUPPORTED_WORKER_PROTOCOLS.1`, which is `(1, 1)`.
        - The existing test `state_format_is_the_latest_migration` (`store.rs`) already tells developers to bump the Dockerfile default; make that enforced.
        - `release.yml` passes the real values as build args; leave that unchanged.
      - **Delete the stale playbook trees and their pins:**
        - `vendor/aq-playbooks-42f9449` with pin `vendor/aq-playbooks-source.json`;
        - `vendor/aq-playbooks-a463e59` with `vendor/aq-playbooks-source-0.1.1.json`;
        - `vendor/aq-playbooks-d3bd349` with `vendor/aq-playbooks-source-0.1.2.json`.
        - Remove the three entries from the `exclude` list in `Cargo.toml` (line 4).
        - Keep `vendor/aq-playbooks-0173673` with `aq-playbooks-source-0.1.3.json` and `.tar`. Those are the crates linked by `crates/aq-server` and `crates/aq-playbook-host`.
      - **CI:** add `python3 scripts/check-playbook-source.py` and `python3 scripts/check-lifecycle-contract.py` to the `lint` job in `.github/workflows/ci.yml`, next to the other `check-*.py` steps.
      - Rename the `aq` binary built by `crates/aq-profiles` to `aq-profile`, so no v2 binary is named `aq` while v1 is live.

      ### Current state
      - Both scripts pass locally today. `check-playbook-source.py` globs every `vendor/aq-playbooks-source*.json`, so a tree deleted without its pin fails.
      - The old revisions are also string literals in `crates/aq-server/tests/playbook_contract.rs:13`, `examples/playbook_contract.rs`, `examples/playbook_review_contract.rs` and `protocol/playbook-host/v{1,2}/registry.json`. These are historical identifiers, not file paths: leave them, and confirm the build and tests still pass.
      - `Dockerfile.worker` labels `AQ_STATE_FORMAT=4` and `AQ_VERSION=0.1.0`, while the worker candidate is 0.3.1. That isn't in this task's stated scope; record it.

      ### Interfaces
      Produces digest-pinned base stages and an enforced label/source equality. E1a and E4 rely on images built this way.

      ### Out of scope
      - The `# BEGIN/END PINNED AQ-GIT BUILD STAGES` blocks, `scripts/Dockerfile.aq-git` and `vendor/git-candidate.json`: A3b.
      - Pinning Compose service images (postgres, cloudflared, graph): E1a.
      - Manifest format 2: E4 (deferred).

      ### References
      - `aq-server/docs/architecture/0001-ecosystem-and-releases.md` §4 (immutable digests; no floating release inputs).
      - `.github/workflows/release.yml`, lines 56–69 (how release derives `state_format`).
    acceptance:
      - "A plain `docker build .` produces a state-format label equal to the source constant."
      - "CI runs both check scripts; the removed vendor trees are absent and the build still passes."
    deliverables:
      - {id: tests, kind: test, target: "cargo test --locked --workspace"}
    priority: low
  - key: E0
    epic: E
    repo: aq-server
    title: 'Local full-stack Compose for development: graph, supervised aq-git, dev auth'
    type: chore
    class: standard-high
    needs: []
    continues: [INT-01]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-server/docs/specs/0001-infrastructure-foundation.md]
    description: |
      ### Goal
      One command brings up a local full stack on the WSL2 desktop: postgres, aq-server with dev auth, aq-graph and a supervised `aq-git serve`. The server knows when graph and aq-git are ready or degraded. MS0 and MS1 run against this stack.

      ### What to build
      - In `compose.dev.yaml` (an overlay on `compose.yaml`; `scripts/dev-up` runs `docker compose -f compose.yaml -f compose.dev.yaml up --build`):
        - **aq-graph**: built from a pinned aq-graph commit (a Compose git build context at an exact SHA; no sibling checkout), or from a pinned image once E2 publishes one.
          - Image facts: listens on 8741, health command `aq-graph --endpoint http://127.0.0.1:8741 health`, bootstrap via `AQ_GRAPH_BOOTSTRAP_{WORKSPACE,ACTOR,TOKEN_FILE}`.
          - Use its own database and role. aq-server never reads graph tables.
        - **aq-git**: a separate service running `aq-git --state-dir /var/lib/aq/git --git-executable /opt/aq-git-runtime/bin/git --listen /run/aq-git/central.sock serve`.
          - Run it from the server image, as UID 10001.
          - Share the private volumes `/var/lib/aq/git`, `/var/lib/aq/source-staging` and `/run/aq-git` with the server.
          - Restart it on failure, with a healthcheck of `aq-git --socket /run/aq-git/central.sock --json capabilities`.
          - "Supervised" means Compose restarts aq-git and aq-server checks its readiness (0005 §9).
        - **server**: dev auth (`vault.example/config.toml` has `[auth] mode = "dev"`, plus `AQ_DEPLOYMENT: development`) and no cloudflared (`profiles: [tunnel]` already). Add `[source_retention]` (`git_socket`, `git_root`, `staging_root`) and `[agent_access] graph_url` / `graph_token_file` to the dev vault.
      - **Dependency readiness:** the server reports graph and aq-git as ready or degraded.
        - Don't add fields to `/readyz`. Its `aq_release::ReadinessReport` (`crates/aq-release/src/spool.rs:106`) is `deny_unknown_fields` and parsed by installed updaters. Add a separate surface and name it in the evidence.
      - **Seed:** one project binding through `POST /api/projects/{id}` (`project_bindings.rs:48`) plus the aq-git binding/base provisioning in `docs/source-retention.md`, pointing at a scratch GitHub repository the owner designates. Ask via AQ v1 and don't guess. Also seed one graph task.
      - `scripts/compose-smoke.sh` with mode `dev`. It runs the scripted test `compose_dev_reaches_ready_with_graph_and_git`, then kills aq-git and checks for a restart, with the server reporting degraded then ready.
        - Design the script so E1a (`prod`) and E1c (`prod-workers`) can add modes.
        - `scripts/product-smoke.py` shows the disposable-project pattern.

      ### Current state
      - `compose.yaml` runs only `postgres`, `server` and `cloudflared`. The service name `server` is hard-coded in the host updater (`crates/aq-updater/src/runtime.rs:80`), so keep it.
      - No graph service exists. aq-git ships in the server image, but nothing starts it ("Operator startup" in `docs/source-retention.md`).
      - `/healthz` returns a static `{"status":"ok"}`.

      ### Interfaces
      Produces the dev stack, the dependency-readiness surface and `scripts/compose-smoke.sh`, which I0, MS0, MS1 and E1a use. The stack uses the currently vendored aq-git 0.1.0; A3b re-pins it separately.

      ### Out of scope
      - The worker container and Codex for MS0: I0.
      - The production Compose stack, digest-pinned graph image and cloudflared: E1a.
      - Repository onboarding API and central Git credentials: D2. Never commit credentials.
      - Re-pinning aq-git: A3b.
      - Publishing the graph image: E2.

      ### References
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §3.1 and §9.
      - `aq-server/docs/specs/0001-infrastructure-foundation.md`, "Development and release delivery".
      - `aq-graph/compose.yaml` and `aq-graph/docs/operations.md`, "Configuration and readiness".
    acceptance:
      - 'Test `compose_dev_reaches_ready_with_graph_and_git` (scripted) passes: all services healthy, the server reports graph and aq-git ready.'
      - Killing aq-git causes a restart, and the server reports degraded then ready.
    deliverables:
      - {id: smoke, kind: test, target: scripts/compose-smoke.sh dev}
  - key: I0
    epic: I
    repo: aq-worker
    title: 'MS0: one real Codex API-key run in a plain Docker container on the existing native path'
    type: test
    class: deep-high
    needs: [E0]
    continues: [WRK-08, GATE-04]
    spec: [aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md, aq-server/docs/plans/2026-10-31-native-integration-checkpoint.md]
    description: |
      ### Goal
      Prove that the real Codex CLI with a real OpenAI API key can complete a real graph task end to end on today's `aq-worker run-native` path. Do this before permits, the vault or templates are built, and turn every problem found into a filed task.

      ### What to build
      - **Image:** a plain Docker image built from aq-server `Dockerfile.worker` plus the pinned Codex CLI `0.166.0` (`CODEX_CLI_VERSION`, aq-worker `crates/aq-codex-mapper/src/lib.rs:10`). The `aq-worker` binary must come from current aq-worker `main` (see Current state). Run it on the WSL2 desktop's ordinary Docker with host networking, so the worker reaches the E0 server on numeric loopback.
      - **Key:** read the OpenAI API key from a local owner-0600 file and deliver it through the existing private material lease (`/v1/worker/profiled/material`). Never put it in env, argv, the image, logs or task text (P8).
      - **Run:** each `aq-worker run-native --native-config <file>` is one fresh attempt with one slot, and its state root must be empty. The task is E0's seeded graph task: it edits E0's scratch GitHub repository, retains source centrally, and settles through the existing routes: `POST /api/settlement/evaluations`, `POST /api/reviews/combined/{decision_id}/resolve` and `POST /api/settlement/completions/{operation_id}/reconcile`. A human-review decision is acceptable.
      - **Three consecutive runs.** For each, record the attempt and grant IDs, Codex version, model, wall time, retained source revision and settlement outcome.
      - **File every failure and rough edge** with `aq task create --reason …` and list its v1 ID in the report. Prefer configuration to code. If a small code change is unavoidable to get a run through, keep it minimal, record it and file the proper fix.
      - **Report:** aq-worker `docs/implementation/I0-first-real-run.md`, with commands, image digest, commits, environment and limits.

      ### Current state
      - `run-native`/`check-native`: `crates/aq-worker/src/main.rs:83,101`. Executor kinds: `src/native/runner/codex.rs:35-62`; legacy `codex-0.166-exec-stdin-v1` and a missing executor both refuse before admission.
