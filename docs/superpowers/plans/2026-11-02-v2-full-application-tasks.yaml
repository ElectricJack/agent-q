  - key: C4
    epic: C
    repo: aq-server
    title: Environment-to-template catalog, backend capabilities and placement preference
    type: feature
    class: standard-high
    needs: [C3c, B1, B4]
    continues: [AQ-18, AQ-19, AQ-20, AQ-08]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md]
    description: |
      ### Goal
      The server should offer work only to nodes that can run it. Three changes get there:
      - resolve each execution profile's environment to one template digest when a catalog is activated;
      - use node backend, template, harness and ceiling advertisements in eligibility;
      - order nodes by an explicit placement preference.

      ### What to build
      - **Resolve at activation.** At catalog activation (`activate` in `aq-server/src/profile_catalog.rs:100`, route `POST /api/profiles/catalogs/activate`):
        - Resolve every `Execution.environments` entry (`aq-profiles/src/catalog.rs:89`) to exactly one allowlisted template digest from C3b/C3c.
        - Refuse activation if a digest is missing or ambiguous.
        - Running attempts keep their digest (0005 §8.2).
      - **Pin the digest in the frozen launch manifest** (0003 §3.1).
        - The manifest is `LaunchManifest` in aq-session-protocol (aq-worker `crates/aq-session-protocol/src/lib.rs:251`). `HarnessSettings.environment` (`ArtifactRef {id, version, digest}`) is at line 193. aq-server vendors it in `vendor/aq-session-protocol-0.1.0`.
        - Either carry the digest in the environment `ArtifactRef`, or add a field. A new field is an aq-worker contract change with schemas and fixtures; file an aq-worker task if it is outside your workspace. Record the choice.
      - **Use the B1 advertisement in eligibility.** It carries backend kind, capabilities, template digests with their harness versions, concurrency and spend ceilings, and cold-start cost per template.
        - Missing required capability: refuse with a typed reason and never degrade (SBX13).
        - The template must contain the selected harness CLI version (SBX18, P5). Test: `template_missing_selected_harness_version_is_ineligible`.
      - **Placement preference** (SBX14, 0005 §3.2).
        - The default order is `docker-local`, then `boat`, then `cloudflare-containers`. A project can override it (`ProjectPolicy`, `aq-server/src/profiled_execution/config.rs:20`).
        - Scheduling is pull-based: offers are built in `poll` in `producer/workflow.rs`. So a lower-preference node gets no offer while a higher-preference eligible node is online with free advertised capacity.
        - Keep any such hold bounded and explained. Test: `placement_prefers_local_then_boat_then_cloudflare`.
      - **Ceilings** (SBX15, W13): a node at its concurrency or spend ceiling gets no offer, with a typed reason in the trace. Test: `node_at_spend_ceiling_refuses_with_reason`.
      - **Explanations** go in `CandidateTrace.reason_codes` (`aq-selection/src/domain.rs`).

      ### Current state
      - `evaluate` (`aq-selection/src/candidate_core.rs:207`) checks harness, environment, credential, model and limits. It has no backend, template or ceiling inputs.
      - Node facts live in `intelligence_node_snapshots` (`CapabilitySnapshot`, `domain.rs:94`): harnesses and credential bindings only.
      - Today `poll` schedules only the single top-priority project (`workflow.rs` around lines 258–290). B4 replaces this with fair multi-project scheduling first.

      ### Interfaces
      - **Consumes:**
        - B1: the advertisement fields;
        - B4: the scheduler;
        - C3c: the digests and allowlist;
        - C5a1: the credential backend filter, which runs in the same `evaluate`.
      - **Produces:**
        - the activation-time resolution;
        - the template digest in the manifest (B5a, C2 and C7 create sandboxes from it);
        - the preference config;
        - refusal reason codes (shown by G10 and F7).

      ### Out of scope
      - Node-side refusal at its own ceiling: B5a.
      - Credential backend lists: C5a1. Lease limits: C5b.
      - The advertisement wire schema: B1.
      - Spend accounting: H2.

      ### References
      - 0005 §3.2, §8.1 (last paragraph), §8.2 "Resolution", SBX13–15, SBX18.
      - 0003 §3.1.
      - aq-worker/docs/specs/0001-worker-framework.md §8.1–§8.2.
    acceptance:
      - "Test `placement_prefers_local_then_boat_then_cloudflare` passes."
      - "Test `template_missing_selected_harness_version_is_ineligible` passes."
      - "Test `node_at_spend_ceiling_refuses_with_reason` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace placement_prefers_local_then_boat_then_cloudflare}
      - {id: t2, kind: test, target: cargo test --locked --workspace template_missing_selected_harness_version_is_ineligible}
      - {id: t3, kind: test, target: cargo test --locked --workspace node_at_spend_ceiling_refuses_with_reason}
  - key: C5a1
    epic: C
    repo: aq-server
    title: Provider credential profiles and per-credential backend policy
    type: feature
    class: deep-high
    review: adversarial
    needs: []
    continues: [AQ-08]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Give each provider credential profile a kind, `api-key` or `subscription-login`, and an allowed-backends list. Eligibility then refuses any candidate whose credential may not run on the node's backend.

      ### What to build
      - **New fields.** Add to `CredentialConfig` (`aq-server/src/intelligence/config.rs:19`, the vault's `[intelligence]` credentials):
        - `kind`: `api-key` or `subscription-login`;
        - `allowed_backends`: a subset of `docker-local`, `boat`, `cloudflare-containers`.
          - The default is every enabled backend, for both kinds (0005 §1 item 6 and §7, owner decision 2026-11-02, personal deployment).
          - An operator may narrow the list.
        - `allowed_node_ids` stays as it is; the backend list is an extra restriction.
      - **Validation.** In `IntelligenceConfig::validate`, accept only known, distinct values with bounded lengths. Make the new fields part of the registry digest, so changing them is a revision change.
      - **Enforcement.** A disallowed backend makes the candidate non-eligible.
        - Use state `PolicyDenied` with an explicit reason code (for example `credential_backend_not_allowed`) in `CandidateTrace`. Never fall back silently (SBX13).
        - Enforce it where node filtering happens today:
          - `evaluate` in `aq-selection/src/candidate_core.rs`, where the credential checks are, around line 314;
          - `material::provisioning_bindings` (`aq-server/src/profiled_execution/material.rs`, around line 118).
        - Also check it in `material::issue_for_selection` (`material/issuance.rs`), so a lease can never be issued for a disallowed backend.
      - **Backend kind input.** B1 adds backend kind to node registration, but this task does not depend on B1.
        - Make backend kind an explicit eligibility input.
        - If a node advertises no backend kind, a restricted credential fails closed with its own reason code. An unrestricted (default) credential is unaffected.
        - Record this decision.
      - **Test:** `credential_restricted_backend_is_ineligible`.
      - Here the kind is only metadata. Kind-specific behaviour belongs to C5b, C6a and C6b.

      ### Current state
      - Credentials are a read-only registry loaded once at startup.
        - `IntelligenceConfig::load` fingerprints each owner-only `secret_file` (64 KiB cap).
        - The result, `LoadedRegistry`, lives in `state.config.intelligence`.
        - There is no kind or backend field (checked with grep).
      - `AuthorizedCredential` (`aq-selection/src/domain.rs:108`) has these fields: profile, provider, account_reference, endpoint_reference, revision, enabled, provisionable, material_owner.

      ### Interfaces
      - **Consumes:** the existing selection and material code.
      - **Produces:** the credential kind type, `allowed_backends`, the backend-kind eligibility input and the reason codes.
