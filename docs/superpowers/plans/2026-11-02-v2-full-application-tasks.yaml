      - {id: t2, kind: test, target: cargo test --locked --workspace agent_reply_reaches_supervisor_mailbox}
  - key: F4
    epic: F
    repo: aq-server
    title: Automatic notifications to Discord with real-destination qualification
    type: feature
    class: standard-high
    needs: [D3]
    continues: [AQ-24, AQ-27]
    spec: [aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md]   # N1, N2, N4
    description: |
      ### Goal
      AQ automatically notifies the owner on Discord about events that need attention, with flood control and one notification per episode. The integration is qualified against a real Discord webhook that the owner supplies.

      ### What to build
      - An event-to-notification policy in aq-server for six events:
        - task failed or blocked;
        - decision needed;
        - question asked (the event kind is defined here; F5 emits it);
        - credential invalid (the attempt failure reason `credential_invalid` from C6b);
        - milestone gate ready;
        - worker offline.
      - Each event submits a logical message through the existing notification service: `SendRequest` (`operation_id`, `message_id`, `revision`, `scope`, `recipient_user_id`, `summary`, `ttl_ms`), sent through the configured route.
      - Episodes: key each episode by kind plus subject, for example the credential profile ID, the task ID or the node ID. Notify once when the episode opens and not again until it resolves and reopens. Use stable, derived operation and message IDs so a replayed source event creates no second intent.
      - Flood control: a burst of failures collapses into a bounded number of notifications per window, for example one summary that carries a count. Delivery failures do not generate notifications about notifications (N4). One destination cannot block other routes or execution control.
      - Payloads (N4): bounded summary plus an authenticated AQ link; no transcripts or private context; mentions stay disabled.
      - With no external route, the message reports `no_external_route` and does not claim external delivery.
      - Real-destination qualification: run the opt-in live test against the owner's webhook file. Record the live delivery receipt (Discord message ID, timestamp) in `docs/implementation/F4.md`, with no URL or secret. Unit tests use the fake transport only.

      ### Current state
      - The notification store, dispatcher and Discord v10 webhook adapter exist (AQ-24): `crates/aq-notifications`, and `crates/aq-server/src/notifications/` (`persistence.rs:257` `enqueue`, `config.rs` protected endpoint files, routes at `api.rs:29-32`).
      - Sending is human-only today, either through `POST /api/notifications` or the `aq-notify` CLI. No automatic producers exist.
      - Capacity is 4096 messages and 4096 deliveries, with no garbage collection.
      - The live test is `crates/aq-server/tests/notification_discord_live.rs`. It is `#[ignore]` and needs `AQ_NOTIFICATION_REAL_SEND_CONFIRMED=1` and `AQ_NOTIFICATION_REAL_WEBHOOK_FILE`.
      - No episode service exists in the code: grep finds no "episode", and the AQ-16 service cited in 0004 §3.1 is absent. No v2 "milestone gate" marker exists. Define one, for example a graph label, and record it.

      ### Interfaces
      Consumes:
      - The D3 `agent_graph_outbox` consumer for confirmed domain events.
      - The existing decision owner (`/api/reviews/decisions`).
      - Worker presence (`/api/workers`).
      - The C6b failure reason.

      Produces:
      - The notification policy, the episode keys and the `question.asked` event kind that F5 emits. F6 escalations and G10's delivery-state view build on these.

      ### Out of scope
      - Escalation reminders and the daily digest: F6 (deferred).
      - Inbound Discord answers and buttons: F8 (deferred).
      - Question creation: F5.
      - findings.reconcile episodes: D8.
      - The dashboard delivery view: G10.

      ### References
      - aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md §3, §3.1, §7 N1–N4
      - aq-server/crates/aq-notify/README.md (request fields, limits, configuration)
      - aq-server/docs/implementation/AQ-24.md
      - v1: agent-queue2/src/notifications/events.py
    acceptance:
      - "Test `credential_invalid_notifies_once_per_episode` passes."
      - "Test `flood_of_failures_collapses_to_bounded_notifications` passes."
      - "A live delivery receipt is recorded."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace credential_invalid_notifies_once_per_episode}
      - {id: t2, kind: test, target: cargo test --locked --workspace flood_of_failures_collapses_to_bounded_notifications}
  - key: F5
    epic: F
    repo: aq-server
    title: Agent questions to the owner, with answers delivered back
    type: feature
    class: standard-high
    needs: [F3, H4]
    continues: []
    spec: [aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md]
    description: |
      ### Goal
      An agent can ask the owner a question and wait. The owner answers in AQ, and the answer reaches the waiting agent. If the attempt has ended by then, the answer reaches its continuation. This replaces v1 `aq question` and WAITING_INPUT.

      ### What to build
      - An agent route on the agent listener, under the per-attempt credential, plus an `aq-agent question ask` subcommand in aq-worker's `aq-agent-client`. It is a thin client over the published contract (schema and fixtures in `aq-server/protocol/agent-access/v1`). The route name is your choice, for example `POST /v1/agent/questions`. Record it.
      - Asking creates a typed `question` decision. It is bound to the asking task, attempt and session, with a question digest and subject revision, and it uses a stable operation ID, so a replay returns the same decision.
      - Asking also emits F4's `question.asked` event (one notification per episode) and registers an H4 wait on the `HumanDecision` condition (`decision_id`, `subject_id`, `subject_revision`, `question_digest`).
      - The owner answers in the dashboard decision inbox, through the action union's decision-response kind that G1b migrated, or through an authenticated link to that AQ page. Discord reactions or replies are never answers (0004 §3.1).
      - The answer must target the exact question revision. Acknowledging a notification does not answer it.
      - Delivery: resolving the decision satisfies the wait, which wakes the waiting attempt once. The agent reads the answer through the wait outcome or its inbox.
      - If the attempt ended (hibernated, finished or failed) before the answer, deliver the answer as task-addressed mail held for the successor (0004 §4.3). Old session-addressed mail never retargets.

      ### Current state
      - The decision owner is review-specific: `crates/aq-server/src/reviews.rs`, with routes `/api/reviews/decisions[/{id}[/resolve|/cancel]]` at lines 979–982. It has no question kind.
      - There is no agent question route, and no `question` subcommand in `aq-agent` (`aq-worker/crates/aq-agent-client/src/main.rs:24`).
      - The `Condition::HumanDecision` wait condition exists in `crates/aq-lifecycle-api/src/waits.rs:49`.

      ### Interfaces
      Consumes:
      - H4's wait registry and agent wait routes.
      - F3's agent messaging and the `aq-agent message` path.
      - F4's notification policy.
      - G1b's decision-response action.

      Produces:
      - The question decision kind and the agent question route. F8 (deferred) and the dashboard decision inbox use them.

      ### Out of scope
      - Wait registry internals: H4.
      - Waking hibernated continuations: H6.
      - Escalation of unanswered questions: F6.
