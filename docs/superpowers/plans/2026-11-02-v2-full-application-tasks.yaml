  - key: D5
    epic: D
    repo: aq-server
    title: "Host adapters: context.read, work.ensure, work.change, operation.cancel"
    type: feature
    class: standard-high
    needs: [D3, D4]
    continues: [AQ-13]
    spec: [aq-playbooks/docs/specs/0001-aq-playbooks.md, aq-server/docs/specs/0002-execution-and-agent-access.md]
    description: |
      ### Goal
      The embedded playbook host gets real production adapters for `context.read`, `work.ensure`, `work.change` and `operation.cancel`. They run against the real graph gateway and the execution authority, bound to the D4 catalog.

      ### What to build
      - Pin D4's catalog contract:
        - Vendor its exact revision under `aq-server/vendor/` with a source record. No sibling paths.
        - Relax `validate_registry` (`crates/aq-playbook-host/src/lib.rs:749`), which today requires `Reconcilable`, to the contract's declared classes.
        - Register it as a new catalog profile. Never silently widen an existing stored grant or catalog (AQ-14 profile2 rule).
      - Common adapter rules (AQ-12-17 plan, "Durable domain bridge"):
        - Before any effect, persist an AQ intent keyed by namespace, runner `Intent.id`, exact contract fingerprint, payload digest, grant and revision. The same identity with different bytes is a conflict.
        - Owner admission and its outbox entry commit together.
        - `reconcile` reads only the retained owner operation (HostMode `Reconcile`) and never creates a new payload.
        - Authority comes from the authenticated grant, never from input fields. Recheck object versions and grant expiry after lock waits.
      - Grant binding: extend `GrantScope` and grants (`POST /api/playbooks/grants`) to the new commands' capabilities and scopes.
      - `context.read`: finite typed views (work, project, execution_options, evidence) with version, freshness, scope and completeness. No arbitrary SQL or endpoint. execution_options reuses existing selection; there is no second selector.
      - `work.ensure`: declared work kinds only. It is idempotent by logical key: the same key returns the same task and operation. Proposed graphs are validated atomically. `ensured` is not completion.
      - `work.change`: closed variants (requirements, priority, dependencies, execution_constraints, hold, release_hold) with expected versions. A stale version returns the `conflict` outcome. There is no lifecycle patch and no completion shortcut.
      - `operation.cancel`: dispatch by server-owned handle to the owning service; native attempts go to B3's cancellation. Distinguish accepted, refused, too_late, cancelled and indeterminate. Cancellation never undoes a completed effect.

      ### Current state
      - `MailHost` (`crates/aq-server/src/playbooks/driver.rs:18-160`) dispatches only `decision.request` and `message.send`; `operation.get` is in `review_domain.rs`.
      - `GrantScope.validate` (`playbooks/domain.rs:97-104`) allows only `{message.send}`.
      - The only profile is `human_review_v2` (`playbooks/config.rs:43`).
      - Graph writes exist as scoped agent intents (`agent_access/mutations/`) and the human task create route (`agent_access/human.rs:75`).

      ### Interfaces
      Consumes:
      - D4's contract;
      - D3's confirmed-event stream;
      - B3's cancel API;
      - existing graph and selection owners.

      Produces:
      - the adapter framework (intent table, profile, grant capabilities) that D6, D7 and D8 extend;
      - the four registered commands.

      ### Out of scope
      - `judgment.request` and `check.request`: D6.
      - `candidate.*`: D7.
      - `findings.reconcile`, the health_observations episode revisions, and triggers: D8.
      - Owner and dashboard task commands: G2 and F2.
      - Native cancellation internals: B3.

      ### References
      - `aq-playbooks/docs/specs/0001-aq-playbooks.md` §6 ("Initial AQ host API" and the paragraphs that follow), §11
      - `aq-server/docs/implementation/AQ-12-through-17-plan.md` ("Durable domain bridge", "Exactly twelve command mappings")
      - `aq-server/docs/specs/0002-execution-and-agent-access.md` §6
