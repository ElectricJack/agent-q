    spec: [aq-dashboard/docs/specs/0001-dashboard.md]
    description: |
      ### Goal
      The server image contains the E3 dashboard release archive, verified by digest, so production serves the dashboard with no host bind-mount and with correct HTTP caching.

      ### What to build
      - **Build-time pin:** pin the selected E3 release by tag, archive URL and archive SHA-256. Follow the vendored-pin pattern of `vendor/git-candidate.json` plus a `scripts/check-*.py`, or use `ADD --checksum=sha256:…`.
      - **Image:** in `Dockerfile` (`server` stage), verify the archive digest, unpack it to a fixed path (for example `/usr/share/agent-q/dashboard`) and set `AQ_DASHBOARD_DIR` in the image.
      - **Compose:** production Compose needs no bind-mount. Keep `compose.dashboard.yaml` only as an explicit development override (ecosystem §7).
      - **Server loader:** update `crates/aq-server/src/dashboard_assets.rs` to accept E3's extended manifest.
        - `Manifest` is `#[serde(deny_unknown_fields)]`, and `load()` requires `schema_version == 1 && api_version == "dashboard-read-1"`, so a new manifest is refused today.
        - Keep the file, size and type limits: 512 files, 32 MiB, 256 KiB manifest.
        - Refuse a bundle whose required API contracts or capabilities this server doesn't provide.
      - **Caching**, from dashboard spec §6:
        - hashed `assets/*` are cacheable immutably (for example `private, max-age=31536000, immutable`; they're served only after `CurrentUser` auth);
        - `index.html`, SPA routes and compatibility metadata must revalidate (`no-cache`);
        - `/api/*` responses get `no-store`.
        - Today `handler()` sets no `Cache-Control`.
      - **Test:** `server_image_serves_pinned_dashboard_digest` must be a cargo test with exactly that name, run by `cargo test --locked --workspace server_image_serves_pinned_dashboard_digest`. It proves that the pinned archive's manifest digest is what the server loads and reports as bootstrap `product.dashboard_digest`.

