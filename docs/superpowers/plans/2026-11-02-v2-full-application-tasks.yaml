    repo: aq-worker
    title: "`boat` backend"
    type: feature
    class: standard-high
    needs: [C1, C3c, B5b]
    continues: []
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]   # §5.2, SBX11
    description: |
      ### Goal
      Implement the `boat` placement backend for boat.dev VMs on the C1 trait. The cloud worker can then run attempts on boat. When boat is unavailable it refuses offers cleanly, and it never leaves a paid VM running.

      ### What to build
      - **API client** for `https://boat.dev/api/v1` with a scoped bearer key (sandbox-lifecycle, command and file permissions only). The key is node-local and never enters a sandbox (SBX7, SBX17). Don't use boat's AI-credential or AI-proxy features.
      - **Behaviour** (0005 §5.2, SBX11):
        - **Templates** are saved snapshots of a base VM that pulled and verified the template's OCI digest. Record the snapshot id on the C3b allowlist entry and scan it with the C3b scanner.
        - **Create** forks the template snapshot, sized small, default or large from the resource request.
        - **Auto-stop** is the grant hard deadline plus a small margin, never the 1-hour default or "off" (§4.1). Extend only within the hard deadline.
        - **Stop-and-archive** serves as both preserve and stop proof. Advertise `vm-isolation` and `suspend-snapshot`, not `nested-docker`.
        - **Destroy** is `DELETE /sandboxes/{id}`, then confirm it is gone. Delete its retained snapshots unless the attempt is suspended.
        - **Scope:** one dedicated boat organization for attempts and a separate one for template builds. Names are node prefix plus attempt id; boat has no tags, so the journal mapping is authoritative. `list_owned` and sweeps act only on prefixed sandboxes in that org (`sweep_ignores_sandboxes_without_node_prefix`).
        - Runner and agent run inside the template's OCI container on the VM's Docker. The agent cannot reach VM root or the VM's Docker daemon. No public URLs, SSH keys or desktop streaming.
      - **Outages:** an API 5xx, a 429 or the account sandbox limit raises a typed "backend unavailable" error. The controller turns it into a typed offer refusal and no half-created VM keeps running (`boat_unavailable_refuses_offers_without_orphans`).
      - **Margins** assume a round-trip time of 250 ms or more. Don't claim the terminal latency target on boat.
      - **Record the 0005 §14 facts:** the create, fork, delete and auto-stop API; scoped-key permissions; snapshot and resume times; outbound firewall controls; account limits.
      - **Tests:** `crates/aq-worker/tests/boat_backend.rs` runs the conformance suite against an HTTP double. The live run is `#[ignore]`, with the key from env.
      - **Deployment:** each node has exactly one backend (0005 §2), so boat needs its own enrolled node. The service lives in `aq-server/compose.yaml` (E1c); file an aq-server task if it's outside your workspace. Ask the owner (`aq question`) whether boat is a second service beside the docker-local `aq-worker-cloud` or replaces its backend.
      - Run boat as a **second enrolled node** on the VPS, `aq-worker-boat`, keeping `aq-worker-cloud` on docker-local; each node has exactly one backend. File an emergent aq-server task for its Compose service.

      ### Current state
      - No boat code exists in any of the repositories (checked with grep).
      - C1 provides the trait and the conformance harness.
      - B5a and B5b provide the controller, reconciliation and sweeps.

      ### Interfaces
      - **Consumes:** C1, B5b and C3c.
      - **Produces:** `BoatBackend`, its configuration and the snapshot materialization records.
      - **Used by:** C4 (placement preference) and MS3.

      ### Out of scope
      - boat warm-start hibernation: deferred (plan, "Deferred backlog").
      - The Cloudflare backend: C8, also deferred.
      - Sweep logic itself: B5b.
      - Placement ordering: C4.

      ### References
      - 0005 §4.1, §5.2, §14 (boat), §15 item 8, SBX11, SBX15.
      - Plan §5 step 8, and "Review Focus" item 2.
    acceptance:
      - "The conformance suite passes against boat in an opt-in live test."
      - "Test `boat_unavailable_refuses_offers_without_orphans` (Review Focus 2) passes: API 5xx, 429 or the account limit leads to typed offer refusal, and the sweep leaves zero running sandboxes."
      - "Test `sweep_ignores_sandboxes_without_node_prefix` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace boat_unavailable_refuses_offers_without_orphans}
      - {id: t2, kind: test, target: cargo test --locked --workspace sweep_ignores_sandboxes_without_node_prefix}
      - {id: tests, kind: test, target: "cargo test --locked -p aq-worker --test boat_backend"}
