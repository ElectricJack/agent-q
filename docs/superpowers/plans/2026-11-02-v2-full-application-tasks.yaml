  - key: C5a2
    epic: C
    repo: aq-server
    title: Material leases bound to delegated permits
    type: feature
    class: deep-high
    review: adversarial
    needs: [B2, C5a1]
    continues: [AQ-08]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Bind each private material lease to the delegated permit of the attempt it was issued for. A runner can then fetch material with its own permit, and no other attempt's permit can use that lease.

      ### What to build
      - **Extend leases to B2's permits.**
        - 0005 §7: "Material is delivered through the existing private material lease (`/v1/worker/profiled/material`), extended to the delegated permit."
        - 0005 §6: the runner uses its permit for "material fetch where allowed".
      - **Record the binding on the lease.** Store the permit id, or the permit's attempt, grant generation, sandbox identity and node boot, in `admission_material_leases` (`aq-server/crates/aq-server/migrations/0010_profiled_authority.sql:47`). Add a new migration after 0041.
      - **Accept a permit-authenticated fetch only when all of these hold:**
        - the permit is current: not revoked, not expired, and on the right node boot;
        - its attempt equals the lease's `admitted_attempt_id`;
        - its sandbox identity matches;
        - the lease is `admitted` and unexpired.

        Fetching material happens during preparation, so a preparation-scoped permit is enough.
      - **Refuse every other case** with the existing uniform refusal, which reveals nothing about which check failed.
      - **Refuse other attempts.** Another attempt is refused even on the same node and boot. Test: `lease_bound_to_permit_refuses_other_attempt`.
      - **Keep the node-authenticated path working** while it is still used, with the same fencing: node, boot and admitted attempt.
      - **Revocation:** revoking a permit makes its bound lease unusable. Revocation happens on node revocation, cancellation and expiry (B2).
      - **Wire changes:** if a fetch or lease type changes, the contract owner B1 chose publishes the schemas and fixtures, and both sides consume a pinned version.

      ### Current state
      - The route is `POST /v1/worker/profiled/material` (`aq-server/src/profiled_execution/material_api.rs:260`). Its handler, `fetch` (line 55):
        - authenticates the node with `worker_api::authenticate_context`;
        - selects the lease by `lease_id`, `node_id`, `boot_id`, `admitted_attempt_id` and `state='admitted'`;
        - reads the material through `material::read_for_lease` (`material.rs:34`), which checks `SessionIdentity::Remote{node_id}` and the registry fingerprint.
      - Leases are issued by `material::issue_for_selection` (`material/issuance.rs`).
      - B2 lands first and edits the same `profiled_execution/material*` files. Rebase onto it.

      ### Interfaces
      - **Consumes:** B2's permit model, verification and revocation; C5a1's credential fields.
      - **Produces:** permit-bound leases and permit-authenticated material fetch.
      - **Used by:** B6a2, C6a and C6b (the runner fetches material); C5b (write-back is scoped to the same lease).

      ### Out of scope
      - Issuing, scoping, revoking and re-adopting permits, and enforcing permits on other routes: B2.
      - Runner-side permit authentication: B6a2.
      - The write-back endpoint and lease limits: C5b.
      - Credential backend lists: C5a1.

      ### References
      - 0005 §6, and §7 under "Rules" ("Subscription logins are leased, written back and wiped").
      - SBX6, SBX8.
      - 0002 §5, on material leases versus execution authority.
    acceptance:
      - Test `lease_bound_to_permit_refuses_other_attempt` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace lease_bound_to_permit_refuses_other_attempt}
    integration: pull_request
  - key: C5b
    epic: C
    repo: aq-server
    title: Subscription-login refresh write-back with refresh-lineage fencing; Codex device-auth enrollment
    type: feature
    class: deep-high
    review: adversarial
    needs: [C5a1]
    continues: []
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Three outcomes:
      - A subscription login that an attempt refreshes (for example Codex `auth.json`) is written back to the credential store without breaking that attempt's renewal.
      - Concurrent leases are capped per credential.
      - The owner can enroll a Codex device-auth login.

      ### What to build
      - **Write-back endpoint** (0005 §7; suggested `POST /v1/worker/profiled/material/refresh`).
        - Scoped to the attempt's current lease and authenticated like the material fetch it pairs with: the permit once C5a2 has landed, otherwise node, boot and attempt (record the follow-up).
        - Each write stores a new credential revision marked `refresh` in the same lineage, recording the writing lease.
        - Idempotent on (lease, content digest); existing 64 KiB cap; `subscription-login` only; refused after revocation or rotation. The contract owner publishes the request schema and fixtures.
      - **Renewal fencing** (0002 §5, 0005 §7): a refresh revision from this attempt's own lease is continuity. An operator rotation (new non-refresh revision, changed configured file) or a revocation (disabled or removed) still refuses renewal. Tests: `refresh_writeback_does_not_refuse_own_renewal`, `operator_rotation_refuses_renewal`.
      - **`max_concurrent_leases`** per subscription credential, default 1. A value above 1 requires `refresh_safe = true`, or validation refuses it. Count `pending` and `admitted` leases. A credential at its limit is `Unavailable` with a reason code, not `MissingCredentials` (P7). Test: `second_lease_beyond_limit_is_unavailable`.
      - The next attempt's lease uses the newest revision in the lineage.
      - **Enrollment:** an owner-only operation runs `codex login --device-auth` in a one-off enrollment sandbox.
        - The sandbox has a private `CODEX_HOME` with `cli_auth_credentials_store = "file"`.
        - The operation shows the device code to the owner and captures `$CODEX_HOME/auth.json` straight in as a new revision, never copied off a desktop by hand.
        - Device-code login must be enabled in ChatGPT security settings first; ask the owner with `aq question`.
        - This task has no worker dependency, so build the server side: the enrollment session and a one-shot capture endpoint. A recorded, operator-run container from an image with the pinned Codex CLI is acceptable as the sandbox. File any aq-worker work.
      - **Storage:** the store is read-only startup config today, and these revisions need a store that can be written at runtime. Follow the existing pattern (owner-only files, fingerprints server-side, no secret bytes in logs, prompts or inspection output) and record the design.

      ### Current state
      - The registry is loaded once at startup (`aq-server/src/intelligence/config.rs`, `IntelligenceConfig::load`). A rotation needs a restart.
      - Renewal requires `credential.revision == selection.credential_revision` and a fingerprint equal to `p.material.material_digest`: `profiled_execution/renewal/current.rs`, roughly lines 66–95, and also `renewal/pinned.rs` near line 196.
      - Leases live in `admission_material_leases` (migration 0010). Its uniqueness index is per offer, not per credential.
      - The worker keeps a changed ChatGPT login but never writes it back: aq-worker `crates/aq-session-host/src/private_inputs.rs`, roughly lines 531–545.

      ### Interfaces
      - **Consumes:** C5a1 (`kind`); C5a2 if it has landed.
      - **Produces:** the write-back endpoint, `max_concurrent_leases`, `refresh_safe`, refresh-lineage revisions and the enrollment operation.
      - **Used by:** C6b, I4b and I1–I3.

      ### Out of scope
      - Runner install, write-back call and wipe: C6b.
      - Enrollment for other harnesses: I1, I2 and I3.
      - Notifications: F4.
      - Retry suppression: B4.

      ### References
      - 0005 §7 (Rules), §8.3 "ChatGPT login" and "Getting a ChatGPT login into the vault", §15 item 6, SBX8.
      - 0002 §5.
    acceptance:
      - Test `refresh_writeback_does_not_refuse_own_renewal` passes.
      - Test `operator_rotation_refuses_renewal` passes.
      - Test `second_lease_beyond_limit_is_unavailable` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace refresh_writeback_does_not_refuse_own_renewal}
      - {id: t2, kind: test, target: cargo test --locked --workspace operator_rotation_refuses_renewal}
      - {id: t3, kind: test, target: cargo test --locked --workspace second_lease_beyond_limit_is_unavailable}
    integration: pull_request
  - key: C6a
    epic: C
    repo: aq-worker
    title: Runner Codex configuration for API keys and harness confinement modes
    type: feature
    class: deep-high
    review: adversarial
    needs: [C5a1, B6b, C3c]
    continues: [WRK-08, WRK-17]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Configure Codex inside the sandbox so that an API key never reaches the `agent` user. Implement both declared harness confinement modes, `native` and `container`, with a qualification record for each template × backend pair.

      ### What to build
      - **Codex configuration** (0005 §8.3 "Codex CLI"):
        - each attempt gets a private `CODEX_HOME` in the agent user's home, never a shared home and never the template's;
        - set `cli_auth_credentials_store = "file"`, so the login lives in `$CODEX_HOME/auth.json` and no keyring is used;
        - define a custom model provider (`model_providers.<id>`, with `base_url` pointing at B6b's loopback Responses proxy and `wire_api = "responses"`) and select it with `model_provider`.
      - **Key isolation:** only the proxy, running as `runner`, holds the real key. The agent sees at most a local proxy capability for this attempt, and never `OPENAI_API_KEY` or `CODEX_API_KEY`. Test `api_key_never_visible_to_agent_user`: the key bytes are absent from the agent's env, argv, `CODEX_HOME` and readable files.
      - **Confinement modes** (SBX19), read from the frozen launch manifest:
        - **`native`:** Codex's own sandbox is on (`--sandbox workspace-write`, today's default). It needs bubblewrap and unprivileged user namespaces.
        - **`container`:** `--sandbox danger-full-access`. Allowed only when the execution profile explicitly permits it, the backend provides the boundary, `runner`/`agent` separation is in place (SBX7), and the attempt holds only its own credentials. Never a silent fallback when `native` fails (SBX13). Test `container_mode_requires_profile_permission`.
      - **Default on docker-local:** `container` mode (0005 §8.3, decided 2026-11-02; C2 records the backend's finding).
      - **Qualification records,** one per template × backend: the mode, and whether `native` works, meaning writes outside the workspace are refused. A profile that requires `native` is refused on a `container`-only backend.
      - Keep the existing hardening flags.

      ### Current state
      - **Codex arguments:** `--sandbox workspace-write` is hard-coded in `aq-codex-mapper/src/lib.rs` (around lines 100 and 117), and `CODEX_CLI_VERSION = "0.166.0"` is at line 10. Goldens are in `crates/aq-worker/src/native/adapter/codex/goldens/`; `scoped.json` adds `openai_base_url`.
      - **API key in the agent's home:** `api_key_auth` (`native/adapter/codex.rs`, around line 287) writes `{"OPENAI_API_KEY":…}` into `auth.json`. The real key must not end up in the agent's home.
      - **Provider config refused:** `aq-session-host/src/private_inputs.rs` (around lines 54–97) builds `openai_base_url` and refuses `model_providers.` arguments.
      - **No confinement signal:** manifest validation always requires `aq.harness.confined-worktree` (`aq-session-protocol/src/lib.rs`, around line 285). `container` mode needs its own declared signal. That is an aq-session-protocol contract change (schemas and fixtures). The execution-profile field it needs is in aq-server (`aq-profiles` `Execution`); file that change if it is outside this workspace.

      ### Interfaces
      - **Consumes:**
        - B6b: the proxy and the OS users;
        - C5a1: credential `kind`;
        - C3c: the templates;
        - C2: its confinement decision.
      - **Produces:** the Codex config builder, confinement-mode handling and the qualification records.
      - **Used by:** C6b, I4a and I1–I3.

      ### Out of scope
      - The proxy itself and the privilege drop: B6b.
      - Subscription-login install, write-back and wipe: C6b.
      - Real-provider qualification: I4a.
      - Other harnesses: I1, I2 and I3.

      ### References
      - 0005 §7 (table row "Provider API key"), §8.3, §11 "Harness confinement", SBX7, SBX19.
    acceptance:
      - Test `container_mode_requires_profile_permission` passes.
      - Test `api_key_never_visible_to_agent_user` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace container_mode_requires_profile_permission}
      - {id: t2, kind: test, target: cargo test --locked --workspace api_key_never_visible_to_agent_user}
