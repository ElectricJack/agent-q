      - aq-dashboard/docs/specs/0003-dashboard-api.md §5
      - v1: agent-queue2/src/commands/conversation_commands.py
    acceptance:
      - Test `owner_message_reaches_supervisor_and_reply_is_recorded` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace owner_message_reaches_supervisor_and_reply_is_recorded}
  - key: F2
