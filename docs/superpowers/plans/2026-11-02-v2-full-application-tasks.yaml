  - key: J7
    epic: J
    repo: aq-git
    title: Supported repository profile decision and widening
    type: research
    class: deep-high
    needs: [A3a]
    continues: []
    spec: [aq-git/docs/specs/0001-aq-git.md, aq-git/README.md]
    description: |
      ### Goal
      Decide, from evidence about the owner's actual repositories, which aq-git repository-profile restrictions to lift. Then either implement the highest-value widening with tests or document an explicit refusal.

      ### What to build
      - **Survey every active v1 project repository.** List them with `aq project list` (v1 CLI), with the v1 vault `~/.agent-queue/vault/projects/` (about 23 entries) as a cross-check. For each repository record:
        - object format (`git rev-parse --show-object-format`);
        - shallow or partial history;
        - `.gitmodules` and gitlinks;
        - LFS (`filter=lfs` in `.gitattributes`, `git lfs ls-files`);
        - every `.gitattributes` attribute used (text/eol/binary/diff/merge/filter/custom drivers);
        - required signed commits (branch protection, via `gh api`);
        - size.

        Classify the fit as supported, blocked-by-X, or not a code repository.
      - **Current profile** (spec §5.2): supported repositories use complete SHA-1 history, regular files, exec bits, symlinks and standard merges. Shallow, partial, submodules, LFS, custom merge drivers, required checkout filters and mandatory signing are rejected with a named capability error. Attribute features the profile doesn't support are rejected before workspace creation or merge. Never operate silently on unresolved gitlinks or LFS pointers.
      - **Recommendation:** rank the widenings by how many active repositories each unblocks, against its risk.
      - **Implement the top one** through "explicit compatibility fixtures" (§5.2), with conformance tests (for example, standard text/binary attributes need conformance tests per §5.2) and an updated `unsupported_features` advertisement. Alternatively, document the refusal and the reason.
      - **Report:** `docs/implementation/J7.md`, submitted as a review.

      ### Current state
      - Rejection points in aq-git:
        - `crates/aq-git-core/src/operations.rs:155` (shallow pool), `:396` (gitlink `160000`), `:406` (any `.gitattributes`);
        - `crates/aq-git-core/src/artifact/mod.rs:999-1010` (submodule and `.gitattributes` import);
        - `crates/aq-git-core/src/workspace/mod.rs:128,772`;
        - the advertised list at `crates/aq-git-core/src/service.rs:365`: `["shallow","partial","submodules","lfs","attributes","signing","pruning"]`.
      - The README (line 33) states the same restrictions.
      - aq-git 0.2.0 is released by A3a and pinned by A3b.

      ### Interfaces
      - **Consumes:** A3a's released baseline.
      - **Produces:**
        - the fit report, which D2 cites when it refuses unsupported repositories with a reason;
        - any new capability name, consumed by D2 and A3b-style re-pins.

      ### Out of scope
      - Onboarding API and refusal UX (D2).
      - Releasing aq-git 0.2.x or re-pinning aq-server: file follow-up tasks.
      - Performance (J1, deferred).
      - Editing aq-git `docs/specs/0001-aq-git.md`: record the proposed text and file a `docs` task.
      - SHA-256 repositories, unless the survey finds one.

      ### References
      - aq-git `docs/specs/0001-aq-git.md` §5.2, §16
      - aq-git `README.md` (line 33)
    acceptance:
      - "The report lists each active repository's fit."
      - "The chosen widening is implemented with tests, or the refusal is documented."
    deliverables:
      - {id: review, kind: review, target: other}
    priority: low
