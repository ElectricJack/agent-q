  - key: G6
    epic: G
    repo: aq-server
    title: Results comments, feedback tasks, waivers and a configured media store
    type: feature
    class: standard-high
    needs: [G1b]
    continues: [API-11, API-12, API-06]
    spec: [aq-server/docs/specs/result-media-png.md, aq-dashboard/docs/specs/0003-dashboard-api.md]
    description: |
      ### Goal
      Give Results a server-side feedback loop, plus a production media store whose absence is reported explicitly. The loop covers: comments and threads on exact result revisions, explicit feedback tasks linked to a result, evidence waivers, Latest/Needs review/Following feeds with follow, and capture-requirement evaluation.
      ### What to build
      All mutations use G1a durable operation semantics. Routes and entities are from 0003 §6.
      - A Result projection over existing retained reports (`report_id` / `revision`, `profiled_execution/human_results.rs`): `Result {id, version, project/task refs, current_revision}`, an immutable `ResultRevision` and a separately versioned `ResultAssessment`.
      - Feeds and following:
        - `GET /api/v1/results?mode=latest|needs_review|following`, with scope, media, time and task filters. Default page 20; G1a cursors.
        - Following = explicitly followed results plus the user's opted-in feedback threads.
        - Needs review = an unresolved applicable review or evidence decision.
        - `GET /api/v1/results/{id}/revisions/{revision}`.
        - `PUT /api/v1/results/{id}/follow` with a desired boolean. Following does not mean acceptance.
      - Comments:
        - `GET` / `POST /api/v1/results/{id}/revisions/{revision}/comments`.
        - `POST /api/v1/comments/{id}/revisions` makes a version-guarded correction and keeps history.
        - The anchor is a union: `result` | `image_region {artifact_id, digest, x, y, width, height in [0,1]}` | `video_range {start_ms, end_ms}`. The artifact must belong to that revision.
        - Body is 1-16,384 UTF-8 bytes. One thread holds ordered replies.
      - `POST /api/v1/threads/{id}/resolve`: version-guarded, naming the exact follow-up result revision and a reason. Linking a task or submitting a fix never resolves a thread.
      - `POST /api/v1/feedback-tasks` creates a task from a draft:
        - Draft fields: title (1-200 chars), description, acceptance criteria, project/parent refs, origin thread/comment revision, result/artifact pins.
        - Use a durable intent with one fixed upstream graph key. Reuse G1b `task.create`, where key = `operation_id`.
        - If the task was created but the link is uncertain, the operation names the task and reconciles the link under the same identity. Never create a second task.
        - Test `feedback_task_links_result_revision`.
      - `POST /api/v1/feedback-links` links an existing task.
      - `POST /api/v1/results/{id}/evidence-waivers`: authorized actor, reason, requirement identity and policy revision.
      - Capture requirements:
        - Each `CaptureRequirement` has id, policy revision, kind, scenario/steps, viewport/environment, count, required, applicability explanation and gate binding.
        - A requirement set is a versioned task-policy snapshot pinned per result revision. Choose and document where task policy is stored (unverified).
        - Evaluation: each required artifact is finalized, retained and bound to the evaluated revision, or waived. Presence alone is not acceptance.
      - Media store: configure the existing PNG owner for production.
        - Settings: `result_media` (`config.rs:51`), `MediaConfig {root, storage_id, uploads_enabled}` (`result_media/config.rs`). Use a persistent private root and a stable `storage_id`, and document the volume.
        - When unconfigured or disabled: bootstrap `results.media.upload` is false with a reason, and upload routes return a typed refusal (for example 503 `media_store_unconfigured`), not 404 (test `media_upload_disabled_without_store_is_explicit`).
      - Add the bootstrap capabilities `results.comment` and `results.feedback`.
      ### Current state
      - Results are metadata only (`/api/human/results`, `/api/human/results/{id}/revisions/{revision}`). No comments, feedback or waiver code exists.
      - Upload routes mount only if enabled (`result_media/api.rs:108-125`); without config nothing mounts (`lib.rs:236`), so requests get 404.
      ### Interfaces
      Consumes: G1a/G1b (union, operations, `task.create`).
      Produces: the routes above, their schemas and fixtures, and the capabilities. Used by G7 and D9 (completion policy can read capture evaluation).
      ### Out of scope
      - Dashboard UI (G7).
      - Clips and other formats, transcoding, and machine/worker capture ingestion (not in this plan; record as a remaining limit).
      - The production Compose file (E1a); hand it the media volume and config entries.
      - Completion-policy wiring (D3/D9).
      ### References
      - aq-dashboard/docs/specs/0003-dashboard-api.md §6.
      - aq-server/docs/specs/result-media-png.md "Storage grant, quotas, commit and cleanup"; "Closed HTTP contract and delivery".
      - aq-dashboard/docs/specs/0002-product-design.md §7.
    acceptance:
      - "Test `feedback_task_links_result_revision` passes."
      - "Test `media_upload_disabled_without_store_is_explicit` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace feedback_task_links_result_revision}
      - {id: t2, kind: test, target: cargo test --locked --workspace media_upload_disabled_without_store_is_explicit}
