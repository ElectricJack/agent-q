  - key: MS1
    epic: M
    repo: aq-server
    title: "MS1 gate: real agent, sandboxed, local"
    type: operator
    class: standard-high
    verification: human
    needs: [MS0, A3a, A3b, B1, B2, B3, B4, B5a, B5b, B6a2, B6b, B6c, B7, C1, C2, C3a, C3b, C3c, C4, C5a2, C6a, D1a, D1b, D3, I4a, B6a1, C5a1, D0]
    continues: [GATE-04]
    spec: [aq-server/docs/superpowers/plans/2026-11-02-v2-full-application-plan.md]   # §1, §5 step 1
    description: |
      ### Goal
      Demonstrate to the owner, on the E0 local stack with the desktop worker, that a real Codex (API-key) agent runs in a `docker-local` sandbox and that the work loop and recovery behave safely. This is a human-verified gate. Its agent assembles, runs and records the scenario; it does not implement features.

      ### What to build
      Run against E0 (`compose.dev.yaml`) with the B5 node controller on the C2 backend and the C3c `rust` template. Each step records its evidence.
      1. **Two dependent graph tasks** on the E0 scratch repository.
         - Codex (API key, `container` mode) runs the first in a docker-local sandbox: it edits code, checks, and publishes through aq-git (D1a/D1b policy).
         - Evidence: task, attempt, grant and permit IDs; the sandbox ID and template digest; the retained source revision; the publication receipt (commit SHA, plus a PR URL or fast-forward).
      2. **Automatic completion.** The first task completes through D3's default policy (version-checked graph completion), and the second becomes ready and starts.
         - Evidence: graph versions and the outbox event.
      3. **Cancel** an attempt mid-run (B3).
         - Evidence: the cancellation ID, the recorded disposition, and the sandbox stopped or destroyed with stop proof.
      4. **Fail an attempt and see the retry** (B4).
         - Evidence: the replacement attempt in a new sandbox, with retry and sandbox-minutes budget consumption.
      5. **Restart the worker node, and separately aq-server, mid-attempt.**
         - Evidence: re-adoption or stop-and-preserve, renewal behaviour, no duplicate effects (B5b; Review Focus 4).
      6. **Manual Windows-suspend drill** during an attempt, then resume (Review Focus 1).
         - Evidence: timings, the reconcile log, and whether the attempt continued or was retried; no lost work.

      Also:
      - Record the stack and sandbox memory and CPU during the run. E5 sizes the VPS from measured MS1 memory.
      - Write a rerunnable demo script under `scripts/`, referenced from MS1.md, that seeds the tasks and runs steps 1–5. The suspend drill is a written procedure.
      - Write `docs/implementation/MS1.md` with commands, commits, image and template digests, results per step, and limits. Then request owner verification.

      ### Current state
      - The milestone definition and the Review Focus items are in plan §1.
      - The component tests behind each step belong to the prerequisite tasks: C2 `wsl_suspend_resume_reconciles_sandboxes`, B2 `server_restart_mid_attempt_resumes_or_preserves`, D3 `false_pass_result_does_not_complete_task`, and I4a `codex_live`.

      ### Interfaces
      - **Consumes:** every prerequisite listed in `needs`, especially E0, B5a/B5b, B6a1–B6c, B7, C2, C3c, C4, C5a1/C5a2, C6a, D1a/D1b, D3, B3, B4 and I4a.
      - **Produces:** MS1.md, the demo script and the memory figures (consumed by E5), plus the owner's approval, which gates MS2.

      ### Out of scope
      - Fixing defects found: file each with `aq task create --reason …` against the owning task (for example C2, B5b, D3), and close the gate with them listed.
      - The VPS or hosted run (MS2).
      - ChatGPT login (I4b).
      - The supervisor, dashboard writes, and the boat backend (MS3 tasks).
      - Self-approving the gate.

      ### References
      - plan `2026-11-02-v2-full-application-plan.md` §1, Review Focus 1, 4 and 5, §5.2
      - aq-server `docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §4, §11
    acceptance:
      - "The owner approves after watching or rerunning the demo."
    deliverables:
      - {id: demo, kind: file, target: "docs/implementation/MS1.md"}
  - key: MS2
