    repo: aq-server
    title: Typed task and knowledge commands
    type: feature
    class: standard-high
    needs: [G1b, B4]
    continues: [API-10, API-03]
    spec: [aq-dashboard/docs/specs/0003-dashboard-api.md, aq-graph/docs/specs/0004-shared-node-model.md]
    description: |
      ### Goal
      Add version-guarded task and knowledge commands as action-union kinds. With them, dashboard and `aqv2` users can edit, cancel, retry, reprioritize and re-link tasks, and author, correct, verify, retire and restore knowledge.
      ### What to build
      - Task kinds (subject: a task EntityRef with revision):
        - `task.edit`: graph `update_node {id, expected_version, patch}` for title, body, acceptance_criteria and labels.
        - `task.cancel`: delegate to B3's owner cancellation API, which issues a durable cancellation ID. `confirmed` means the cancellation was admitted, not that writers stopped.
        - `task.retry`: request a replacement attempt through B4.
          - Allowed only after the previous attempt has settled with stop proof.
          - Must stay within the shared retry, spend and sandbox-minutes budgets, and never resets them.
          - Test `task_retry_creates_replacement_attempt`.
        - `task.reprioritize`: task priority is not modelled today. Nothing in aq-server reads it. aq-graph metadata requires namespaced keys such as `aq:priority` (`aq-graph/src/domain.rs:724`). Define the priority value under one namespaced key with `expected_version`, and agree that key with F2 (priority at creation).
        - `task.dependency.add` / `task.dependency.remove`: graph `add_edge` (`edge_type` `blocks`) and `remove_edge {id, expected_version}`. Run them in one atomic batch with version checks.
      - Knowledge kinds, proxied to aq-graph with expected versions:
        - `knowledge.author`: `create_node` with kind knowledge. New nodes default to `content_type` note and verification `unverified`; creation cannot assert verified.
        - `knowledge.correct`: `update_node` with `expected_version`. A stale version returns a `conflict` disposition with `current_versions` (test `knowledge_correct_with_stale_version_conflicts`).
        - `knowledge.verify`: `verify_node {id, expected_version, verification, evidence[]}`. Requires administrator authority, a reason and named evidence.
        - `knowledge.retire`: `update_node` patch `retired: true`, a nonblank `retirement_reason` and an optional `successor_id`. A successor needs a live `supersedes` edge from successor to the retiring node.
        - `knowledge.restore`: `restore_node {id, expected_version, revision, include_lifecycle?}`. Administrator only for knowledge.
      - Graph rules (0004): every meaningful mutation advances `version`; content and lifecycle changes reset verification; retired content cannot be edited in place.
      - Add the per-kind schemas and fixtures to `protocol/dashboard-actions/v1/`. Add one bootstrap capability per independent mutation, gated on owner plus a configured graph mutation identity.
      ### Current state
      - The graph `Mutation` enum (`aq-graph/src/domain.rs:275-371`) has create_node, update_node, delete_node, restore_node, add_edge, verify_node, set_summary and remove_edge. There is no separate retire op; retirement is an `update_node` patch.
      - AQ's graph mutation identity is `mutation_actor` (`agent_access/human.rs:64-69`).
      - `agent_access/mutations/authorize.rs` already builds `update_node` / `remove_edge` batches for agents. Reuse the patterns, not the agent authority.
      - Whether AQ's mutation actor has graph-administrator authority for verify, retire and restore is (unverified).
      ### Interfaces
      Consumes: G1a/G1b (union, operation lookup), B3 (owner cancel API), B4 (replacement attempts and budgets).
      Produces: the kinds listed above, with schemas and fixtures. Used by G3 and F7.
      ### Out of scope
