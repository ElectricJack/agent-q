  - key: F7
    epic: F
    repo: aq-server
    title: v2 human CLI (`aqv2`) over the same domain operations
    type: feature
    class: standard-high
    needs: [G1b]
    continues: [API-02]
    spec: [aq-server/docs/architecture/0001-ecosystem-and-releases.md]   # E6
    description: |
      ### Goal
      Ship `aqv2`, a human CLI that performs the same domain operations as the dashboard, so the owner can run the daily loop from a terminal.

      ### What to build
      - A new Rust binary named `aqv2` in aq-server, for example in its own crate under `crates/`. It must never install as `aq` or `agent-queue` while v1 is live.
      - Command groups:
        - `tasks`: list, show, create, cancel, retry;
        - `decisions`: list, show, respond;
        - `messages`: inbox, send;
        - `chat`: the supervisor conversation, with v1 parity for `aq chat --once TEXT`, which sends, waits for the reply up to a timeout, prints it, and exits non-zero on timeout;
        - `workers`: list, revoke, enroll;
        - `projects`: list, show, onboard.
      - Every mutation goes through `POST /api/v1/actions` with an `operation_id` the client mints. Recovery uses `GET /api/v1/operations/{id}` with the same kinds, payloads and `operation_id` semantics the dashboard uses (E6). Reads use the same `/api/v1/...` reads where they exist.
      - Do not authorize independently in the CLI; the server decides.
      - Authentication follows the existing human CLIs: `--origin https://...` plus `--cf-access-token-file` for an owner-only Cloudflare Access JWT, and the CSRF header `X-AQ-Request: 1` on non-GET requests.
      - No automatic retry of uncertain mutations: print the operation ID and let the user query it.
      - If an operation the server doesn't offer yet is requested, for example onboarding before D2 or cancel/retry before G2, fail with an explicit `unsupported` error. Never fall back to a different route.
      - `--json` output gives stable machine-readable results.

      ### Current state
      - The human CLIs are `aq-session` (`crates/aq-session-cli`) and `aq-notify` (`crates/aq-notify`). Both use `--origin` and `--cf-access-token-file`, and neither retries.
      - Human routes include `/api/workers` and `/api/workers/{id}/revoke` (`crates/aq-server/src/admin_api.rs:31-33`), `/api/projects` (`project_bindings.rs:47`), `/api/human/conversations/...` (`agent_access/messaging/global.rs:112`) and `/api/reviews/decisions` (`reviews.rs:979`).
      - `/api/v1/actions` does not exist yet (G1a/G1b).

      ### Interfaces
      Consumes:
      - G1a/G1b's action union, operation lookup, error envelope and fixtures.
      - F2's create and graph-create kinds.
      - G2's cancel and retry kinds.
      - F1b's live conversation, for chat replies.
      - D2's onboarding.

      Produces:
      - The `aqv2` binary. The MS3 gate uses it.

      ### Out of scope
      - Defining new action kinds: G1b, G2 and F2 own them.
      - The supervisor runtime: F1a and F1b.
      - Onboarding logic: D2.
      - Terminal attach: the existing `aq-session`.
      - Packaging into release manifests: E-series.

