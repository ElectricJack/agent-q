  - key: F1b
    epic: F
    repo: aq-server
    title: Supervisor conversation dispatch and reply, and scoped supervisor tool credentials
    type: feature
    class: standard-high
    needs: [F1a]
    continues: [AQ-17, API-07]
    spec: [aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md]
    description: |
      ### Goal
      When the owner sends a message to the global supervisor conversation, it is dispatched to the live supervisor session, and the supervisor's reply is recorded in the same conversation. The supervisor acts through one scoped central credential.

      ### What to build
      - Dispatch: take queued API-07 human mail through the existing central reservation owner and give it to the F1a session as one bounded turn. AQ-17 rules:
        - A plan is one turn over one immutable, ordered batch of 1–16 message references. It carries no bodies or credentials.
        - Record the dispatch intent and the host-input intent before handing anything to the host. Host Running is not proof of delivery.
        - Uncertain handoff stays `delivery_unknown` until the exact original input is reconciled. Unknown or handed-off mail is never re-sent automatically to a successor generation.
      - Reply: the supervisor authors a reply into the global conversation (the existing `mailbox_messages` and `mailbox_heads` owners), with a server-derived author and an exact dispatch association. Keep logical admission, host delivery and receipt as separate fields (dashboard API §5).
      - Supervisor tool credential: one scoped central credential with four scopes: graph reads and writes, enqueue (the commands are F2's), messaging (send to task and session mailboxes), and decisions. Bind it to the current supervisor generation and expire or revoke it with that generation. Store it in the supervisor host only; it never reaches a worker (W1, SBX17). Do not fabricate a worker, task or attempt identity.
      - When dispatch and reply are live, set the `supervisor.conversation` capability to true.

      ### Current state
      - Routes `/api/human/conversations/global` and `/api/human/conversations/{conversation}/messages` (GET and POST) are at `crates/aq-server/src/agent_access/messaging/global.rs:112`. History is limited to 16 messages and 256 KiB per page. Retention is capped at 4096 operations and 64 MiB.
      - The runtime is always "unavailable / not_attempted". No reply can be authored (docs/implementation/API-07-supervisor-conversation-foundation.md).
      - `ReservationOwner::reserve_batch` is at `agent_access/messaging/global/reservations.rs:154`.
      - Capability `supervisor.conversation` is hard-coded `false` at `crates/aq-server/src/dashboard_api/service.rs:255`.

      ### Interfaces
      Consumes:
      - F1a's central session owner and live generation.
      - Migration 37 reservations.
      - G1b, which moves supervisor send behind the action union. If G1b has landed, use its send path; otherwise use the existing route.

      Produces:
      - Recorded supervisor replies, readable through the conversation history route.
      - The `supervisor.conversation` capability.
      - The supervisor credential scopes that F2's commands and F3's messaging check.

      ### Out of scope
      - The supervisor host container and the session lifecycle: F1a.
      - The enqueue-work commands: F2.
      - Agent messages and replies to the supervisor from sandboxes: F3.
      - The dashboard panel: G8. The `aqv2` chat command: F7.
      - Agent questions: F5.

      ### References
