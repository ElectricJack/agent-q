      - Only local bare remotes are qualified (aq-git docs/release-status.md).

      ### Interfaces
      Consumes: nothing new. Produces: a `credential_profile` field on repository bindings and the `remote_auth_failed` error, used by D1a, D1b and D2.

      ### Out of scope
      - Storing or rotating the credentials centrally (D2).
      - Publication policy and PR creation (D1b).
      - Widening the repository profile to submodules, LFS and so on (J7).

      ### References
      - aq-git/docs/specs/0001-aq-git.md, the sections on remotes and credentials (consult only if ambiguous).
