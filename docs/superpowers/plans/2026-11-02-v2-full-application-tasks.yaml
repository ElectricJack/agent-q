    repo: aq-dashboard
    title: "Bundle compatibility: digest check and draft preservation across update"
    type: feature
    class: standard-high
    needs: [E3]
    continues: [UI-02]
    spec: [aq-dashboard/docs/specs/0001-dashboard.md]   # U8
    description: |
      ### Goal
      An open tab detects that the server now serves a different dashboard bundle, or lacks a capability the bundle requires. It then offers a safe reload that keeps unsent drafts.
      ### What to build
      - Digest check:
        - `Bootstrap.product.dashboard_digest` is `"sha256:" + SHA-256` of the exact `dashboard-manifest.json` bytes. It is null when no bundle is mounted (`aq-server/crates/aq-server/src/dashboard_assets.rs:86-88,178`; `dashboard_api.rs:212`).
        - The bundle cannot embed its own manifest digest. Pick and document a way to capture the running bundle's identity, such as the first bootstrap after load or the served manifest.
        - A null digest (dev or mock) means no comparison.
      - Bootstrap refetches every 30 s (`src/app/session.tsx:62`). When the digest differs:
        - show a non-blocking "A new dashboard version is available — Reload" prompt;
        - never reload automatically, and never claim stale success.
      - Required capabilities:
        - E3 adds required API contract versions and capabilities to the bundle manifest. Compile the same list into the app.
        - If bootstrap `capabilities[]` or `contracts[]` lack one, or a request returns 426, block only the dependent feature and show an upgrade path. Never coerce (0003 §8 item 4). Keep drafts.
      - Draft store:
        - A shared draft store in `sessionStorage` (per tab), keyed by principal id + authorization revision + draft key.
        - Save before reload and restore after.
        - Never put drafts in URLs. Clear them on logout or identity change (0002 §10). No persistent sensitive offline cache (0003 §2).
        - Adopt it in the existing composers: `features/work/CreateTask.tsx` and `features/supervisor/SupervisorConversation.tsx`.
      - No service worker that could pair old UI with new APIs (0001 §6).
      - Named test `digest_change_prompts_reload_preserving_draft`.
      ### Current state
      - There is no digest comparison and no draft persistence; drafts live in React state.
      - `src/app/session.tsx` only rejects envelopes whose `api_version` is not `dashboard-read-1`, and handles 404/426 as incompatible.
      - `scripts/bundle-manifest.mjs` writes `{schema_version: 1, api_version: "dashboard-read-1", files}`. The server reader rejects other schema/api values (`dashboard_assets.rs:110`).
      ### Interfaces
      Consumes: E3's manifest fields (required capabilities and contract versions) and bootstrap.
      Produces:
      - the digest/compatibility banner in the shell;
      - a reusable draft hook that the G3, G7 and G8 forms can adopt.
      ### Out of scope
      - Archive and manifest format (E3). Server embedding and cache headers (E1b).
      - Forms owned by other tasks beyond the two existing composers (G3, G7, G8). Visual sign-off (G11).
      ### References
