    needs: [G1b, G2]
    continues: [API-10]
    spec: [aq-server/docs/specs/0002-execution-and-agent-access.md]
    description: |
      ### Goal
      The supervisor, the dashboard and the CLI can enqueue work as in v1: create a task or a whole task graph with dependencies, priority, project, profile hint and intelligence hint. They do it through typed, idempotent commands that return operation receipts.

      ### What to build
      - New action kinds behind G1b's action union (`POST /api/v1/actions`, `GET /api/v1/operations/{id}`) covering four operations:
        - create a task, extending G1b's migrated task-create action;
        - create a task graph: up to the graph batch limit of nodes, with `blocks` edges among the new nodes or to existing tasks, applied as one atomic aq-graph mutation batch;
        - set priority at creation;
        - select project, profile hint and intelligence hint.
      - Store the hints and priority as namespaced graph metadata. aq-graph accepts only `aq:`-style keys, for example `aq:priority`.
      - Envelope from dashboard API §7: `{operation_id, kind, subject, expected_versions, reason?, payload}`. Bind the ID to the principal, the scope and a canonical request digest before dispatch. An identical retry returns the retained disposition. Changed bytes return `conflict`.
      - Dispositions are `pending`, `confirmed`, `conflict`, `rejected` and `unknown`. Spec 0002 §6: commit the intent before sending, use a stable derived graph idempotency key, and on timeout query or replay the identical key. A version conflict stops the operation.
      - The supervisor may call these only through F1b's scoped credential. The owner calls them as an Owner principal.
      - Parity inventory: list the v1 commands the owner uses and mark each one covered or deliberately excluded with a reason. Include `aq chat`, `aq task create` (`--project --title --description --priority 1–300 --type --intelligence-class --parent ...`), `aq task batch-propose` (`--tasks --edges`) and `aq task add-dependency`. Put the table in `docs/implementation/F2.md`.

      ### Current state
