  - key: B4
    epic: B
    repo: aq-server
    title: Retry/replacement attempts, fair multi-project scheduling and moving-ref sources
    type: feature
    class: deep-high
    needs: [B3, I0]
    continues: [AQ-08]
    spec: [aq-server/docs/architecture/0002-execution-and-recovery.md, aq-server/docs/specs/0003-project-execution-bindings.md, aq-worker/docs/specs/0001-worker-framework.md]
    description: |
      ### Goal
      Let a task get a new attempt after a settled failure, within shared budgets. Schedule fairly across projects, and accept moving-ref sources resolved to an exact commit at offer time.

      ### What to build
      - **Replacement attempts:**
        - A task with a failed, expired or cancelled attempt becomes eligible again only after that attempt has settled with stop proof (X3, SBX4) and its effects are reconciled (0002 §5 retry table).
        - Uncertain prior execution blocks replacement. That is the initial default.
        - Each replacement gets a new attempt ID, session and generation (`no_grant::next_generation`).
      - **Shared budgets** (P7): retry limits and budgets "cannot reset merely by creating another attempt" (0002 §5).
        - Use the lineage limits `SelectionPolicy.max_attempts` and `max_lineage_elapsed_ms` (`aq-profiles/src/selection_policy.rs:33`).
        - Add a per-task sandbox-minutes budget, so a flapping provider cannot spin up paid sandboxes indefinitely.
        - Exhaustion blocks the task with an explainable reason (test `retry_budget_exhaustion_blocks_task`).
        - The existing never-granted bound (`MAX_UNGRANTED_RETRIES = 8`) stays.
      - **Fair scheduling:** replace "highest-priority project, first 8 ready items" with a durable cursor across enabled projects that still respects priority. Waiting work gains priority, and no project is starved (worker spec §8.2). Test `two_projects_share_capacity_fairly`.
      - **`NamedRef` sources** (`refs/heads/*`, `refs/tags/*`):
        - Resolve the ref to an exact commit at offer time through the existing aq-git `repo.observation` path, and freeze that commit in the offer.
        - A launch never follows the moving ref.

        Test `named_ref_resolves_to_exact_commit_at_offer`.
      - **Successor source:** when policy selects it, a successor starts from the predecessor's retained source or checkpoint as an explicit base (X4, 0002 §7). It inherits no credentials, directories or conversation state.
      - Make the producer honour task priority (`aq:priority`, set by G2/F2) when choosing among eligible tasks, after fairness across projects.

      ### Current state
      All paths are under `crates/aq-server/src/profiled_execution/`.
      - `producer/workflow.rs:191-208`: `first_eligible_task` requires `counts.started == 0` (line 204).
      - `workflow.rs:263-264` sorts projects and takes the first. `:275` and `:354` call `scheduling_ready(..., 8, None)`.
      - `workflow.rs:123` and `:269` refuse non-`Immutable` sources.
      - `NamedRef` observation already exists in `source.rs:105-125` and `source/ownership.rs:54-70`.
      - `no_grant.rs:235-266` holds `AttemptCounts` and `check_retry_bound`.
      - `continuation_policy.rs` computes the remaining lineage budget from `BudgetSnapshot` (`aq-selection/src/domain.rs:174`).
      - `config.rs:20` defines `ProjectPolicy{project_id,enabled,priority,source,retention_handle}`.

      ### Interfaces
      - **Consumes:** B3's stopped, cancelled settlement; problems filed by I0.
      - **Produces:**
        - replacement eligibility and budget checks, used by G2's retry command and H2's accounting;
        - the fair scheduler cursor, extended by C4;
        - `NamedRef` offers.

      ### Out of scope
      - Cross-node placement preference, node ceilings and template eligibility (C4).
      - The owner retry command (G2).
      - Feeding usage and cost into budgets (H2).
      - Cancellation (B3).
      - Automatic settlement (D3).

      ### References
      - `aq-server/docs/architecture/0002-execution-and-recovery.md` §5, §7, §9 (X4, X7)
      - `aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md` §7 (P7)
      - `aq-server/docs/specs/0003-project-execution-bindings.md`
      - `aq-worker/docs/specs/0001-worker-framework.md` §8.1–8.2
    acceptance:
      - "Tests `failed_attempt_is_replaced_within_retry_budget`, `retry_budget_exhaustion_blocks_task`, `two_projects_share_capacity_fairly` and `named_ref_resolves_to_exact_commit_at_offer` pass."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace failed_attempt_is_replaced_within_retry_budget}
      - {id: t2, kind: test, target: cargo test --locked --workspace retry_budget_exhaustion_blocks_task}
      - {id: t3, kind: test, target: cargo test --locked --workspace two_projects_share_capacity_fairly}
      - {id: t4, kind: test, target: cargo test --locked --workspace named_ref_resolves_to_exact_commit_at_offer}
  - key: B5a
    epic: B
    repo: aq-worker
    title: 'Node controller core: enrollment, boot incarnation, journal-before-backend, capacity'
    type: feature
    class: deep-high
    review: adversarial
    needs: [B1, C1]
    continues: [WRK-02, WRK-18]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-worker/docs/specs/0001-worker-framework.md]
    description: |
      ### Goal
      Turn `aq-worker run` into the long-lived node controller. It runs no agents. It owns identity, registration, capacity, offer acceptance and a journal-before-backend sandbox lifecycle over the C1 backend trait.

      ### What to build
      - **Identity** (SBX2): reuse the existing enrollment. Create a fresh boot ID on every process start (worker spec §4.1). On startup, take the root lock and validate the state format (§16).
      - **Registration:** register with B1's registration fields:
        - backend kind and capabilities;
        - template digests with their harness versions;
        - max concurrent sandboxes and an optional spend ceiling.
      - **Node-wide capacity:**
        - A sandbox counts against capacity from reservation until stopped-writer proof.
        - At the sandbox or spend ceiling, refuse an offer with a typed reason, alongside the worker spec §8.4 reasons (`capacity_changed`, `disk_reserve`, `environment_unavailable`, `grant_denied`, `preparation_backlog`, `draining`).

        Test `capacity_refuses_offer_at_sandbox_ceiling_with_typed_reason`.
      - **Offer acceptance** through the native routes (`/v1/worker/profiled/poll`, `/v1/worker/profiled-v2/proposal` and `/accept`). Persist the reservation before acceptance.
      - **Journal intent before backend** (SBX3, 0005 §4 steps 1–2):
        1. Journal the intent.
        2. Call `create` from the exact template digest.
        3. Record the backend sandbox ID.
        4. Label the sandbox with node, boot and attempt where the backend supports labels.

        Persist before every ambiguous boundary, and keep secrets in separate protected files (worker spec 0002 §2). Test `journal_records_intent_before_backend_create`.
      - **Sandbox lifecycle** through C1's trait: create, deliver private material (the delegated permit and the frozen launch manifest), start runner, inspect, stop, destroy with confirmation. Use the fake backend in tests.
      - Remove `run-native`'s refuse-if-state-exists check.

      ### Current state
      All paths are under `crates/aq-worker/src/`.
      - `main.rs:39` and `:390-407`: `Cmd::Run` only runs the foundation heartbeat `run_loop` from `client.rs`.
      - `Cmd::RunNative` (`main.rs:83`, `:275`) calls `native::runner::run_once` (`native/runner.rs:76`), which runs one attempt per invocation. The refuse-if-state-exists check is at `native/runner.rs:102-105`.
      - The native journal is `native/journal.rs`.
      - The synthetic runtime is `runtime.rs`, `journal.rs` and `driver.rs`, used by `run-execution`.
      - `config.rs:14` defines `WorkerConfig{server_url,node_id,credential,cf_client_id,cf_client_secret}`.
      - No backend trait exists yet; C1 delivers it.
      - The aq-admission contract has no native decline message (unverified as to B1's final shape). If B1 adds none, keep the refusal reason journaled and in the advertised inventory, and file a contract task.

      ### Interfaces
      - **Consumes:** B1's registration and permit types; C1's trait and fake backend.
      - **Produces:**
        - the controller journal and capacity accounting that B5b extends;
        - the `aq-worker run` controller that C2 and C7 plug into, and that E6a and E6b install.

      ### Out of scope
      - Reconciliation, re-adoption, preserve-before-destroy, sweeps, cancellation observation and porting the synthetic tests (B5b).
      - Real backends: docker-local (C2) and boat (C7).
      - The in-sandbox runner (B6a1).
      - Server-side permit issuance (B2).
      - Placement preference (C4).
      - Provider credential leases (C5a2, C6a).

