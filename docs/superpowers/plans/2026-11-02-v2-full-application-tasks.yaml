    spec: [aq-git/docs/specs/0001-aq-git.md]
    description: |
      ### Goal
      Give aq-git authenticated access to GitHub remotes, so the central daemon can fetch from and publish to private and public GitHub repositories.

      ### What to build
      - Named remote credential profiles in aq-git, selected per repository binding: an SSH deploy key, or a fine-grained HTTPS token. Today aq-git rejects named credential profiles, and it runs Git with a blank environment and no credential helper.
