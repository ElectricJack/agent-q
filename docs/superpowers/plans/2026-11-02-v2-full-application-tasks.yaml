  - key: D8
    epic: D
    repo: aq-server
    title: "findings.reconcile, schedules and domain-event triggers"
    type: feature
    class: standard-high
    needs: [D3, D5]
    continues: [AQ-16]
    spec: [aq-playbooks/docs/specs/0001-aq-playbooks.md]
    description: |
      ### Goal
      Implement `findings.reconcile`. Playbook runs then start from durable calendar schedules, from confirmed domain events and from keyed manual admission, each deduplicated and bounded per namespace.

      ### What to build
      - `findings.reconcile`. AQ is the sole owner of finding episodes (spec §6 "Findings and complete observations"):
        - Inputs: a scope/partition, observation and evaluation references, bounded finding keys and evidence, expected episode revisions, and a reminder policy.
        - An episode can become present, stay present without another alert, emit a scheduled reminder, or clear.
        - Clearing requires host-verified complete coverage and the original expected revision. A caller's `complete:true` is not enough, and a stale clear is a conflict.
        - Episode changes and notification intents commit atomically in AQ's store and go through the existing notifications owner. Retries keep observation and notification identity, so there is one logical message.
        - Add episode revisions to the `health_observations` view of `context.read`.
      - Calendar schedules: a host scheduler adapter that owns:
        - timezone and DST interpretation;
        - schedule revision;
        - the local-date occurrence ID;
        - the misfire policy (`skip`, `coalesce once` or bounded catch-up).

        Store the cursor and outgoing occurrences atomically before delivery. A restart never double-fires.
      - Domain-event triggers: consume D3's confirmed-event stream.
        - Event identity is `(producer, event_id)`. A duplicate returns the original disposition; reuse with different content is a conflict.
        - The root run key is event ID + destination activation + rule.
        - "No matching subscription" is recorded against the catalog revision.
      - Manual admission: keep the existing keyed path (`Request::AdmitOnce`, `POST /api/playbooks/admissions`).
      - Bound admissions per namespace, with retryable typed refusals and no dropped work.

      ### Current state
      - No findings tables or adapter exist.
      - The engine supports `Event`, `Fanout`, `AdmitOnce` and `Tick` (`crates/aq-playbook-host/src/lib.rs:109-170`).
      - The daemon routes are `/api/playbooks/admissions`, `/drive` and `/recover` (`crates/aq-server/src/playbooks/api.rs:41-57`). The event outbox is `playbook_outbox` (`playbooks/service.rs:854-930`).
      - Notifications are in `crates/aq-server/src/notifications/`.
      - Model helper for fixed intervals: `aq-playbooks` 0002 ("Artifact and language").

      ### Interfaces
      Consumes:
      - D5's framework;
      - D3's event stream;
      - D4's event names.

      Produces:
      - the registered `findings.reconcile`;
      - a schedule registry with occurrence events;
      - trigger admission.

      D9 (activation), D11 (watcher and report pilots) and F6 use these.

      ### Out of scope
      - Notification policy and the Discord transport: F4.
      - Escalation and digest policy: F6 (deferred).
      - Install and activation API: D9.
      - Stall detection: H3.
      - Pilot playbooks: D11.

      ### References
      - `aq-playbooks/docs/specs/0001-aq-playbooks.md` §6 ("Findings and complete observations"), §9, §10 (last three paragraphs)
      - `aq-server/docs/implementation/AQ-12-through-17-plan.md` (findings.reconcile row, AQ16 stage)
    acceptance:
      - "Test `domain_event_trigger_admits_once` passes."
      - "Test `schedule_survives_restart_without_double_fire` passes."
    deliverables:
