        - central aq-git retention state;
        - the configuration vault;
        - the deployment configuration and secrets inventory.

        Record the encryption, destination, schedule and retention. Use consistent dumps, either in maintenance mode or with documented isolation.
      - **Credential-recovery decision** (infrastructure spec: "Credentials or encryption keys needed for recovery require a separately documented recovery procedure"). Decide where the backup encryption key, tunnel token, Access tokens and provider vault secrets come from on restore. Ask the owner through `aq question`. Restore must account for credentials revoked since the backup: revoke and re-enroll workers when that history can't be trusted.
