    title: "MS3 gate: daily driver"
    type: operator
    class: standard-high
    verification: human
    needs: [MS2, C7, D2, D4, D5, D6, D7, D8, D9, F1a, F1b, F2, F3, F4, F5, F7, G1a, G1b, G2, G3, G4, G5, G6, G7, G8, I1]
    continues: [GATE-05]
    spec: [aq-server/docs/superpowers/plans/2026-11-02-v2-full-application-plan.md]
    description: |
      ### Goal
      Show the owner that v2 replaces the v1 daily loop: supervisor-planned work, agents under the coding policy, questions, notifications and feedback-driven rework, from both the dashboard and `aqv2`. This is a human-verified gate. Its agent runs and records the scenario; it does not implement features.

      ### What to build
      Run on the hosted VPS stack with the desktop and cloud workers. Use one repository onboarded through D2 (owner API or CLI, central GitHub credential).
      1. **Supervisor plans and enqueues.** From the dashboard supervisor panel (G8), and once from `aqv2` (F7), the owner asks the supervisor (F1a/F1b) to plan a small feature graph. The supervisor enqueues it through F2's typed commands.
         - Evidence: the conversation transcript, created task IDs and dependency edges, operation receipts.
      2. **Agents work under the coding policy.** D9's default playbook runs: implement, check (D6 `check.request`), review by a different model family, publish (D7), complete.
         - Evidence: playbook run IDs, check results, the review verdict, publication receipts, graph completions.
      3. **The owner answers an agent question.** An agent asks with `aq-agent question ask` (F5). The owner answers in the dashboard decision inbox, and the answer resumes the waiting attempt (H4 wait).
         - Evidence: the question and decision IDs, and delivery to the agent.
      4. **Discord notifications** (F4) arrive for at least decision or question needed and task failed or blocked.
         - Evidence: delivery receipts and per-episode deduplication.
      5. **Review and feedback.** The owner reviews results (G6/G7), comments, and creates a feedback task that drives a rework attempt.
         - Evidence: the comment thread, the feedback task linked to its result, the rework attempt.
      6. **boat:** at least one attempt runs on the boat backend (C7).
         - Evidence: the sandbox ID with the node prefix, auto-stop set to the hard deadline, deletion confirmed, a sweep showing zero orphans.
      7. **Claude Code** (I1) completes one task end to end.

      Then:
      - Write a rerunnable demo script under `scripts/` for the scriptable steps, and a written procedure for the owner-interactive steps (1, 3, 5).
      - Write `docs/implementation/MS3.md` with steps, IDs, screenshots or captures, commits and limits. Then request owner verification.

