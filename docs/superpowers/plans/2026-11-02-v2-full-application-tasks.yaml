  - key: B6a2
    epic: B
    repo: aq-worker
    title: 'Runner permit authentication on every runner route'
    type: feature
    class: standard-high
    needs: [B1, B6a1]
    continues: [WRK-18]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md]
    description: |
      ### Goal
      `sandbox-run` authenticates every server request with its delegated permit and never acts outside the permit's scope.

      ### What to build
      - Read the permit from a configured runner-private file. B5a delivers the file; B6b sets its permissions.
      - `sandbox-run` needs no node credential (`WorkerConfig.credential`), because node credentials never enter a sandbox (SBX17).
      - Send the permit on every runner route. These are the same routes B2 enforces:
        - material: `/v1/worker/profiled/material`;
        - Prepared: `/v1/worker/profiled-v2/prepare`;
        - Started: `/v1/worker/profiled-v2/started`;
        - renewal: `/v1/worker/profiled/renew`;
        - observations: `/v1/worker/observations/batch`;
        - terminal: `/v1/terminal-relay/*`;
        - artifacts: `/v1/worker/profiled/artifact` and `/v1/worker/profiled/source/{attempt}/{member}`;
        - results and stopped;
        - mail: `/v2/worker/messages/{poll,ack}`.
      - **Scope** (0005 §4 steps 3–5):
        - Preparation scope: material fetch, source download and Prepared receipts.
        - Execution scope, only after the grant: Started, renewal, observations, terminal and results.
      - **Refuse locally before sending** when:
        - the request is for another attempt;
        - the permit is past its hard deadline;
        - the boot is wrong;
        - execution scope would be used before the grant.
      - **Server refusals:**
        - A server refusal counts as authority loss and triggers B6a1's stop-and-preserve.
        - The renewal reply "awaiting node re-adoption" extends nothing. Keep renewing until the deadline, then stop and preserve.
      - Use B1's published fixtures. Test `runner_authenticates_with_delegated_permit_and_refuses_foreign_scope`.

      ### Current state
      - The runner HTTP clients send the node credential, plus `cf-access-client-id` and `cf-access-client-secret` headers:
        - `crates/aq-worker/src/native/http.rs` (`NativeClient::from_config(worker)`);
        - `transfer_client.rs:77`;
        - `execution_client.rs:26-27`;
        - the `aq-terminal-bridge` crate's `src/http.rs`.
      - B1's permit types and fixtures are a prerequisite.

      ### Interfaces
      - **Consumes:** B1's permit schema and fixtures; B6a1's `sandbox-run`.
      - **Produces:** a permit-authenticated runner client, used by B6c, B7 and F3.

      ### Out of scope
      - Server-side enforcement (B2).
      - Runner and agent file permissions, and Access-header injection (B6b).
      - Lease-to-permit binding (C5a2).
      - Mailbox delivery semantics (F3).

      ### References
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §4 steps 3–5, §4.1, §6, §7
    acceptance:
      - Test `runner_authenticates_with_delegated_permit_and_refuses_foreign_scope` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace runner_authenticates_with_delegated_permit_and_refuses_foreign_scope}
  - key: B6b
    epic: B
    repo: aq-worker
    title: Runner OS users and loopback proxies (Responses; AQ API with Access header)
    type: feature
    class: standard-high
    needs: [B6a1]
    continues: [WRK-17]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Inside each sandbox, run the runner and the agent as separate OS users, and add two loopback proxies, so the agent never holds a provider API key or the Access token.

      ### What to build
      - **Users** `runner` and `agent`. The `aq-sandbox-os` image (C3a) provides them; tests here must not depend on that image.
        - `sandbox-run` runs as `runner` and launches the harness in tmux as `agent`.
        - The privilege drop uses setgid and setuid, with supplementary groups cleared.
      - **Runner-only files** (owner `runner`, files mode 0600, directories 0700): the permit, provider API keys, the runner Access token, and runner state and journal (SBX7). Test `agent_user_cannot_read_permit_or_proxy_key`.
      - **Responses proxy:** a `127.0.0.1` listener owned by `runner` that holds the provider API key (the existing `aq-responses-transport` pattern). The key never appears in the agent's environment, files or argv.
      - **AQ API proxy:** a `127.0.0.1` listener owned by `runner` that forwards the agent's requests to the server's machine hostname. It:
        - adds `cf-access-client-id` and `cf-access-client-secret` from the runner Access token file;
        - strips any Access headers the client sends;
        - leaves the agent's own AQ credential untouched;
        - never echoes the token in responses or logs.

        Test `aq_proxy_injects_access_header_without_exposing_token`.
      - Only loopback listeners are allowed (W2, SBX7).
      - **Scope limit:** this is not a hostile-code boundary on docker-local (SBX10). Do not go beyond file permissions and the privilege drop: no seccomp and no extra namespaces.

      ### Current state
      - `crates/aq-worker/src/native/adapter/responses_transport.rs:64,80` binds `127.0.0.1:0` in-process, as the same user as the runner.
      - Access headers come from `WorkerConfig.cf_client_id` and `cf_client_secret` (`client.rs:78-82`, `execution_client.rs:26-27`, `transfer_client.rs:77`).
      - There is no OS-user separation code (no setuid in the aq-worker crates).

      ### Interfaces
      - **Consumes:** B6a1's `sandbox-run`.
      - **Produces:**
        - the Responses proxy endpoint, used by C6a;
        - the AQ proxy endpoint, used by B7;
        - the runner-only file layout, used by B6a2, C6a and C6b.

      ### Out of scope
      - Codex model-provider configuration pointing at the proxy, and confinement modes (C6a).
      - Subscription-login install (C6b).
      - The agent AQ credential and the `aq-agent` CLI (B7).
      - Image users (C3a).
      - Creating Access tokens (E5, by hand).

      ### References
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §7 (credential table and rules), §8.3 (API keys), §10 (SBX7, SBX10, SBX17)
    acceptance:
      - Test `agent_user_cannot_read_permit_or_proxy_key` passes.
      - Test `aq_proxy_injects_access_header_without_exposing_token` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace agent_user_cannot_read_permit_or_proxy_key}
      - {id: t2, kind: test, target: cargo test --locked --workspace aq_proxy_injects_access_header_without_exposing_token}
  - key: B6c
    epic: B
    repo: aq-worker
    title: Runner hydration from retention and per-sandbox terminal/observation channels
    type: feature
    class: standard-high
    needs: [B6a2]
    continues: [WRK-14]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md]
    description: |
      ### Goal
      The runner hydrates the attempt workspace from central retention, and opens per-sandbox terminal and observation channels that hold no poll while idle.

      ### What to build
      - **Hydration** (0005 §4 step 4):
        - Always fetch from central retention through the authorized artifact export (`/v1/worker/profiled/source/{attempt}/{member}`), under the permit, into an aq-git worktree using the bundle's pinned aq-git.
        - Never contact the project's Git remote, and keep no remote credentials in the sandbox (SBX17).
        - Verify bytes and digests against the retention descriptors.

        Test `hydrated_workspace_matches_retained_revision`.
      - **Per-sandbox channels** (SBX16): the terminal long poll and observation uploads are held per sandbox. They use B1's channel identity and are permit-authenticated.
      - **Terminal limits** (0003 §5.3):
        - at most one terminal long poll per sandbox;
        - a hold of at most 20 s, answered immediately when work exists;
        - frames of at most 64 KiB.

        Terminal traffic never uses the renewal or cancellation capacity.
      - **Idle:** with no subscriptions and no controller work, no poll is held. Test `idle_sandbox_holds_no_terminal_poll`. The per-node aggregates (4 viewers per session, 32 subscriptions per node, 2 MiB/s per node) are enforced server-side.

      ### Current state
      - Hydration code is `crates/aq-worker/src/native/hydration.rs`, with the source GET in `native/http/source.rs:57`.
      - The terminal bridge is the `aq-terminal-bridge` 0.1.3 crate. Its relay routes are `/v1/terminal-relay/{register,poll,output-poll,upload,control-upload}`.
      - The server refuses a held poll without work. That check is keyed by node plus boot (`aq-server/crates/aq-server/src/terminal/peer.rs:227-255`).
      - The observations route is `/v1/worker/observations/batch` (`aq-server .../observations/api.rs:15`).

      ### Interfaces
      - **Consumes:** B6a2's permit client; B1's channel identity; B2's permit-scoped relay and observation routes.
      - **Produces:** the per-sandbox terminal and observation channels that H1 and H7 deliver over, and the hydration that H5 reuses.

      ### Out of scope
      - Observation readers and the store (H1).
      - Renderer snapshots and the full output path (H7).
      - Server-side route changes (B2).
      - Cold remote fetch (central aq-git).
      - Hibernation (H5).

      ### References
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §4 step 4, §5 (terminal transport per sandbox), SBX16
      - `aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md` §5, §5.3
    acceptance:
      - Test `hydrated_workspace_matches_retained_revision` passes.
      - Test `idle_sandbox_holds_no_terminal_poll` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace hydrated_workspace_matches_retained_revision}
      - {id: t2, kind: test, target: cargo test --locked --workspace idle_sandbox_holds_no_terminal_poll}
  - key: B7
    epic: B
    repo: aq-worker
    title: Scoped AQ access for agents inside sandboxes
    type: feature
    class: standard-high
    needs: [B6b, B2, C3a]
    continues: [WRK-05, AQ-06]
    spec: [aq-worker/docs/specs/0002-execution-and-agent-access.md, aq-server/docs/specs/0002-execution-and-agent-access.md]
    description: |
      ### Goal
      An agent inside a sandbox uses AQ through `aq-agent` with a per-attempt scoped credential: context, graph reads and versioned commands, operations and messages. It reaches AQ only through the runner's loopback AQ proxy.

      ### What to build
      - **Link the client:** add `aq-agent-client` as a dependency of `crates/aq-worker`. Use its provisioning (`src/provision.rs`) to set up the agent user's private state directory and token file.
      - **Credential** (server spec 0002 §4): issued by `/v2/worker/agent-session`.
        - It is bound to the session, attempt and generation, project and workspace scopes, permitted operations and expiry.
        - Its expiry never exceeds the grant.
        - It is not placed in argv, prompts, environment dumps or logs (worker spec 0002 §4).
        - On cancellation, expiry or revocation, stop provisioning it. Server checks remain authoritative.

        Test `agent_credential_expires_with_attempt`.
      - **Endpoint:** the client's endpoint is the B6b AQ proxy. The agent never holds the Access token (0005 §7).
      - **Ship `aq-agent`** (never `aq`) in the `aq-sandbox-runtime` bundle under `/opt/aq`. Its commands:
        - `context`;
        - `graph get|revision|history|search|context|relationships|command`;
        - `operation get`;
        - message `inbox` and `send` over `/v1/agent/messages/{inbox,send,ack,body}`.

        Test `agent_reads_scoped_context_and_writes_versioned_mutation`, with the mutation carrying an expected version.

      ### Current state
      - `crates/aq-agent-client` is a workspace member that builds binary `aq-agent`. Its CLI (`src/main.rs`) has `result`, `context`, `graph` and `operation`, but no message commands.
      - Its client routes are `/v1/agent/{context,graph/read,graph/commands,operations/{id}}`. The node client calls `/v2/worker/agent-session` (`src/node.rs:65`).
      - It is not a dependency of `crates/aq-worker`.
      - On the server:
        - Issuance is node-authenticated (`agent_access.rs:497-535`), with expiry `min(ttl, grant_expires_at_ms)`.
        - Native offers seal the binding (`agent_access/native_binding.rs`).
        - The owner `provision` route refuses non-legacy attempts (`agent_access.rs:419`).
      - No runtime bundle definition exists yet; it comes from C3a. `scripts/package-agent-client.py` builds a local host-target distribution.
      - Undecided: 0005 §4 step 3 has the node deliver the agent credential. Record whether the node or the runner calls issuance. If a permit-authenticated issuance route is needed, file an aq-server task.

      ### Interfaces
      - **Consumes:** B6b's AQ proxy and users; B2's permits; B6a2's client.
      - **Produces:** the `aq-agent` binary in the bundle and the agent token-file binding, used by F3 and H4.

      ### Out of scope
      - Mailbox poll and ack, harness delivery, `message reply` and `delivery_unknown` (F3).
      - Waits (H4).
      - Supervisor credentials (F1b).
      - The base bundle build (C3a).
      - The proxy (B6b).
      - Server permit enforcement (B2).

      ### References
      - `aq-worker/docs/specs/0002-execution-and-agent-access.md` §4, §5
      - `aq-server/docs/specs/0002-execution-and-agent-access.md` §4, §5, §6
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §7
    acceptance:
      - "Test `agent_reads_scoped_context_and_writes_versioned_mutation` passes."
      - "Test `agent_credential_expires_with_attempt` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace agent_reads_scoped_context_and_writes_versioned_mutation}
      - {id: t2, kind: test, target: cargo test --locked --workspace agent_credential_expires_with_attempt}
  - key: C1
    epic: C
    repo: aq-worker
    title: Placement backend trait, journaled lifecycle and conformance suite
    type: feature
    class: deep-high
    needs: []
    continues: []
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]   # §4, §5, §11; SBX1 SBX3 SBX4 SBX5 SBX15
    description: |
      ### Goal
      Define the single Rust trait that every placement backend implements, a deterministic fake backend with fault injection, and a reusable conformance suite. C2, C7 and C8 must later be able to run that suite unchanged.

      ### What to build
      - A new module `aq_worker::backend` (suggested `crates/aq-worker/src/backend/`) with the trait `PlacementBackend` (0005 §5). It covers: create from template digest; deliver private material; start runner; inspect; list owned; stop; archive (optional); resume/fork (optional); destroy with confirmation; capabilities. You choose the Rust shape (0005 §13).
      - **Create** takes the exact template digest from the launch manifest and a deterministic name (node prefix plus attempt id). It labels node, boot and attempt identity where the backend has labels (0005 §4 step 2). This makes "crash before record" recoverable: `list_owned` must find a sandbox the caller never recorded.
      - **Material delivery** uses the backend control channel only: never the template, argv or agent-visible env (§4 step 3).
      - **Stopped-writer proof** (SBX4) is only "destroyed, confirmed" or "stopped with no running processes, confirmed". A timeout, error or unknown state is a typed *unconfirmed* result, and resources stay protected.
      - **Preserve-before-destroy** (SBX5, W14): stop and archive keep the disk. Destroy needs explicit proof that the work is retained or an operator released it (suggested: a `DestroyAuthorization` argument).
      - **Enums:** kind (`docker-local`, `boat`, `cloudflare-containers`); capability (`vm-isolation`, `nested-docker`, `suspend-snapshot`, `persistent-disk-during-attempt`).
      - **Lifecycle types:** records for intent → created(backend id) → stopped/archived → preserved → destroyed. Add a pure decision function from (journal entry, inventory entry, retention state, deadline) to adopt, stop, preserve or destroy. A deadline overrun means stop, never delete.
      - **`FakeBackend`:** in memory and deterministic, with injectable faults: crash after create, destroy failure, stop failure, unknown or foreign sandbox in inventory.
      - **Conformance harness:** generic over the trait, behind the existing `test-support` feature, and called from `crates/aq-worker/tests/backend_conformance.rs` against the fake. Cover the five acceptance cases, plus whatever the fake can express of create, provision, run fixture, hand off and destroy (§11 "Backend conformance").

      ### Current state
      - aq-worker has no backend or sandbox abstraction (verified with grep over `crates/aq-worker/src`). `crates/aq-worker/tests/` has no `backend_conformance.rs`.
      - The synthetic runtime (`crates/aq-worker/src/runtime.rs`, `src/journal.rs`, `STATE_FORMAT = 4`) journals fake attempts. It is not a sandbox model.
      - `crates/aq-worker/Cargo.toml` already defines `[features] test-support`.

      ### Interfaces
      - **Consumes:** nothing.
      - **Produces:** `PlacementBackend`, the kind and capability enums, the lifecycle record and decision types, `FakeBackend` and the conformance harness. Users: B5a, B5b, C2, C7 and C8. The kind and capability strings must match the node-registration advertisement that B1 publishes.

      ### Out of scope
      - Persisting lifecycle records in the controller journal, capacity and offer acceptance: B5a.
      - The reconciliation loop, grace periods, re-adoption, sweep scheduling and porting the synthetic tests: B5b.
      - Real backends: C2 (docker-local), C7 (boat), C8 (Cloudflare).
      - The wire schema for the capability advertisement: B1.
      - The in-sandbox runner (`sandbox-run`): B6a1.

      ### References
      - aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md §4 steps 1–7, §4.1, §5 (trait list), §11 "Backend conformance", §13.
      - aq-worker/docs/specs/0001-worker-framework.md §1 (W8, W14), §8.4.
    acceptance:
      - "The conformance suite runs against the fake backend and covers: create-crash-before-record, unknown sandbox in inventory, destroy failure keeping resources protected, preserve-before-destroy with unretained work, deadline sweep stopping rather than deleting."
    deliverables:
      - {id: tests, kind: test, target: "cargo test --locked -p aq-worker --test backend_conformance"}
    priority: high
  - key: C2
    epic: C
    repo: aq-worker
    title: "`docker-local` backend with a dedicated rootless sandbox daemon"
    type: feature
    class: standard-high
    needs: [C1]
    continues: []
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]   # §5.1, SBX10, §8.3
    description: |
      ### Goal
      Implement `docker-local` on the C1 trait against a dedicated rootless Docker or Podman daemon on WSL2, with a fixed launch policy, and pass the conformance suite against a real daemon.

      ### What to build
      - **`DockerLocalBackend`** implements `PlacementBackend`.
        - It talks only to a configured dedicated sandbox-daemon socket. The choice of rootless Docker or Podman is yours; record it (0005 §13).
        - It refuses to start if the endpoint is the host's main daemon, for example `/var/run/docker.sock` (SBX10, 0005 §5.1).
      - **Launch policy** (0005 §5.1). It is fixed and offers cannot override it:
        - allowlisted template digests only (take a configured digest list; C3b defines the allowlist file);
        - never privileged, with no added capabilities or devices;
        - no host bind mounts except the worker-managed per-attempt volume and declared mount aliases (worker spec §5);
        - CPU, memory and PID limits from the reservation;
        - the default bridge network with outbound access only and no published ports.
      - **Naming and delivery:** label containers with node, boot and attempt identity and use deterministic names (C1). Deliver material through the Docker API (archive upload or exec stdin), never through env or argv.
      - **Stop, preserve, destroy:** stop proof is a container that inspect confirms stopped. Preserve is stopped with the volume kept. Destroy removes container and volume, then confirms both are gone. If the daemon is unreachable, paused or timing out, inventory is unknown, never gone, and no destroy is issued.
      - **Capabilities:** advertise none of `vm-isolation`, `nested-docker` or `suspend-snapshot`. Nested Docker would need an explicitly configured runtime such as Sysbox; don't build it.
      - **Confinement decision:** decide and record whether the daemon permits unprivileged user namespaces for bubblewrap (Codex `native`) or the backend is `container`-only. The design default is `container` (0005 §8.3, decided 2026-11-02); `native` only if qualification shows it is safe.
      - **Tests:**
        - `crates/aq-worker/tests/docker_local_backend.rs` runs the C1 harness against a real daemon in `#[ignore]` tests (socket from env).
        - `wsl_suspend_resume_reconciles_sandboxes` runs without `--ignored`, so it must pass in a plain run. A scripted Docker API double that pauses and resumes is fine there; add a live variant under `--ignored`. After resume, inventory must show the sandbox and its volume, no destroy may have been issued during the pause, and C1's decision function must yield re-adopt or preserve.
      - **WSL2 install notes:** rootless daemon setup, socket path, cgroup v2 delegation for limits, autostart caveats.

      ### Current state
      - aq-worker has no Docker client code and no Dockerfile (verified). The worker image is `aq-server/Dockerfile.worker`.
      - C1 provides the trait, the fake, the decision function and the harness.

      ### Interfaces
      - **Consumes:** C1.
      - **Produces:** `DockerLocalBackend` and its config (socket, allowlist, limits), plus the recorded confinement decision. Users: B5a, B5b, C6a, I4a, E6a and E6b.

      ### Out of scope
      - Controller reconciliation, re-adoption and sweeps: B5b.
      - The allowlist format and template builds: C3b. Images: C3a and C3c.
      - Codex confinement flags: C6a.
      - Worker containerization and autostart: E6a (WSL2) and E6b (VPS).

      ### References
      - 0005 §4 step 7, §5.1, §8.3 "Native sandbox on Linux", §14 "Unprivileged user namespaces", SBX10.
      - Plan "Review Focus" item 1.
    acceptance:
      - "Conformance suite passes against the real daemon in an opt-in test."
      - "Test `wsl_suspend_resume_reconciles_sandboxes` (Review Focus 1) passes: pausing and resuming the daemon mid-attempt leads to re-adoption or preservation, with no lost workspace."
      - "Install notes for WSL2 are written."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace wsl_suspend_resume_reconciles_sandboxes}
      - {id: tests, kind: test, target: "cargo test --locked -p aq-worker --test docker_local_backend -- --ignored"}
  - key: C3a
    epic: C
    repo: aq-worker
    title: aq-sandbox-os base image and aq-sandbox-runtime bundle
    type: feature
    class: standard-high
    needs: [A3a]
    continues: [WRK-10]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Build the two sandbox artifacts that AQ owns, reproducibly and from pinned inputs:
      - the `aq-sandbox-os` base image;
      - the `aq-sandbox-runtime` bundle, which holds everything AQ puts inside a sandbox, under `/opt/aq`.

      ### What to build
      - **`aq-sandbox-os`** (0005 §8.1) contains the OS, Git, tmux, bubblewrap (`bwrap`), CA certificates and two OS users, `runner` and `agent`. Pin the base by digest. Debian bookworm matches the existing images and the bookworm-glibc aq-git build. It is rebuilt for scheduled OS security updates.
      - **`aq-sandbox-runtime`** is a bundle under `/opt/aq`. A template copies it as its final layer (`COPY --from=aq-sandbox-runtime@sha256:… /opt/aq /opt/aq`). It contains:
        - the sandbox runner (the `aq-worker` binary, built `--locked`);
        - aq-git, pinned by digest;
        - the credential (Responses) proxy and the AQ loopback proxy. Today these are in-process in the runner (the `aq-responses-transport` crate). Ship separate binaries only if B6b creates them;
        - every qualified harness CLI at its pinned version. Today that is only Codex CLI `0.166.0` (`CODEX_CLI_VERSION`, `crates/aq-codex-mapper/src/lib.rs:10`). I1–I3 add the other harnesses;
        - a private Node runtime for harnesses that need one, so no harness depends on the project's Node.
      - **Bundle manifest:** a machine-readable file inside the bundle (suggested `/opt/aq/manifest.json`). It lists each harness's name, version and artifact digest, plus the aq-git and runner versions and digests. Templates advertise this list (SBX18). Test `runtime_bundle_lists_pinned_harness_versions` checks it against the pins.
      - **Pins:** keep one file of pinned inputs: base digest, Node version and SHA-256, Codex version and SHA-256, aq-git digest, Rust builder digest. Use no floating tags and verify every checksum.
      - **Layer order:** a harness version bump changes only the bundle layer. Record the layer digests before and after as evidence.
      - **No secrets** in either artifact (P8, SBX9).

      ### Current state
      - aq-worker has no image definitions (verified).
      - `aq-server/Dockerfile.worker` already has pinned stages to copy:
        - the aq-git source build;
        - the Git 2.56.0 build with sha256 checks;
        - `rust:1.96.1-bookworm@sha256:a339861a…`.

        Its `debian:bookworm-slim` final stage is not digest-pinned yet (A4 fixes that).
      - The aq-git pin is `aq-server/vendor/git-candidate.json`: 0.1.0, revision f3660a8, which is missing from aq-git history. A3a releases v0.2.0. Use v0.2.0 if it is published; otherwise pin the current archive and record why.

      ### Interfaces
      - **Consumes:** nothing.
      - **Produces:** the two image definitions, the bundle manifest format and the pins file. Users: C3b, C3c, B7 (adds `aq-agent` to the bundle), I1–I3 (add harnesses) and E4 (manifest pins).

      ### Out of scope
      - Recipe format, assembly, finalize check, credential scan and allowlist: C3b.
      - GHCR publication and the rust and node templates: C3c.
      - Runner privilege drop and proxy behaviour: B6b.
      - The `aq-agent` CLI: B7.
      - Harnesses other than Codex: I1, I2 and I3.

      ### References
      - 0005 §8.1 ("Maintained artifacts" table and the layer-order paragraph), §8.2, SBX9, SBX18.
    acceptance:
      - Test `runtime_bundle_lists_pinned_harness_versions` passes.
      - Rebuilding after a harness version bump changes only the bundle layer (recorded).
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace runtime_bundle_lists_pinned_harness_versions}
    priority: high
  - key: C3b
    epic: C
    repo: aq-worker
    title: Template assembly, recipe format, finalize check, credential scan, allowlist and provenance
    type: feature
    class: standard-high
    needs: [C3a]
    continues: []
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Turn a project toolchain recipe into a sandbox template image that is allowlisted, carries a provenance record and contains no credentials. Refuse any template that fails the finalize check or the credential scan.

      ### What to build
      - **Recipe format.** Recipes are non-secret definitions stored in the configuration vault alongside profiles (0005 §8.2). Fields:
        - name and version;
        - parent: `aq-sandbox-os@sha256:…`, another allowlisted toolchain (for example `rust-node` derived from `rust`), or optionally `codex-universal`;
        - declared toolchain install steps;
        - optional pre-fetched repository objects, allowed only when the target registry is private.

        Bound every field and refuse values shaped like secrets.
      - **Assembly** (0005 §8.1): build the toolchain image, then `COPY --from=aq-sandbox-runtime@sha256:… /opt/aq /opt/aq` as the final layer, then run the fixed finalize step.
      - **Finalize check.** Refuse the build if any of these is missing: the `runner` or `agent` user, `tmux`, `bwrap`, `git`, or the `/opt/aq` bundle manifest. On a `codex-universal` base, finalize adds what `aq-sandbox-os` would have provided. Test: `finalize_refuses_template_missing_tmux_or_users`.
      - **Build CLI** (suggested `aq-worker template build <recipe>`). It drives Docker/BuildKit and emits:
        - the OCI image digest;
        - a provenance record: recipe digest, base digest, runtime-bundle digest, harness versions from the bundle manifest, build time and builder identity (SBX9).

        Builds run on an explicitly configured build node (the desktop is fine), not on attempt capacity.
      - **Credential scan.** Scan every layer of the built image; C7 will reuse the scanner for boat snapshots. Fail on known credential paths, at least:
        - `auth.json` under any `.codex` or `CODEX_HOME`;
        - Claude and Gemini credential files;
        - `.git-credentials`, `.netrc`, `.ssh/id_*`, `.docker/config.json` and cloud CLI configs;
        - provider-key environment variables in the image config.

        Test: `credential_scan_fails_build_with_auth_json`.
      - **Digest allowlist** (SBX9, SBX18; §8.2 "Arbitrary images are not allowed"). A file of entries, each with name, image digest, provenance and advertised harness versions. Only builds that pass finalize and the scan can be added. C7 and C8 later attach per-backend materialization records to an entry (boat snapshot id, Cloudflare image reference).

      ### Current state
      - None of this exists in aq-worker (verified): no recipe, build CLI, scanner or allowlist.
      - C3a provides the base image, the runtime bundle and the bundle manifest.
      - The configuration vault is aq-server's vault directory (`aq-server/vault.example/config.toml`, `format_version = 1`). It has no templates section yet.

      ### Interfaces
      - **Consumes:** C3a's artifacts and bundle manifest.
      - **Produces:** the recipe format, build CLI, provenance record, scanner and allowlist format.
      - **Used by:**
        - C3c, which builds the rust and node templates;
        - C2, which enforces the allowlist;
        - C4, which resolves environments to digests and reads harness versions;
        - C7, which materializes snapshots.

      ### Out of scope
      - GHCR publication and the rust and node recipes: C3c.
      - The server's environment-to-template catalog: C4.
      - Enforcing the allowlist at launch: C2 and C7.
      - boat snapshot materialization: C7.

      ### References
      - 0005 §7 (last rule: template scan), §8.1, §8.2, §14 (`codex-universal`), SBX9, SBX18.
    acceptance:
      - Test `finalize_refuses_template_missing_tmux_or_users` passes.
      - Test `credential_scan_fails_build_with_auth_json` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace finalize_refuses_template_missing_tmux_or_users}
      - {id: t2, kind: test, target: cargo test --locked --workspace credential_scan_fails_build_with_auth_json}
