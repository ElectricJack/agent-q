  - key: D1a
    epic: D
    repo: aq-server
    title: Candidate creation and conditional publication through aq-git with durable intents
    type: feature
    class: deep-high
    review: adversarial
    needs: [A3b]
    continues: [AQ-15, AQ-09]
    spec: [aq-git/docs/specs/0001-aq-git.md, aq-git/docs/aq-integration.md]
    description: |
      ### Goal
      The central daemon turns retained attempt source into a frozen aq-git candidate and conditionally publishes it. Every aq-git call is backed by a durable AQ intent and an immutable receipt, so a retry never publishes twice.

      ### What to build
      - A typed aq-server client for aq-git protocol v1 over the central socket: `candidate.create`, `candidate.show`, `publish` and `operation.show`. The protocol is one JSON request per line with `protocol_version:1`, `request_id`, `operation_id`, `repository_id` and `expected_binding_generation`. Requests are capped at 1 MiB and responses at 8 MiB. Reuse the configured `source_retention.git_socket`.
      - `candidate.create` params: `{base, sources:[{oid,retention_handle}], commit:{name,email,message}, merge_profile:"git-ort-v1"}`, with at most 64 ordered sources. The candidate ID equals the creation operation ID. Build sources only from server-owned retained-source records (receipt OID and `retention_handle`), never from worker-supplied values (aq-integration whitelist rule).
      - Store both kinds of result as receipts:
        - `ready`: candidate, `clean_prefix`, `retention_handle`;
        - `conflicted`: null candidate, `conflict_step`, bounded hex-encoded paths.
      - `publish` params: `{candidate_id, target, expected_old}`.
        - `target` is a full `refs/heads/…` ref in the aq-git binding's `allowed_targets`.
        - `expected_old` is an explicit typed OID.
        - Record the outcome: `applied`, `already_present` (observed presence only, no claim that this call caused it), `rejected`, or the error `operation_indeterminate`.
      - Durable intents (aq-git §10.1, §11.1):
        - Commit an AQ intent row before each socket call: operation UUID, canonical payload digest, repository ID, binding generation and inputs.
        - Persist the exact aq-git response as an immutable receipt.
        - Retries reuse the same operation UUID and payload; a changed payload is `idempotency_conflict`.
        - An indeterminate publish is recorded and blocks that destination. Never re-push.
      - Git remote credentials stay central (SBX17). Publication runs only through the central aq-git. Workers and sandboxes never see remote URLs or credentials.
      - Add new migration(s) at the next free number; the latest today is `0041`.

      ### Current state
      - aq-server calls aq-git only for:
        - `artifact.import`: `crates/aq-server/src/source_retention.rs:544` (`socket_import`);
        - `artifact.export`: `source_retention.rs:867`;
        - fixture `repo.register`: `source_retention/profiled_base.rs:943`.
      - No candidate or publish code exists.
      - `SourceRetentionConfig` (`source_retention.rs:51`) holds `git_root` and `git_socket`. `RecordedSourceConfirmation` and `load_confirmed_locked` (`source_retention.rs:1057`, `:1064`) give retained receipts (`receipt_id`, source OID, `retention_handle`).
      - aq-git publish preconditions: `aq-git-core/src/publication.rs:282-330`. Test with a local bare remote and `allow_file_transport:true`, as in `aq-git-core/tests/publication.rs:82`.

      ### Interfaces
      Consumes:
      - A3b's pinned aq-git 0.2.0;
      - source-retention receipts.

      Produces:
      - a central delivery service (create candidate, publish, look up an operation by ID) with typed results and stored receipts;
      - D1b adds policy and reconciliation on top of it;
      - D7 wraps it as playbook commands.

      ### Out of scope
      - Per-project policy (PR or fast-forward, waiting for checks), `operation.reconcile`, `operation.resolve` and `recovery clear-fence`: D1b.
      - Repository onboarding and GitHub credentials: D2.
      - `candidate.prepare`/`candidate.publish` adapters: D7.
      - Deciding when a result triggers delivery: D3 (default policy) and D9.
      - Changes to aq-git itself, or re-pinning it: A3b.

      ### References
      - `aq-git/docs/specs/0001-aq-git.md` §9.2, §10.1, §10.2, §11.1
      - `aq-git/docs/api.md`: operation table, "Candidate IDs…" and "Publication outcomes…" paragraphs
      - `aq-git/docs/aq-integration.md`: candidate.create and publish whitelist paragraphs
    acceptance:
      - Test `candidate_from_retained_source_publishes_once` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace candidate_from_retained_source_publishes_once}
    integration: pull_request
  - key: D1b
    epic: D
    repo: aq-server
    title: Per-project publication policy and ambiguous-publication reconciliation
    type: feature
    class: standard-high
    needs: [D1a, D0]
    continues: [AQ-15]
    spec: [aq-git/docs/specs/0001-aq-git.md]
    description: |
      ### Goal
      Each project declares how a candidate is delivered. Ambiguous publication outcomes are reconciled explicitly through aq-git, never retried blindly.

      ### What to build
      - A per-project publication policy, revisioned with the project record: expected-revision CAS, immutable history and receipts, as for other project fields (spec 0003). Fields:
        - mode `pull_request` (push a branch and open a PR) or `fast_forward` (fast-forward the default branch);
        - optional `wait_for_checks`;
        - the target branch, which must be in the aq-git binding's `allowed_targets`.
      - Opening a PR and waiting for checks go through a GitHub adapter trait, with a fake in tests.
      - Ambiguity handling (aq-git §10.3):
        - After `operation_indeterminate`, or a dispatched operation without an acknowledgement, keep the destination blocked.
        - Call `operation.reconcile` under a NEW command operation UUID, with `{target_operation_id, expected_generation}`. Take the generation from `operation.show`.
        - `already_present` is recorded as observed presence; never fabricate `applied`. Any other observation keeps the ambiguity.
        - Never resend because of a timeout, or because the old ref looks unchanged.
      - `operation.resolve` is only an explicit, audited owner action. Params: `{target_operation_id, expected_generation, disposition:"abandon"|"permit_new_operation", reason, old_publishers_stopped:true, evidence}`. Any later publication gets a new operation ID and a fresh `expected_old`.
      - `recovery_blocked` (the fence left by a guard crash) is surfaced as a typed state. Clearing it uses the direct-only `recovery clear-fence` with `{expected_incarnation, reason, evidence, old_environment_stopped:true}`. An operator does this after stopping the old aq-git; it is never automatic and never resolves a push.
      - Map `target_moved`, `rejected` and `conflicted` to a typed publication refusal that carries the reason and observed OIDs.
      - Opening a PR and pushing a new branch to GitHub use the authenticated remotes from D0.

      ### Current state
      - `ProjectBinding` (`crates/aq-server/src/project_bindings/domain.rs:49`) has no publication field. Project routes are at `project_bindings.rs:47-51`.
      - aq-git publishes only to existing, allowed `refs/heads/` targets (`aq-git-core/src/publication.rs:292`), and `expected_old` must be an existing commit. aq-git 0.2.0 therefore cannot create the PR branch.
      - aq-git credential profiles are disabled (`aq-git-core/src/repository/mod.rs:154`).

      ### Interfaces
      Consumes: D1a's client, intents and receipts.

      Produces:
      - a publication policy type on the project record;
      - reconcile and resolve operations;
      - a typed `PublicationRefusal`;
      - the delivery entry point that D3's default completion policy calls and D7 wraps.

      ### Out of scope
      - GitHub credentials in the vault and repository onboarding: D2. Tests use local bare remotes and a fake GitHub.
      - Playbook adapters: D7.
      - Branch creation in aq-git: file an emergent aq-git task if PR mode needs it. Until then, PR mode refuses explicitly; it never degrades to fast-forward.
      - Dashboard and CLI surfaces: G-series and F7.

      ### References
      - `aq-git/docs/specs/0001-aq-git.md` §10.1, §10.3, §11.2
      - `aq-git/docs/api.md`: operation.reconcile/resolve rows and the `recovery clear-fence` paragraph
      - `aq-server/docs/specs/0003-project-execution-bindings.md` (CAS and history rules)
    acceptance:
      - Test `ambiguous_push_reconciles_without_double_publish` passes.
      - Test `publication_conflict_reports_typed_refusal` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace ambiguous_push_reconciles_without_double_publish}
      - {id: t2, kind: test, target: cargo test --locked --workspace publication_conflict_reports_typed_refusal}
  - key: D2
    epic: D
    repo: aq-server
    title: Repository onboarding and central Git remote credentials
    type: feature
    class: standard-high
    needs: [D1b, D0]
    continues: [AQ-19]
    spec: [aq-server/docs/specs/0003-project-execution-bindings.md]
    description: |
      ### Goal
      The owner can onboard a GitHub repository in one operation. The operation creates the central aq-git binding with a retained base, the AQ project binding, the default branch and the publication policy. GitHub credentials are held centrally.

      ### What to build
      - An owner API operation to onboard a repository. It takes an idempotent `operation_id` and:
        1. registers a central aq-git binding through `repo.register`, with `{identity, mode:"central", remote_url, allowed_refs, allowed_targets}`;
        2. runs `repo.sync` on the default branch, so its head is retained centrally;
        3. selects the default branch from the GitHub repository metadata or an owner override;
        4. creates the project via `POST /api/projects/{id}` with `{operation_id, expected_revision:0, binding}`;
        5. sets D1b's publication policy.

        Partial failure leaves explicit state that can be resumed; nothing is silently half-created.
      - A CLI command over the same operation. It must not be installed as `aq` or `agent-queue`.
      - GitHub credentials are held centrally as a deploy key (SSH) or a fine-grained token (HTTPS) in the vault. They never enter sandboxes (SBX17), logs or the binding JSON. aq-git refuses embedded HTTPS credentials.
      - Profile fit: aq-git supports SHA-1 only, with complete history. It refuses `.gitattributes`, gitlinks/submodules, LFS-managed checkout, shallow or partial history, and required signing.
        - Refuse others with a typed reason, either from aq-git's `unsupported_feature` or from a pre-check.
        - Document which repository shapes fit, pending J7's decision.
      - Spec 0003 constraints that still apply:
        - bindings name `aq.git.configured` and `aq.graph.configured`;
        - callers cannot supply endpoints, tokens or arbitrary commands;
        - admin requests are capped at 128 KiB.
      - GitHub credentials for clone, fetch and push use D0's aq-git credential profiles; this task stores and selects them per project.

      ### Current state
      - Project routes are at `crates/aq-server/src/project_bindings.rs:47-51`. `ProjectBinding` is at `project_bindings/domain.rs:49`, and repository verification calls `repo.show` (`project_bindings/external.rs:126`).
      - Spec 0003 explicitly left "clone/init/GitHub onboarding" out.
      - Known gap: aq-git rejects `credential_profile` with "Named credential profiles are not enabled" (`aq-git-core/src/repository/mod.rs:154`). It runs Git with `env_clear`, `HOME=/nonexistent` and an empty `credential.helper` (`aq-git-core/src/git/environment.rs`). Authenticated GitHub fetch and push therefore need an aq-git credential-profile capability first. File an emergent aq-git task for it, and refuse with a typed reason until it exists.

      ### Interfaces
      Consumes:
      - D1a's aq-git client;
      - D1b's publication policy;
      - existing project-binding routes.

      Produces:
      - the onboarding operation and its receipt;
      - a vault credential reference by name;
      - the documented profile-fit list.

      F7 (`aqv2 projects` and onboarding) calls the same operation.

      ### Out of scope
      - Widening the supported repository profile: J7.
      - aq-git credential-profile implementation: an emergent aq-git task.
      - Publication policy semantics and reconciliation: D1b.
      - The general `aqv2` CLI: F7.
      - Dashboard onboarding UI: G-series.

      ### References
      - `aq-server/docs/specs/0003-project-execution-bindings.md` (whole spec, 114 lines)
      - `aq-git/docs/specs/0001-aq-git.md` §5, §5.1, §5.2
      - `aq-git/README.md`, line 33 (profile restrictions)
    acceptance:
      - "Test `onboard_github_repo_creates_binding_and_retained_base` passes."
      - "Test `unsupported_repo_profile_refused_with_reason` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace onboard_github_repo_creates_binding_and_retained_base}
      - {id: t2, kind: test, target: cargo test --locked --workspace unsupported_repo_profile_refused_with_reason}
  - key: D3
    epic: D
    repo: aq-server
    title: Automatic result settlement and the confirmed-event outbox consumer
    type: feature
    class: deep-high
    review: adversarial
    needs: [B3, I0]
    continues: [AQ-10, AQ-07, AQ-28]
    spec: [aq-server/docs/specs/0002-execution-and-agent-access.md, aq-server/docs/architecture/0002-execution-and-recovery.md]
    description: |
      ### Goal
      When a result arrives, settlement runs automatically. Under a default completion policy, the graph task is completed only when the evidence really supports it. Confirmed graph events reach the embedded playbook host exactly once.

      ### What to build
      - Trigger settlement evaluation automatically after the worker's result is recorded (`POST /v1/worker/profiled/results`, `results::record`), under a policy actor rather than an owner request. The owner route stays for lookup and reconciliation.
      - Default completion policy, used until D9. Complete only when all of these hold, in this order:
        1. the result is accepted: current report head, matching stop proof, not cancelled first (X6/X7 ordering);
        2. required checks pass, by server-owned check evidence bound to the exact retained source. An agent's claim is never evidence. D3 does not run checks; D6 adds `check.request`. Missing evidence means not complete;
        3. source is retained, by the central aq-git import receipt;
        4. the change is published, when the task requires delivery. Read this through the delivery seam that D1a/D1b provide. A task that requires delivery but is unpublished holds;
        5. then a version-checked graph completion: expected version and a stable operation ID. A version conflict re-evaluates; it never overwrites (spec 0002 §7).
      - On refusal, do not complete the task and do not release dependents. Mark it for rework with the evidence and the reason (Review Focus 5).
      - An outbox consumer for `agent_graph_outbox`:
        - Read `delivered=false` rows in bounded pages and deliver each one to the embedded host as a typed event.
        - Use a stable producer identity and epoch, and `event_id` as the event ID.
        - Set `delivered` only after durable engine acceptance.
        - Deduplicate by event ID, and replay after a crash (spec 0002 §6, §9 "Real outbox replay to a deduplicating playbook host").

      ### Current state
      - Settlement runs only from owner-only `POST /api/settlement/evaluations` (`crates/aq-server/src/reviews/combined_http.rs:73`) via `settlement::Service::evaluate` (`profiled_execution/settlement/owner.rs:189`). `EvaluateRequest` requires a human `decision_id` (`owner.rs:47`). Completion: `settlement/completion.rs`.
      - `evaluate_pilot` (`settlement/eligibility.rs:260`) supports only the policy `source_change_reviewed_human_owner_no_checks_v1`. It refuses non-empty `required_checks` with `RequiredChecksUnsupported`.
      - The outbox table is defined in `migrations/0007_graph_mutations.sql:24`. Rows are written at `agent_access/mutations/dispatch.rs:384`, with kind `graph.operation_confirmed`, and nothing reads them.
      - Host event ingestion uses `playbook_outbox` (`playbooks/service.rs:566`, `:854`, `:896`). The only registered event is `aq.operation.updated`; D4 reconciles names.

      ### Interfaces
      Consumes:
      - B3's cancellation ordering;
      - the native result path that I0 exercises.

      Produces:
      - an automatic settlement pipeline with a pluggable completion policy (D9 replaces the default);
      - check-evidence and delivery seams (D6, D1b/D7);
      - a confirmed-event stream into the host, consumed by D5 and D8 triggers.

      ### Out of scope
      - Check execution: D6.
      - Candidate creation and publication: D1a/D1b.
      - Replacement attempts and retry budgets: B4.
      - Playbook-driven policy: D9.
      - Event-triggered run admission: D8.
      - Notifications: F4.

      ### References
      - `aq-server/docs/specs/0002-execution-and-agent-access.md` §6 (delivery rules), §7, §9 (test table)
      - `aq-server/docs/architecture/0002-execution-and-recovery.md` §6, §7, §9 (X6, X7, X8, X10)
      - `aq-server/docs/implementation/AQ-10-pilot-settlement-owner39.md`
    acceptance:
      - "Test `false_pass_result_does_not_complete_task` (Review Focus 5) passes: a result claiming success with failing checks or unpublished required delivery does not complete the graph task, and the task is marked for rework with the evidence."
      - "Test `accepted_result_completes_task_with_expected_version` passes."
      - "Test `outbox_replay_delivers_each_event_once` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace false_pass_result_does_not_complete_task}
      - {id: t2, kind: test, target: cargo test --locked --workspace accepted_result_completes_task_with_expected_version}
      - {id: t3, kind: test, target: cargo test --locked --workspace outbox_replay_delivers_each_event_once}
    integration: pull_request
  - key: D4
    epic: D
    repo: aq-playbooks
    title: Reconcile the synthetic and production host catalogs
    type: refactor
    class: standard-high
    needs: []
    continues: [PB-01, AQ-12]
    spec: [aq-playbooks/docs/specs/0001-aq-playbooks.md, aq-playbooks/docs/aq-host-integration.md]
    description: |
      ### Goal
      aq-playbooks publishes one versioned AQ host catalog contract. The synthetic pilots and the daemon's production host both bind to it, so pilot passes mean something for production.

      ### What to build
      Reconcile the four known differences:
      - **Recovery classes.**
        - Synthetic: 9 commands are `KeyedIdempotent` (work.ensure, work.change, judgment.request, decision.request, check.request, candidate.prepare, message.send, findings.reconcile, operation.cancel), 2 are `Observation` (context.read, operation.get), and candidate.publish is `Reconcilable`.
        - The daemon accepts only `Reconcilable`.
        - Choose one class per command in the contract, following spec §11 (observation, keyed or naturally idempotent, reconcilable, unsafe).
      - **Outcome words.** message.send is `queued` in the daemon and `accepted` in the synthetic catalog. Settle every command's outcome names, so admission responses stay distinct from business results.
      - **decision.request.** The daemon's version is asynchronous: it returns a handle, completes by event, and reconciles via `operation.get`. The synthetic version is synchronous (approved/rejected/expired). Pick one.
      - **Event names.** The daemon uses `aq.operation.updated` from `aq.host.bridge@1`; the synthetic catalog uses `work.changed`, `artifact.recorded`, `operation.changed`, `check.completed`, `decision.resolved`, `integration.changed` and `signal.reported`. Document the final names, producers, schemas and correlation fields.

      Constraints for the contract:
      - Keep exactly the twelve commands (P19).
      - Keep the finite context views (work, project, execution_options, evidence, health_observations), the work kinds (9) and the work.change variants (6), or deliberately revise them.
      - At most 12 commands, at most 16 events and a 262,144-byte registry (daemon bounds).
      - A semantic version and fingerprint.
      - Publish it as a buildable artifact (crate or schema plus fixtures) that aq-server can vendor by exact revision. No sibling path dependencies.

      Update `aq-playbooks-cli`'s catalog, fake host and the four pilots (coding, routing, watcher, report) to the contract. Add `pilots_pass_on_reconciled_catalog`.

      ### Current state
      - The synthetic catalog is in `crates/aq-playbooks-cli/src/catalog.rs:162-300`. The fake host is `src/fake_host.rs` and the pilots are `src/pilots.rs` (`NAMES` at line 11). Existing tests are in `tests/host_pilots.rs`, including `every_pilot_uses_the_same_twelve_captured_host_contracts`.
      - The daemon's checks are in `aq-server/crates/aq-playbook-host/src/lib.rs:735-760` (`validate_registry`), with contracts in `aq-server/crates/aq-server/src/playbooks/domain.rs` and `review_domain.rs`.
      - aq-server vendors playbooks revision `0173673` (aq-playbook-host `Cargo.toml`).

      ### Interfaces
      Produces: the versioned host catalog contract and its fingerprint, plus the documented event names. D5 pins it in aq-server and relaxes `validate_registry` accordingly. D3's outbox event mapping and D8's triggers use its event names.

      ### Out of scope
      - Any aq-server edit, including the pin and changes to `validate_registry`: D5. Record it as a follow-up there.
      - Implementing the adapters: D5–D8.
      - Persistence performance: D10.
      - Editing `docs/specs/*`: file a docs task. Document event names in `docs/aq-host-integration.md` or the contract crate.

      ### References
      - `aq-playbooks/docs/specs/0001-aq-playbooks.md` §6 (Command registration, Event registration, Initial AQ host API), §9, §11
      - `aq-playbooks/docs/aq-host-integration.md` ("Host responsibilities")
      - `aq-playbooks/docs/specs/0002-implementation.md` ("Administration and host integration")
    acceptance:
