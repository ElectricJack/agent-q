    spec: [aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md]   # S3
    description: |
      ### Goal
      Real attempts produce trustworthy usage and cost accounting. Sources are registered from production attempts, observations feed the ledger, costs come from a versioned rate card, and lineage usage counts against the shared task budgets.

      ### What to build
      - Register observation sources from the production attempt path, at grant or Started, by calling the existing `observations::register_source`. Supply source policy, account namespace and parser priority from a trusted central catalog, never from the worker.
      - Feed H1's batches through the existing batch route into the ledger.
      - Pricing reference: a versioned rate card artifact (`aq_accounting::RateCard`: reference, allocation policy, currency, provider, model, layout, per-category microunits per million tokens). It supports corrections that create a new revision, never a second bill for the same call.
      - Every cost is one of three kinds, which the reader must be able to tell apart (S3):
        - `ProviderReported`;
        - `NonInvoiceEstimate` (basis `TokenRates`, `SubscriptionAllocation` or `LocalModelAllocation`);
        - `Unknown`.
      - Keep reported zero distinct from unknown.
      - Flat subscriptions (subscription-login credentials) record their token usage, but cost is labelled as a subscription basis or unknown, never as a token-rate charge.
      - Lineage budgets: connect lineage aggregates to B4's shared task retry and spend budgets. Retry and wake sessions never reset or recount usage. Soft ceilings emit policy events. A hard ceiling is refused unless the harness can enforce it (0004 §2.2).
      - Expose the result through the existing usage read (`GET /api/observations/sessions/{attempt}/usage`).

