  - key: F3
    epic: F
    repo: aq-worker
    title: Agent messaging end to end in sandboxes
    type: feature
    class: standard-high
    needs: [B7]
    continues: [WRK-09, AQ-11]
    spec: [aq-server/docs/operations/messaging.md, aq-server/docs/architecture/0002-execution-and-recovery.md]   # X13
    description: |
      ### Goal
      Agents inside sandboxes can receive and send AQ messages. The runner fetches the attempt's mail under its permit and delivers each message exactly once at a safe boundary or to the agent inbox. The agent can read, send and reply with `aq-agent message ...`.

      ### What to build
      - Runner mail loop:
        - Poll the attempt mailbox under the delegated permit (`POST /v2/worker/messages/poll`, at most 16 envelopes per response).
        - Journal and deduplicate each delivery ID before any harness effect. Repeated polls may replay `pending` or `received_by_node` envelopes.
        - Acknowledge with `POST /v2/worker/messages/ack`, using exactly one of `received_by_node`, `handed_to_harness`, `delivery_unknown` or `stale`.
      - Delivery mode follows the profile and adapter declaration: native injection at a safe prompt boundary, or the agent's AQ inbox. Never inject arbitrary keystrokes and never press Enter at an unknown prompt (0003 §4, X13).
      - Uncertain injection stays `delivery_unknown` and is never retried automatically. Stopped or suspending attempts reject new input.
      - Exactly-once across a runner restart: the journal decides what was handed off. A replayed envelope causes no second effect.
      - Agent CLI subcommands in aq-worker's `aq-agent` client:
        - `message inbox`, `message send` and `message reply`;
        - body chunk retrieval through `/v1/agent/messages/body`;
        - ack through `/v1/agent/messages/ack`.
        - Limits: bodies 1–16,384 UTF-8 bytes; inbox pages hold at most 32 messages.
      - A reply goes to the original sender's mailbox. When the sender is the global supervisor, it lands in the supervisor conversation mailbox.

      ### Current state
      - Server routes exist for node mail (`/v2/worker/messages/poll`, `/v2/worker/messages/ack`) and agent mail (`/v1/agent/messages/send|inbox|body|ack`), documented in aq-server/docs/operations/messaging.md.
      - aq-worker has no mail poll client (grep finds none). `aq-agent` (`crates/aq-agent-client/src/main.rs:24`) has only result, context, graph and operation subcommands.
      - Gap: the server's `Recipient` enum (`aq-server/crates/aq-server/src/agent_access/messaging.rs:8`) has only `task` and `session`. There is no supervisor recipient. If it is still missing when you start, add it as an additive agent-access v1 contract change (schema and fixtures in `aq-server/protocol/agent-access/v1`) and pin it in aq-worker.
      - No execution-profile field for delivery mode was found (unverified). The current Codex exec path has input disabled, so expect inbox mode for Codex.

      ### Interfaces
      Consumes:
      - B7's `aq-agent` binary, scoped agent credential and AQ loopback proxy.
      - B2's permit scope on mail routes.
      - B6a1's guardian and tmux host.

      Produces:
      - The runner delivery path and journal.
      - The `aq-agent message` subcommands.
      - The safe-boundary delivery hook that H3 uses for nudges.

      ### Out of scope
      - Supervisor dispatch and reply: F1b.
      - Agent questions (`aq-agent question ask`): F5.
      - Nudge policy and the stall ladder: H3.
      - Notifications: F4.
      - Waits on messages: H4.
      - Observation and terminal channels: H1 and H7.

      ### References
      - aq-server/docs/operations/messaging.md (the worker polling paragraph, and the inbox/body limits paragraph)
      - aq-server/docs/architecture/0002-execution-and-recovery.md §6 (last paragraph), §9 X13
      - aq-worker/docs/specs/0004-session-observation-and-suspension.md §2 (nudge and inbox paragraph)
      - aq-worker/docs/specs/0003-profiled-tmux-sessions.md §3
    acceptance:
      - "Test `message_delivered_once_across_runner_restart` passes."
      - "Test `agent_reply_reaches_supervisor_mailbox` passes."
    deliverables:
