      - {id: t2, kind: test, target: cargo test --locked --workspace activation_switches_future_runs_only}
  - key: D10
    epic: D
    repo: aq-playbooks
    title: Bounded transition persistence (PB-04)
    type: feature
    class: deep-high
    needs: []
    continues: [PB-02, PB-04]
    spec: [aq-playbooks/docs/specs/0002-implementation.md, aq-playbooks/docs/implementation/PB-04.stage-a.md]
    description: |
      ### Goal
      Playbook transition cost stops growing with retained history. One synchronous writer must stop being the throughput bound, while the existing correctness guarantees stay intact.

      ### What to build
      - Replace whole-namespace snapshot writes in `aq-playbooks-postgres` with incremental (working-set and patch) persistence. Follow the PB-04 proposal's "Next-stage decision":
        - Add a separately versioned storage capability. Keep the full `load` and `compare_and_swap` as the reference path.
        - Callers never silently receive a partial state.
        - A transaction acquires the same namespace owner, incarnation and revision fence, reads a certified complete working set, and applies a validated patch atomically. Events, receipts, waits, children, effects, indexes, quota counters and the namespace revision commit together.
        - Host dispatch stays outside storage transactions.
        - There is one logical state owner, with no shadow store.
      - Remove the single synchronous writer as the bound. Use an async client or bounded parallel writers; either way, keep one authoritative owner and fair ready/effect discovery.
      - Preserve PB-04 acceptance:
        - crash, rollback and restart equivalence to the reference snapshot model, including ownership/incarnation fences and replay;
        - migration and protection-key rotation (XChaCha20-Poly1305 protected snapshots);
        - overload refuses without dropping unresolved work or resetting retries.
      - Budget: event admission p95 ≤ 25 ms and dispatch p95 ≤ 100 ms, at histories 0, 32, 128 and 512, on the recorded reference host.
        - Rerun the full PB-02 matrix: five artifacts, 24 samples per cell, pending children, concurrent admission, queue/fairness and the quota-refusal cases.
        - Use disposable PostgreSQL 17.11 (digest pinned in PB-04 stage A).
        - Retain the raw results.
      - Add `transition_cost_flat_with_history`.

      ### Current state
      - Stage A (`7e669e1`) added borrowed projection deltas. At history 512, the CAS projection is about 4.4 ms of CPU.
      - Event admission p95 is still 13.985, 18.501, 45.913 and 125.948 ms at histories 0, 32, 128 and 512. Dispatch p95 at 512 is about 170–186 ms (PB-02).
      - Full state load, clone, quota encoding and snapshot UPDATE remain O(S).
      - `Storage` is at `crates/aq-playbooks-runner/src/storage.rs:26`. Benchmarks are in `crates/aq-playbooks-postgres/examples/operating_envelope.rs` and `admission_benchmark.rs`.

      ### Interfaces
      Produces: a new playbooks revision with the versioned incremental storage capability and unchanged public run semantics. aq-server consumes it by exact vendored revision (re-vendored by D11 or a follow-up; D10 does not edit aq-server).

      ### Out of scope
      - Host catalog changes: D4.
      - aq-server adapters and vendoring: D5 and D11.
      - Deployed-system measurement: J3.
      - A 500-agent claim: deferred.
      - Active-run migration.
      - Arbitrary eviction of unresolved work.

      ### References
      - `aq-playbooks/docs/implementation/PB-04.proposal.md` ("Next-stage decision")
      - `aq-playbooks/docs/implementation/PB-04.stage-a.md`
      - `aq-playbooks/docs/implementation/PB-02.md` (matrix tables)
      - `aq-playbooks/docs/specs/0002-implementation.md` ("Atomic storage, scheduling and inspection")
    acceptance:
      - Transition cost stays within 2× from history 0 to 512 in the PB-02 matrix rerun; raw results retained.
      - The 25 ms / 100 ms p95 targets are reported; missing them is recorded as a limit, not a failure.
      - 'Named tests pass: `transition_cost_flat_with_history`.'
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace transition_cost_flat_with_history}
    priority: low
