  - key: F1a
    epic: F
    repo: aq-server
    title: Supervisor host container and supervisor session lifecycle under central identity
    type: feature
    class: deep-high
    review: adversarial
    needs: [B6a1]
    continues: [AQ-17]
    spec: [aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md, aq-server/docs/implementation/AQ-17-central-authority-core.md, aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Run the global supervisor's CLI sessions in a dedicated supervisor host container. Each session runs under a central session identity and a short expiring execution permit, with provider credentials from the central vault. A restart resumes the one logical supervisor and never launches a duplicate session.

      ### What to build
      - A supervisor host program and container image named `aq-supervisor-host`, the service name E1c uses in production Compose. It runs the shared tmux session host and a harness adapter from aq-worker crates, consumed at exact pinned versions: vendored like the existing `aq-server/vendor/*` packages, with no sibling path dependency (E1). It is not a worker node. It has no offers, no enrollment and no Docker access (0005 §3.1, DEP5).
      - 0003 §4: supervisor sessions use the same host and adapter libraries and "are not fake remote worker assignments". H1: a session-owned tmux host under the guardian, with enforced expiry.
      - A durable owner for the AQ-17 model in `crates/aq-central-authority`, using SQL and the next free migration number. It holds the actor/conversation identity and `SessionIdentity::Central`, whose generation equals the binding generation and increments once per successor. It also issues and renews permits. Rules from the AQ-17 core:
        - A permit lasts at most 120 s and never passes the original wall deadline, measured on CLOCK_BOOTTIME of one boot.
        - Renewal needs a still-live prior permit, the next sequence and a strictly later expiry. A foreign boot or a clock regression refuses.
        - A late renewal or Running report cannot undo cancellation, expiry or an uncertain stop.
        - An unknown stop prohibits a successor. A successor needs stopped-writer proof (or a never-started cancellation) plus the `MailHistoryFence`.
      - Restart behaviour: on a host or daemon restart, reconcile the current generation. Re-adopt it if it is live under a valid permit. Otherwise stop and preserve it, then start generation+1. One actor never has two live writers.
      - The provider credential is read only inside the supervisor host. It never appears in argv, env listings, logs or prompts, and never reaches a worker or sandbox (SBX17, P8).

      ### Current state
      - `crates/aq-central-authority` is pure, with no SQL and no host. Its only daemon use is `crates/aq-server/src/agent_access/messaging/global/reservations.rs:14`.
      - Migration `0037_central_reservations.sql` and `ReservationOwner` (`reservations.rs:136`) only reserve human mail. There is no Run, session or permit. The latest migration is `0041_native_compute_occupancy.sql`.
      - aq-worker `crates/aq-session-host` 0.1.5 (`ExecutionPermit`, lib.rs:43) and `crates/aq-codex-mapper` are not vendored into aq-server.
      - No supervisor host binary, Dockerfile or service exists.

      ### Interfaces
      Consumes:
      - B6a1's guardian, attempt-owned tmux launch and stop-and-preserve (aq-worker, pinned).
      - The aq-central-authority model.
      - API-key credentials from `CredentialConfig.secret_file` (`crates/aq-server/src/intelligence/config.rs:19`).

      Produces:
      - The `aq-supervisor-host` binary and image.
      - A central session owner that F1b, H4 and H6 use: start, renew, stop and inspect a supervisor generation; the current session identity; stop proof for successor admission.

      ### Out of scope
      - Mailbox dispatch, replies, the `supervisor.conversation` capability and supervisor tool credentials: F1b.
      - The production Compose service and its resource limits: E1c.
      - Enqueue commands: F2.
      - Supervisor waits and wake: H4 and H6.
      - The security review: J4.

      ### References
      - aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md §1 and §4 (final paragraph)
      - aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md §3.1 (supervisor host row), §7 (table), §10 DEP5
      - aq-server/docs/implementation/AQ-17-central-authority-core.md (the permit, successor and MailHistoryFence paragraphs)
      - v1: agent-queue2/src/commands/supervisor_authority.py and src/sessions/supervisor_health.py
    acceptance:
      - Test `supervisor_session_starts_under_central_permit` passes.
      - Test `supervisor_restart_resumes_without_duplicate_session` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace supervisor_session_starts_under_central_permit}
      - {id: t2, kind: test, target: cargo test --locked --workspace supervisor_restart_resumes_without_duplicate_session}
