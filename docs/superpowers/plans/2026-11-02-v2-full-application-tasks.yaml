        - `recent_outcomes` `{subject: TitledRef, project, outcome, at}` from the result and settlement owners.
        - Label freshness per source. When an owner is unavailable, set coverage `partial` with a reason. Never turn a failed contribution into 0. All-authorized aggregation must not reveal excluded projects.
        - Replace the `serde_json::Value` + `#[schemars(length(max = 0))]` placeholders (`dashboard_api/contract.rs:307-311`) with typed structs, and regenerate `protocol/dashboard-read/v1/schema.json`.
      - Search, `GET /api/v1/search`:
        - Scoped typed hits grouped by task, session, result, playbook and knowledge.
        - Response shape: `{groups:[{type, hits:[{ref, title, excerpt, project}], has_more}]}`, as the dashboard already expects.
        - Bounded query and pages, using G1a cursors. Never return secret-bearing configuration.
      - Provider quota, `GET /api/v1/provider-usage`:
        - Account-scoped regardless of the project filter. `data: ProviderUsage[]` with `{provider_id, account_ref, account_label, scope:"provider_account", windows, preferred_window_id, availability_ref}`.
        - Each window is `QuotaWindow {id, label, starts_at, resets_at, used_percent (0-100|null), used, limit, unit, state: known|unknown|unavailable, observation}`.
        - Never infer a percentage from tokens, worker slots or credential availability. A reset time may be null. Report each window individually. The server chooses `preferred_window_id`.
        - The collector owns upstream auth, freshness and shared-account deduplication; the browser never calls a provider. A fault yields a stale or unknown observation, never a page failure.
        - Select and qualify at least one real source, and record per-provider support in the evidence. A configured account with no qualified source returns `state:"unknown"` and null numbers (test `quota_unknown_is_not_zero`).
        - Turn `provider.quota` on when the collector is mounted.
      - Publish fixtures for nonempty, empty, partial, stale and unknown cases.
      ### Current state
      - `service::overview` (`dashboard_api/service.rs:755-802`) returns `Total::unknown()` counts and empty attention and outcomes.
      - `provider.quota` is hard-coded false (`service.rs`, around line 239).
      - No server route exists for `/api/v1/search` or `/api/v1/provider-usage`. The dashboard already calls both (`SearchDialog.tsx:38`, `useProviderUsage.ts:47`) against mocks.
      - `/api/human/provider-accounts` (`provider_accounts.rs`) is a sanitized account inventory with no quota.
      ### Interfaces
      Consumes: G1b envelope and `pending_operations`; graph, reviews, workers and results reads.
      Produces: the three routes, their schemas and fixtures for G5, and the `provider.quota` and `search.read` capabilities.
      ### Out of scope
      - Overview UI and the quota strip (G5).
      - Results feed modes (G6). Session token/cost accounting (H2): quota is not usage. Notifications (F4).
      ### References
      - aq-dashboard/docs/specs/0003-dashboard-api.md §3 "Bootstrap and provider quota"; §4 table rows overview and search.
      - aq-dashboard/docs/specs/0002-product-design.md §3 (quota semantics); §4 "Overview".
    acceptance:
      - "Test `overview_attention_lists_waiting_decision_and_failed_task` passes."
      - "Test `quota_unknown_is_not_zero` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace overview_attention_lists_waiting_decision_and_failed_task}
      - {id: t2, kind: test, target: cargo test --locked --workspace quota_unknown_is_not_zero}
