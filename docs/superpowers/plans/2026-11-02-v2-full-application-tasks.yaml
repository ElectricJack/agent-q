      - **Consumes:** MS1, A1, A4, C5b, C6b, I4b, E1a/E1b/E1c, E2, E3, E5, E6a and E6b.
      - **Produces:** MS2.md, the demo script and the owner's approval, which gates MS3. Daily work moves to the VPS from MS3 on.

      ### Out of scope
      - Fixing defects found: file each against the owning task (for example E6a, E1c, C6b).
