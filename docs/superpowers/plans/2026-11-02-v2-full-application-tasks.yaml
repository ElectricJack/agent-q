      ### Goal
      Add the supervisor host and the VPS cloud worker to production Compose, with per-service CPU and memory limits. Agent sandboxes must not be able to starve the server stack.

      ### What to build
      - **`aq-supervisor-host` service.** It runs central supervisor CLI sessions under central identity (DEP5).
        - No Docker access.
        - Not a worker node.
        - Supervisor credentials never reach workers (0005 §3.1).
      - **`aq-worker-cloud` service.** aq-worker with the `docker-local` backend and its own dedicated rootless sandbox daemon on the VPS (0005 §3.1, DEP2).
        - Never the host's main Docker socket. The worker gets only the sandbox daemon's socket.
        - It holds its journal volume and credential-lease cache.
        - It connects to the server through the public machine hostname and Access, **not** over the internal Compose network (0005 §3.1).
      - **Limits:** memory, CPU (and PID where applicable) limits on every service, sized so the worker's sandboxes can't starve postgres, server, graph, aq-git or cloudflared. Record the values and why.
      - **Test:** mode `prod-workers` in `scripts/compose-smoke.sh` runs the scripted test `sandbox_load_does_not_starve_server_health`. Generate CPU and memory load through the sandbox daemon and show that server health and readiness stay within their deadlines.
