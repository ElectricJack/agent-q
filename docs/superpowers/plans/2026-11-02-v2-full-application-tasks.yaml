  - key: J4
    epic: J
    repo: aq-server
    title: Security review of permits, credentials, sandboxes and Access
    type: research
    class: deep-high
    review: adversarial
    needs: [C6b, E5, F1a]
    continues: []
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      Produce an adversarially reviewed threat model and probe results for the trust boundaries around permits, credentials, sandboxes, Access and supervisors, and file every finding as a task with a severity.

      ### What to build
      - **Threat model** of the deployed topology (0005 §3.1, §7), with tests or probes for each boundary:
        1. **Agent user reading runner secrets.** The `agent` user must not read the permit, proxy-held API keys, the runner Access token or runner state (SBX7). Probe file modes, `/proc`, the environment, the tmux socket and the loopback proxies from inside a real sandbox.
        2. **Permit misuse** (SBX6). Probe:
           - use after expiry;
           - use for another attempt;
           - preparation scope used for execution routes;
           - use after node revocation or a new boot;
           - accepting offers or registering incarnations.
        3. **Credentials remaining in snapshots or images.** Look for subscription login material after teardown and wipe, and in template images (SBX9; credential-scan coverage).
        4. **Access bypass.** Reach the origin without Access; reach human routes from the machine hostname; misuse the runner token (infrastructure spec "Origin isolation").
        5. **Sandbox Docker daemon launch policy** (0005 §5.1). Only allowlisted digests, never privileged, no host bind mounts beyond the per-attempt volume and declared aliases, CPU/memory/PID limits, outbound-only network, and never the host's main socket.
        6. **Supervisor credential isolation.** No supervisor credential reaches any worker or sandbox (F1a, W1, SBX17).
        7. **Prompt-injection exfiltration of subscription logins.** The agent can read them by design (§7), and the network allows outbound traffic. Assess the existing controls (lease scope, one attempt per sandbox, wipe at teardown) and recommend mitigations.
      - **Don't reuse other tasks' test claims as evidence.** Run independent probes, and you may cite tests such as B6b `agent_user_cannot_read_permit_or_proxy_key` and C6a `api_key_never_visible_to_agent_user`. Do not claim hostile-code isolation for docker-local (SBX10, W6).
      - **Report:** `docs/implementation/J4.md`, submitted through the `aq-reviews` adversarial recipe from a different model family, then integrated by pull request.
      - **Findings:** each one becomes `aq task create --reason …` with severity, boundary, repro and owning repo.

      ### Current state
      - The boundaries are built by B2 and B6a2 (permits), B6b (users and proxies), C2 (daemon policy), C6a and C6b (credentials), F1a (supervisor host) and E5 (Access).
      - J4 starts after C6b, E5 and F1a.
      - Whether the boat backend (C7) exists by then is unverified. If it does, cover it; otherwise record that it was not reviewed.

      ### Interfaces
      - **Consumes:** the deployed VPS (E5), the runner credential paths (C6b) and the supervisor host (F1a).
      - **Produces:** the review report and filed findings. MS4 maps the SBX7, SBX9, SBX10 and SBX17 evidence to it.

      ### Out of scope
      - Fixing findings: file them against the owning tasks (B2, B6b, C2, C6b, F1a, E5).
      - Egress-filtering design: recommend it and file it.
      - Editing 0005: file a `docs` task.

      ### References
