  - key: I0
    epic: I
    repo: aq-worker
    title: 'MS0: one real Codex API-key run in a plain Docker container on the existing native path'
    type: test
    class: deep-high
    needs: [E0]
    continues: [WRK-08, GATE-04]
    spec: [aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md, aq-server/docs/plans/2026-10-31-native-integration-checkpoint.md]
    description: |
      Before building permits, the credential vault or templates, prove the real-provider loop on what exists today:
        - the current `aq-worker run-native` one-shot path;
        - inside a plain Docker container on the WSL2 desktop, built from Dockerfile.worker plus the pinned Codex CLI;
        - against the E0 stack;
        - with a real OpenAI API key read from a local file.

      Run a real graph task that edits the scratch repository, retains source and settles through the existing route.
      A human-review settlement is acceptable here.

      Run it three times. Record every failure and rough edge, and file each one as a task with --reason.
    acceptance:
      - Three consecutive real runs complete with retained source and a recorded outcome.
      - Every problem found is filed as a task and listed in the evidence.
    deliverables:
      - {id: report, kind: file, target: docs/implementation/I0-first-real-run.md}
  - key: B1
    epic: B
    repo: aq-worker
    title: Own the native execution contract and add delegated runner permits
    type: design
    class: deep-high
    review: adversarial
    needs: []
    continues: [CON-01, CON-02]
    spec:
      - aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md   # §6, SBX6, SBX16
      - aq-server/docs/architecture/0002-execution-and-recovery.md
      - aq-worker/docs/specs/0002-execution-and-agent-access.md
    description: |
      The native wire contract currently lives in aq-server's aq-admission and is vendored into aq-worker. That
      contradicts the ecosystem rule that aq-worker/protocol owns the worker contract.

      Resolve it one of two ways:
        (a) move the crate into aq-worker/protocol as the published contract;
        (b) amend ecosystem §3 to name aq-admission's owner explicitly.
      Record the choice in the evidence.

      Then extend the contract with:
        - delegated runner permits: preparation scope and execution scope; bound to attempt, grant generation,
          sandbox identity, node boot and hard deadline;
        - the node re-adoption request and response;
        - the renewal response "awaiting node re-adoption";
        - the runner terminal/observation channel identity (per sandbox, with node aggregation);
        - backend capability advertisement and template inventory in node registration.
      Publish schemas and fixtures for valid, invalid, replay and compatibility cases. Older peers must decline
      these capabilities explicitly.
    acceptance:
      - 'Test `permit_fixture_conformance` passes in aq-worker against the published fixtures (scope violations: other attempt, expired, wrong boot, pre-grant use of execution scope; re-adoption replay).'
      - aq-server consumes the same pinned contract version; its matching conformance test is filed as an emergent aq-server task if outside this workspace.
      - An adversarial review is resolved.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace permit_fixture_conformance}
      - {id: review, kind: review, target: spec}
    integration: pull_request
  - key: B2
    epic: B
    repo: aq-server
    title: Issue, scope, revoke and re-adopt delegated permits
    type: feature
    class: deep-high
    review: adversarial
    needs: [B1]
    continues: [AQ-08]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      - Issue a preparation-scoped permit when an offer is accepted and upgrade it to execution scope at grant.
      - Enforce permit scope on every runner route: material fetch, Prepared/Started, renewal, observations,
        terminal, artifact transfer, results, mail.
      - Revoke permits on node revocation, attempt cancellation and expiry.
      - Implement node re-adoption: a new boot lists live sandboxes, and the server re-binds their permits.
        Until then renewals return "awaiting node re-adoption" without extension.
      - Persist permits durably and make issuance idempotent.
    acceptance:
      - "Test `permit_scope_refuses_foreign_attempt_and_expired_use` passes."
      - "Test `node_reboot_requires_readoption_before_renewal_extends` passes."
      - "Test `server_restart_mid_attempt_resumes_or_preserves` (Review Focus 4) passes: the server restarts with an active permit; renewal resumes within the window, otherwise the runner is told to stop and preserve; no duplicate result is recorded."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace permit_scope_refuses_foreign_attempt_and_expired_use}
      - {id: t2, kind: test, target: cargo test --locked --workspace node_reboot_requires_readoption_before_renewal_extends}
      - {id: t3, kind: test, target: cargo test --locked --workspace server_restart_mid_attempt_resumes_or_preserves}
    integration: pull_request
  - key: B3
    epic: B
    repo: aq-server
    title: Native cancellation end to end
    type: feature
    class: standard-high
    needs: []
    continues: [AQ-08, AQ-10]
    spec: [aq-server/docs/architecture/0002-execution-and-recovery.md, aq-server/docs/specs/0002-execution-and-agent-access.md]
    description: |
      - Native polls currently return `cancellations: vec![]` (producer/workflow.rs:232), and the cancel path
        loads only `legacy_fixture` attempts.
      - Add native cancellation for every phase (offered, preparing, granted, started), with durable cancellation
        IDs and directive delivery in poll and renewal responses.
      - Order cancellation correctly against a late result (X6/X7).
      - Expose it through the owner API used by the dashboard, the v2 CLI and policy (`operation.cancel`).
    acceptance:
      - "Tests `native_cancel_before_grant_releases_claim`, `native_cancel_after_start_stops_and_settles_cancelled` and `late_result_after_cancel_is_recorded_not_applied` pass."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace native_cancel_before_grant_releases_claim}
      - {id: t2, kind: test, target: cargo test --locked --workspace native_cancel_after_start_stops_and_settles_cancelled}
      - {id: t3, kind: test, target: cargo test --locked --workspace late_result_after_cancel_is_recorded_not_applied}
  - key: B4
    epic: B
    repo: aq-server
    title: Retry/replacement attempts, fair multi-project scheduling and moving-ref sources
    type: feature
    class: deep-high
    needs: []
    continues: [AQ-08]
    spec: [aq-server/docs/architecture/0002-execution-and-recovery.md, aq-server/docs/specs/0003-project-execution-bindings.md, aq-worker/docs/specs/0001-worker-framework.md]
    description: |
      - Today `first_eligible_task` skips any task with started>0. Allow replacement attempts after a failed,
        expired or cancelled attempt has settled with stop proof, within shared task retry and spend budgets
        (P7, X4); a replacement never resets those budgets.
      - Replace "top-priority project, first 8 ready items" with cursor-based fair scheduling across projects.
      - Support `NamedRef` source selection resolved to an exact commit at offer time.
      - A successor attempt uses the predecessor's retained source when policy says so.

      Replacement attempts also consume a per-task sandbox-minutes budget, so a flapping provider cannot spin up paid
      sandboxes indefinitely.
    acceptance:
      - "Tests `failed_attempt_is_replaced_within_retry_budget`, `retry_budget_exhaustion_blocks_task`, `two_projects_share_capacity_fairly` and `named_ref_resolves_to_exact_commit_at_offer` pass."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace failed_attempt_is_replaced_within_retry_budget}
      - {id: t2, kind: test, target: cargo test --locked --workspace retry_budget_exhaustion_blocks_task}
      - {id: t3, kind: test, target: cargo test --locked --workspace two_projects_share_capacity_fairly}
      - {id: t4, kind: test, target: cargo test --locked --workspace named_ref_resolves_to_exact_commit_at_offer}
  - key: B5a
    epic: B
    repo: aq-worker
    title: 'Node controller core: enrollment, boot incarnation, journal-before-backend, capacity'
    type: feature
    class: deep-high
    review: adversarial
    needs: [B1, C1]
    continues: [WRK-02, WRK-18]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-worker/docs/specs/0001-worker-framework.md]
    description: |
      Build a long-lived `aq-worker run` node controller that runs no agents. It owns:
        - enrollment and boot ID;
        - registration with backend capabilities and the template inventory (B1 contract);
        - node-wide capacity (concurrent sandboxes, spend ceiling);
        - offer acceptance;
        - a journal that records intent before any backend call;
        - sandbox lifecycle through the C1 trait (fake backend in tests).

      `run-native`'s refuse-if-state-exists behaviour is removed.
    acceptance:
      - Test `capacity_refuses_offer_at_sandbox_ceiling_with_typed_reason` passes.
      - Test `journal_records_intent_before_backend_create` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace capacity_refuses_offer_at_sandbox_ceiling_with_typed_reason}
      - {id: t2, kind: test, target: cargo test --locked --workspace journal_records_intent_before_backend_create}
    integration: pull_request
  - key: B5b
    epic: B
    repo: aq-worker
    title: 'Node controller recovery: reconcile, re-adopt, preserve-before-destroy, sweeps, cancellation'
    type: feature
    class: deep-high
    needs: [B5a]
    continues: [WRK-03, WRK-04]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-worker/docs/specs/0002-execution-and-agent-access.md]
    description: |
      Add recovery to the controller:
        - inventory reconciliation against the journal;
        - re-adoption after a new boot;
        - preserve-before-destroy;
        - deadline sweeps (stop, never delete);
        - cancellation observation.

      Port the synthetic runtime's journal, capacity and recovery tests to the controller, so that the M2/M3 guarantees
      are re-earned on the real path. Then retire the synthetic runtime or keep it only as a test harness.
    acceptance:
      - Test `controller_restart_reconciles_journal_against_backend_inventory` passes.
      - Test `unretained_sandbox_is_preserved_not_destroyed` passes.
      - The ported recovery tests pass against the fake backend.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace controller_restart_reconciles_journal_against_backend_inventory}
      - {id: t2, kind: test, target: cargo test --locked --workspace unretained_sandbox_is_preserved_not_destroyed}
  - key: B6a
    epic: B
    repo: aq-worker
    title: 'Runner core: permit auth, guardian and tmux launch, stop-and-preserve, handoff-before-done'
    type: feature
    class: deep-high
    needs: [B1]
    continues: [WRK-08, WRK-17, WRK-18]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md]
    description: |
      `aq-worker sandbox-run` is the current native launch path adapted to run inside a sandbox:
        - it authenticates with the delegated permit;
        - it runs the guardian and the attempt-owned tmux host;
        - it stops and preserves on renewal loss;
        - it reports done only after handoff receipts.

      Use a deterministic fixture harness in a local process.
    acceptance:
      - Test `runner_cannot_report_before_handoff_receipts` passes.
      - Test `renewal_loss_stops_and_preserves_without_relaunch` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace runner_cannot_report_before_handoff_receipts}
      - {id: t2, kind: test, target: cargo test --locked --workspace renewal_loss_stops_and_preserves_without_relaunch}
  - key: B6b
    epic: B
    repo: aq-worker
    title: Runner OS users and loopback proxies (Responses; AQ API with Access header)
    type: feature
    class: standard-high
    needs: [B6a]
    continues: [WRK-17]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      The runner runs as separate `runner` and `agent` OS users. Add two loopback proxies:
        - the Responses proxy holds provider API keys;
        - the AQ API proxy injects the runner Access token from a file readable only by `runner`.

      This is not a hostile-code boundary on docker-local (SBX10). Do not over-invest beyond file permissions and the
      privilege drop.
    acceptance:
      - Test `agent_user_cannot_read_permit_or_proxy_key` passes.
      - Test `aq_proxy_injects_access_header_without_exposing_token` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace agent_user_cannot_read_permit_or_proxy_key}
      - {id: t2, kind: test, target: cargo test --locked --workspace aq_proxy_injects_access_header_without_exposing_token}
  - key: B6c
    epic: B
    repo: aq-worker
    title: Runner hydration from retention and per-sandbox terminal/observation channels
    type: feature
    class: standard-high
    needs: [B6a]
    continues: [WRK-14]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md]
    description: |
      Hydrate the workspace from central retention through the authorized artifact export. Open per-sandbox terminal and
      observation channels (SBX16), with no poll held when there are no subscriptions.
    acceptance:
      - Test `hydrated_workspace_matches_retained_revision` passes.
      - Test `idle_sandbox_holds_no_terminal_poll` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace hydrated_workspace_matches_retained_revision}
      - {id: t2, kind: test, target: cargo test --locked --workspace idle_sandbox_holds_no_terminal_poll}
  - key: B7
    epic: B
    repo: aq-worker
    title: Scoped AQ access for agents inside sandboxes
    type: feature
    class: standard-high
    needs: [B6b, B2]
    continues: [WRK-05, AQ-06]
    spec: [aq-worker/docs/specs/0002-execution-and-agent-access.md, aq-server/docs/specs/0002-execution-and-agent-access.md]
    description: |
      Link aq-agent-client into the runner. Provision the per-attempt scoped AQ credential and the
      context/token-file binding for the agent user, and expose it through the AQ loopback proxy.

      Ship the agent-facing CLI (binary `aq-agent`, never `aq`) in the runtime bundle: context, graph read and
      commands, operations, messages.
    acceptance:
      - "Test `agent_reads_scoped_context_and_writes_versioned_mutation` passes."
      - "Test `agent_credential_expires_with_attempt` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace agent_reads_scoped_context_and_writes_versioned_mutation}
      - {id: t2, kind: test, target: cargo test --locked --workspace agent_credential_expires_with_attempt}
  - key: C1
    epic: C
    repo: aq-worker
    title: Placement backend trait, journaled lifecycle and conformance suite
    type: feature
    class: deep-high
    needs: []
    continues: []
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]   # §4, §5, §11; SBX1 SBX3 SBX4 SBX5 SBX15
    description: |
      Define the backend trait and a fake backend:
        - create from template digest;
        - deliver private material;
        - start runner;
        - inspect;
        - list owned;
        - stop;
        - archive (optional);
        - resume/fork (optional);
        - destroy with confirmation;
        - capabilities.

      Write the reusable conformance suite that every backend must pass. Run it against the fake backend.
    acceptance:
      - "The conformance suite runs against the fake backend and covers: create-crash-before-record, unknown sandbox in inventory, destroy failure keeping resources protected, preserve-before-destroy with unretained work, deadline sweep stopping rather than deleting."
    deliverables:
      - {id: tests, kind: test, target: "cargo test --locked -p aq-worker --test backend_conformance"}
  - key: C2
    epic: C
    repo: aq-worker
    title: "`docker-local` backend with a dedicated rootless sandbox daemon"
    type: feature
    class: standard-high
    needs: [C1]
    continues: []
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]   # §5.1, SBX10, §8.3
    description: |
      Implement the backend against a dedicated rootless Docker or Podman daemon on WSL2, never the host's main
      socket. Fixed launch policy:
        - allowlisted template digests only;
        - no privileged containers;
        - only managed volumes and declared mount aliases;
        - CPU, memory and PID limits;
        - outbound-only network.

      Decide and record whether unprivileged user namespaces are allowed for bubblewrap (Codex `native` mode), or
      whether this backend is `container`-mode only.
    acceptance:
      - "Conformance suite passes against the real daemon in an opt-in test."
      - "Test `wsl_suspend_resume_reconciles_sandboxes` (Review Focus 1) passes: pausing and resuming the daemon mid-attempt leads to re-adoption or preservation, with no lost workspace."
      - "Install notes for WSL2 are written."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace wsl_suspend_resume_reconciles_sandboxes}
      - {id: tests, kind: test, target: "cargo test --locked -p aq-worker --test docker_local_backend -- --ignored"}
  - key: C3a
    epic: C
