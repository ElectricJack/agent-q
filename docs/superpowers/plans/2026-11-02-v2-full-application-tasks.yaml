      - aq-graph mutations support `create_node` and `add_edge`, with edge type `blocks` (`aq-graph/src/domain.rs:140`), at most 100 operations per batch (`aq-graph/src/store.rs:22`).
      - No v2 scheduler code reads priority today.
      - The action union does not exist yet (G1a/G1b).

      ### Interfaces
