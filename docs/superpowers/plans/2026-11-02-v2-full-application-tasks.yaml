      - Cancellation and attempt-replacement internals (B3, B4).
      - Dashboard UI (G3). Playbook kinds (D9).
      - Summaries (`set_summary`), deletion, bulk edits.
      ### References
      - aq-graph/docs/specs/0004-shared-node-model.md "Retirement and successors"; "Authority and restoration".
      - aq-dashboard/docs/specs/0003-dashboard-api.md §7.
      - aq-dashboard/docs/specs/0002-product-design.md §8 "Knowledge".
