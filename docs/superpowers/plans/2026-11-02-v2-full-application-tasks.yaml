  - key: C6b
    epic: C
    repo: aq-worker
    title: Runner subscription-login install, refresh write-back and wipe
    type: feature
    class: standard-high
    needs: [C6a, C5b]
    continues: [WRK-08]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      The runner handles a leased subscription login through four steps:
      - install it into the agent's harness home;
      - write any refreshed copy back to the server before teardown;
      - wipe it at teardown;
      - fail fast with the reason `credential_invalid` when the login is expired or revoked.

      ### What to build
      - **Install** (0005 §7, §8.3). For `subscription-login` credentials, write the leased Codex `auth.json` into the attempt's private `CODEX_HOME` from C6a.
        - The file is owned by the `agent` user and readable by it, because the CLI must read it directly.
        - The `runner`/`agent` separation does not protect this file; never claim it does.
        - The controls are: lease scope, one attempt per sandbox, the wipe, and the J4 review.
      - **Write-back.** Codex refreshes the file in place. Before any teardown (completion, cancellation, expiry, failure, or stop-and-preserve), check the file.
        - Write it back only if its digest differs from the installed digest and it parses as a valid login.
        - Send it to C5b's lease-scoped write-back endpoint under the attempt's permit.
        - Retry until the attempt's deadline.
        - Record the receipt in the runner journal.
        - Test: `refreshed_login_written_back_before_teardown`.
      - **Wipe.**
        - Once write-back succeeds, or fails definitively, delete the material and the harness credential directory.
        - No login may remain on a preserved disk, a boat archive or retained state; H5 depends on this.
        - If write-back failed, keep the refreshed copy only in runner-only state, and only until the handoff rules allow deleting it. Never drop it silently: a refresh-token rotation would otherwise invalidate the stored copy.
      - **Fail fast.** When the harness reports an authentication failure for the login, stop the attempt without relaunching. Report the failure reason `credential_invalid` and mark it non-retryable.
        - Test: `expired_subscription_login_fails_fast_with_credential_reason` (Review Focus 3, worker side).

      ### Current state
      - **Install already exists.** The native path installs a ChatGPT `auth.json`:
        - `PrivateLaunchInput::codex_chatgpt_auth_json` in aq-worker `crates/aq-session-host/src/private_inputs.rs:338`;
        - called from `crates/aq-worker/src/native/launch/native.rs`, around lines 474 and 520;
        - validated by `validated_chatgpt_auth_json` in `native/adapter/codex/chatgpt.rs`.
      - **No write-back yet.** When the login changes, aq-session-host keeps the changed copy "for credential reconciliation" but never writes it back (`private_inputs.rs`, around lines 531–545).
      - **No `credential_invalid` reason exists.** The server has `ProviderFailure::Authentication` (aq-server `crates/aq-selection/src/feedback.rs`). Adding a reason is a contract change that needs schemas and fixtures.

      ### Interfaces
      - **Consumes:**
        - C6a: the config builder and `CODEX_HOME`;
        - C5b: the write-back endpoint;
        - C5a2: the permit-bound lease.
      - **Produces:** install, write-back and wipe in the runner, and the `credential_invalid` reason.
      - **Used by:**
        - I4b;
        - I1–I3;
        - F4: `credential_invalid_notifies_once_per_episode`;
        - B4: no automatic retry;
        - H5.

      ### Out of scope
      - Server-side write-back storage, fencing, lease limits and enrollment: C5b.
      - Owner notification: F4.
      - Server-side retry suppression: B4.
      - Credential files for other harnesses: I1, I2 and I3.

      ### References
      - 0005 §4 step 8, §7 (table row "Subscription login material", and Rules), §8.3 "ChatGPT login", SBX8.
      - Plan "Review Focus" item 3.
    acceptance:
      - 'Test `expired_subscription_login_fails_fast_with_credential_reason` (Review Focus 3, worker side) passes: the attempt fails with reason `credential_invalid` and is not retried automatically.'
      - Test `refreshed_login_written_back_before_teardown` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace expired_subscription_login_fails_fast_with_credential_reason}
      - {id: t2, kind: test, target: cargo test --locked --workspace refreshed_login_written_back_before_teardown}
