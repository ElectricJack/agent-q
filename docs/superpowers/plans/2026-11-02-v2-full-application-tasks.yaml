  - key: H1
    epic: H
    repo: aq-worker
    title: Adopt observation readers and the durable observation store in the runner
    type: feature
    class: standard-high
    needs: [B6c]
    continues: [WRK-15]
    spec: [aq-worker/docs/specs/0004-session-observation-and-suspension.md, aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md]   # S2
    description: |
      ### Goal
      The in-sandbox runner collects harness transcript observations with the existing readers. It stores them in the durable format5 observation store and delivers them over the per-sandbox observation channel without duplicates across restarts. The Codex reader is qualified on real transcripts.

      ### What to build
      - Link `aq-observation` 0.1.0, `aq-observation-engine` 0.0.1 and the format5 store (`aq-observation-redb-prototype` 0.0.5) into the runner. Use exact version pins.
      - Identify the transcript source through the launched harness session only. Validate paths against authorized roots and reject symlink or path redirection. Never scan provider homes (0004 §2.2; worker spec §2).
      - Persist each event together with the cursor that consumed it. Send replayable batches over the per-sandbox observation channel under the permit (`POST /v1/worker/observations/batch`), and keep them until the server's receipt arrives.
      - Never advance a cursor past unrecorded facts. Report gaps and incompleteness explicitly. After a runner restart, resume from the persisted cursor with no duplicate source events.
      - Bounds (0004 §6 fixture profile):
        - 64 KiB per event and 256 KiB per batch;
        - a 16 MiB telemetry spool;
        - format5 limits of 16 MiB logical, 64 MiB file and 16 sources.
      - Under overload, emit explicit gaps. Transcript traffic never delays renewal, stop or cancellation.
      - Coalesce ordinary state observations. Usage metadata excludes raw prompt and tool content.
      - Codex qualification: record transcripts from a real Codex run (I0 or I4a, or a fresh run), sanitize them, and commit them as fixtures. Run the reader against them. Record the CLI version and the format ID in `docs/implementation/H1.md`. The recorded transcripts must contain no secrets.

      ### Current state
      - The readers exist in `crates/aq-observation/src/formats/` and `crates/aq-observation-engine/src/formats/` (codex, claude, gemini, opencode).
      - The Codex reader parses the rollout JSONL format `codex-rollout-jsonl-67f0994` (`session_meta`, `turn_context`, `event_msg` with `token_count`), not `codex exec --json` output. Its qualification on a released CLI is "pending" (`docs/implementation/WRK-15-source-formats.json`).
      - Decide whether to qualify the rollout reader on real rollout files or add an exec-JSON format, and record the decision.
      - `crates/aq-worker/Cargo.toml` depends on none of the observation crates; the store is "not yet adopted by the production worker" (WRK-15-integration.md, WRK-15-reserved-control.md).

      ### Interfaces
      Consumes:
      - B6c's per-sandbox observation channel.
      - B2's permit scope on observation routes.
      - B6a1's launched session identity.

      Produces:
      - Production observation batches that H2 registers and accounts for, and that H3 uses as stall evidence.

      ### Out of scope
      - Server-side source registration, the ledger and pricing: H2.
      - The stall ladder: H3.
      - Terminal output and snapshots: H7.
      - Claude, Gemini and OpenCode qualification: I1–I3.
      - Raw transcript artifact retention policy: not in this plan.

      ### References
      - aq-worker/docs/specs/0004-session-observation-and-suspension.md §2 (first two paragraphs), §5 (first two bullets)
      - aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md §2.2, §6
      - aq-worker/docs/implementation/WRK-15-reserved-control.md ("Correction within unchanged hard limits")
    acceptance:
      - "Test `observation_cursor_survives_runner_restart_without_duplicates` passes."
      - "The Codex reader is qualified on recorded real transcripts."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace observation_cursor_survives_runner_restart_without_duplicates}
