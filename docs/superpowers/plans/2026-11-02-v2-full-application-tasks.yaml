  - key: G10
    epic: G
    repo: aq-dashboard
    title: "Agents operations views: health, accounting, waits, terminal snapshots"
    type: feature
    class: standard-high
    needs: [H2, H3, H4, H7]
    continues: [UI-03, UI-04, UI-12, UI-17]
    spec: [aq-dashboard/docs/specs/0001-dashboard.md, aq-server/docs/architecture/0004-session-operations-waits-and-notifications.md]   # U9–U14
    description: |
      ### Goal
      Make Agents the operations view for each session: health and stall state with a nudge action, usage and cost, waits, notification delivery with retry, terminal snapshot reconnect, and profile provenance with effective permissions.
      ### What to build
      - Health (U12, S4):
        - Show heartbeat, provider activity, semantic progress and wait observations separately, each with a timestamp.
        - Show the stall-ladder rung, its evidence, and quarantine scope.
        - Nudge uses H3's API with a stable operation ID. Show queued, deferred, delivered, unknown and unsupported distinctly. A nudge never types into the terminal.
      - Usage and cost (U12, S3):
        - Show transcript events, source freshness, usage completeness, cost basis (currency, rate revision) and task-lineage totals.
        - Distinguish reported, estimated and unknown values. Missing values show "unknown", never 0 or $0 (test `agents_unknown_cost_renders_unknown`).
        - Label flat-subscription usage as not costed (H2).
      - Waits (U13):
        - Show the predicate with verified source/result refs, deadline policy, continuation generation and admission blocker.
        - Separate warm waiting, parked, retained hibernation, resume pending and running.
        - Separate released compute from protected disk, and a resolved dependency from a producer's success.
        - Label a manual early resume as an override. Cancelling a wait is not cancelling the task.
        - Test `waits_view_lists_registered_waits`.
      - Notifications (U14):
        - Show the logical message, route, attempts, transport receipt, unknown/failed delivery and acknowledgment as separate facts. Show a missing route plainly.
        - Retry via `POST /api/notifications/retry`, preserving identity, and show a possible-duplicate disposition. Never show webhook secrets.
      - Terminal reconnect (U11):
        - On disconnect, freeze input and show the last observation.
        - Reconnect asks for a snapshot or replay of the same identity and epoch (H7). It never relaunches and never auto-acquires control. Show gaps.
      - Profile (U9): profile/catalog revisions, harness/model, instruction provenance, and effective versus requested permissions. No secrets.
