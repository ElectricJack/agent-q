  - key: B5b
    epic: B
    repo: aq-worker
    title: 'Node controller recovery: reconcile, re-adopt, preserve-before-destroy, sweeps, cancellation'
    type: feature
    class: deep-high
    needs: [B5a]
    continues: [WRK-03, WRK-04]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-worker/docs/specs/0002-execution-and-agent-access.md]
    description: |
      ### Goal
      Make the node controller recover safely across restarts and new boots without losing work, and re-earn the synthetic runtime's M2/M3 recovery guarantees on the real controller.

      ### What to build
      - **Inventory reconciliation at startup** (SBX3, 0005 §4.1): compare the journal against the backend's `list` of owned sandboxes.
        - A sandbox with a current grant is re-adopted for monitoring.
        - A sandbox with no current grant, or one the journal doesn't know, is stopped. It is destroyed only after a bounded grace period, the reason is logged, and preserve-before-destroy applies.

        Test `controller_restart_reconciles_journal_against_backend_inventory`.
      - **Re-adoption on a new boot:**
        - Send B1's re-adoption request, listing each live sandbox's attempt and grant generation.
        - Never relaunch an attempt.
        - A sandbox that is not re-adopted by its renewal deadline is left for its runner to stop and preserve.
      - **Preserve-before-destroy** (SBX5, 0005 §4 step 7):
        1. Destroy only when no unretained work remains.
        2. Otherwise, try to extract the workspace and evidence through the runner or the backend file API.
        3. If extraction fails, stop the sandbox and keep its disk.
        4. Keep retrying handoff.
        5. Delete only after retention succeeds or an operator releases the sandbox.

        Test `unretained_sandbox_is_preserved_not_destroyed`.
      - **Stop proof** (SBX4): a backend-confirmed destroy, or a confirmed stop with no running processes. Otherwise resources stay protected.
      - **Deadline sweeps** (SBX15):
        - The hard deadline is the grant's hard deadline plus a small margin.
        - A periodic sweep **stops** any sandbox past its deadline and never deletes it. Preserve-before-destroy then applies.
        - The sweep acts only within the node's own scope.
      - **Cancellation observation** (0005 §6): read cancellations from the node's poll. If the runner hasn't stopped by the deadline, stop the sandbox, then apply preserve-before-destroy.
      - Grace periods, sweep intervals and margins are bounded and configurable (0005 §13).
      - **Port the synthetic tests:** port the synthetic runtime's journal, capacity and recovery tests to the controller and run them against the fake backend:
        - `tests/execution.rs` (17 tests), for example `lost_acceptance_and_late_response_never_revive_expired_reservation`, `launch_intent_crash_never_blindly_relaunches_or_releases_writers` and `stopped_slots_do_not_bypass_pending_result_storage_bounds`;
        - `tests/driver.rs`, for example `blocked_fixture_is_killed_and_reaped_on_cancellation` and `stopped_report_recovers_before_new_boot_registration_without_relaunch`.

        Then retire the synthetic runtime (`src/runtime.rs`, `src/journal.rs`, `src/driver.rs`, `run-execution`) or keep it as a test harness only. Record which in the evidence.

      ### Current state
      - Builds on the B5a controller and journal. The synthetic runtime and tests are under `crates/aq-worker/{src,tests}`; WRK-02 to WRK-04 qualified only that runtime.

      ### Interfaces
      - **Consumes:** the B5a controller, C1's trait and fake backend, and B1's re-adoption types.
      - **Produces:** recovery behaviour that C2, C7, E6a, E6b and H5 rely on.

      ### Out of scope
      - Real backends and their tests (C2, including `wsl_suspend_resume_reconciles_sandboxes`; C7).
      - Runner stop on renewal loss (B6a1).
      - Server-side re-binding (B2).
      - Hibernation (H5).
      - Installers (E6a).

      ### References
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §4 step 7, §4.1, §6, §13
      - `aq-worker/docs/specs/0002-execution-and-agent-access.md` §2, §3
      - `aq-worker/docs/specs/0001-worker-framework.md` §16
    acceptance:
      - Test `controller_restart_reconciles_journal_against_backend_inventory` passes.
      - Test `unretained_sandbox_is_preserved_not_destroyed` passes.
      - The ported recovery tests pass against the fake backend.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace controller_restart_reconciles_journal_against_backend_inventory}
      - {id: t2, kind: test, target: cargo test --locked --workspace unretained_sandbox_is_preserved_not_destroyed}
  - key: B6a1
    epic: B
    repo: aq-worker
    title: 'Runner core: guardian and tmux launch, stop-and-preserve, handoff-before-done'
    type: feature
    class: deep-high
    needs: []
    continues: [WRK-08, WRK-17, WRK-18]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md, aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md]
    description: |
      ### Goal
      Build `aq-worker sandbox-run`, the runner that executes one attempt inside a sandbox. It is the native launch path restructured, with the guardian and tmux host, stop-and-preserve on renewal loss, and "done" reported only after handoff receipts.

      ### What to build
      - **New subcommand `aq-worker sandbox-run`:**
        - It reuses `native::runner`, `native::launch` and `aq-session-host`.
        - Its inputs are the frozen launch manifest and a state directory. B5a delivers them in production; in this task they come from a local directory.
        - It does no offer polling or acceptance; that is node work.
      - **Guardian and tmux** (H1, 0003 §4):
        - Create a private tmux server inside the guardian's ownership boundary before any writer starts, and never join a shared server.
        - Stopping covers the tmux server and all its descendants.
        - Pane disappearance, EOF or a `kill-session` acknowledgement is not stop proof. Without proof, resources stay protected.
      - **Renewal while Running:** the defaults are a 120 s grant renewed about every 15 s, with a suspend-aware clock (0002 §5). On renewal loss, stop the harness and preserve the workspace and journal, and never relaunch (X5, H3). Renewal loss means a refusal, or the deadline passing with no successful renewal. Test `renewal_loss_stops_and_preserves_without_relaunch`.
      - **Handoff before done** (X12, SBX5, 0005 §4 step 6): report finished only after retained source and result evidence have reached central retention with receipts. Test `runner_cannot_report_before_handoff_receipts`.
      - **Test setup:** use the deterministic fixture harness (`aq-fixture-agent`, `native_fixture`) in a local process. Don't use real Codex or a container.
      - Keep the host and guardian usable as a library for F1a.
      - Until B6a2, authenticate with the existing worker configuration.

      ### Current state
      All paths are under `crates/aq-worker/src/`.
      - `native/runner.rs:76` `run_once` combines node work (register, poll, accept, prepare) with execution.
      - `native/runner/codex.rs:532` `drive_running_owned` loops on shutdown, a fixed `deadline_ns` and the host phase, with no renewal call.
      - `NativeClient::renew` exists in `native/http/control.rs:297`, but only the synthetic `driver.rs:667` and `source_driver.rs:156` call a renew.
      - The guardian and tmux host are the `aq-session-host` crate. `aq_session_host::ExecutionPermit` is the guardian's local expiring authority, not the delegated permit.
      - The result and handoff code is in `native/result/`.

      ### Interfaces
      - **Consumes:** existing native code.
      - **Produces:**
        - the `sandbox-run` entrypoint and its stop-and-preserve semantics, extended by B6a2, B6b and B6c and launched by B5a;
        - the library host, used by F1a.

      ### Out of scope
      - Permit authentication (B6a2).
      - OS users and proxies (B6b).
      - Hydration and terminal/observation channels (B6c).
      - Codex configuration and confinement (C6a).
      - The node controller and sandbox creation (B5a, C1, C2).
      - Agent AQ access (B7).

      ### References
      - `aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md` §4, §7 (H1, H3)
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §2 (Sandbox runner), §4 steps 5–7
      - `aq-server/docs/architecture/0002-execution-and-recovery.md` §5, §7
    acceptance:
      - Test `runner_cannot_report_before_handoff_receipts` passes.
      - Test `renewal_loss_stops_and_preserves_without_relaunch` passes.
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace runner_cannot_report_before_handoff_receipts}
      - {id: t2, kind: test, target: cargo test --locked --workspace renewal_loss_stops_and_preserves_without_relaunch}
