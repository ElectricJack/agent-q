        2. Restore.
        3. Start the pinned release.
        4. Verify owner login, graph and aq-git readiness, and worker re-enrollment.
      - **Post-restore reconciliation** (ecosystem §6): restoring a database can't undo remote effects. Reconcile execution grants, operation receipts, publication (aq-git `operation.reconcile`) and pending messages. Show:
        - no duplicate publication or completion;
        - attempts that were live at backup time settle as uncertain, failed or replaced, never silently resumed.
      - **Runbook:** `docs/operations/backup-restore.md`, with commands, timings and limits. Evidence goes in `docs/implementation/J5.md`.

      ### Current state
