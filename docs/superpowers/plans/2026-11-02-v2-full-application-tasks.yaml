  - key: D6
    epic: D
    repo: aq-server
    title: "Host adapters: judgment.request, check.request"
    type: feature
    class: standard-high
    needs: [D5, B5b, C4]
    continues: [AQ-14]
    spec: [aq-playbooks/docs/specs/0001-aq-playbooks.md, aq-server/docs/implementation/AQ-14-decision-check-owner-design.md]
    description: |
      ### Goal
      Policies can request a bounded model judgment, and can run a project's declared checks as real check attempts in a sandbox. Both return typed, provenance-carrying results through the playbook host.

      ### What to build
      - `judgment.request`:
        - It is a provider request, not an agent CLI session (0003 §4). It uses a permitted provider credential profile chosen by the host.
        - Inputs are explicit context, a question and a declared output schema. It is bounded by token, cost and deadline budgets; exceeding a budget is a typed refusal.
        - It returns a durable operation handle and completes by event.
        - Record provenance: provider, model, credential profile reference (never the secret), prompt/context digest, usage, output digest.
        - No arbitrary tool loop. Its output can never substitute for a human decision or for executed check evidence.
      - `check.request` (AQ-14 "Registered executed checks"):
        - It selects an exact check ID and validator `ArtifactRef` already in the pinned outcome's `required_checks` (at most 32), plus an exact immutable subject (the retained source OID). No arbitrary shell, URL or path, and no endpoint that accepts `passed:true`.
        - A durable check intent is recorded before execution. Run it as a check attempt in a sandbox under a check execution profile.
        - The receipt binds subject, validator digest, executor version, inputs, result artifacts, and stop/exit evidence.
        - Dispositions are distinct: Passed, Failed, Cancelled, TimedOut, Unknown, Stale. Missing input or an uncertain stop is never Passed.
        - A lost response reconciles the original operation; never start a second writer. Map dispositions to the D4 catalog outcome words.
      - Bounds (AQ-14): requests are at most 64 KiB, at most 8 executions per subject and check, at most 256 review/check operations per task lineage, and at most 10,000 retained.

      ### Current state
      - Neither command has an adapter. `MailHost.dispatch` is at `crates/aq-server/src/playbooks/driver.rs:47`.
      - `migrations/0026_review_owners.sql` created the decision tables only. The planned `review_check_intents` and `review_check_receipts` tables do not exist.
      - Provider accounts: `crates/aq-server/src/provider_accounts.rs`. Vault credential profiles are C5a1's, and sandboxed execution comes from B5, C2 and C4; none is in `needs` (unverified whether merged).

      ### Interfaces
      Consumes:
      - D5's adapter framework and grants;
      - the execution pipeline for check attempts;
      - credential profiles.

      Produces:
      - check receipts, which D3's default policy and D7's evidence checks read;
      - a `check.completed`-style event per the D4 catalog;
      - judgment operation handles.

      ### Out of scope
      - The coding playbook that sequences checks: D9.
      - Publication evidence enforcement: D7.
      - The sandbox backend and the node controller: C2 and B5.
      - Credential vault and lease semantics: C5a1/C5a2.
      - Usage ledger and pricing: H2.

      ### References
      - `aq-server/docs/implementation/AQ-14-decision-check-owner-design.md`: "Registered executed checks", "Storage026 and bounded retained history"
      - `aq-playbooks/docs/specs/0001-aq-playbooks.md` §6 (judgment.request and check.request rows and the paragraph that follows)
      - `aq-server/docs/architecture/0003-agent-profiles-harnesses-and-terminals.md` §4 (last paragraph)
    acceptance:
      - "Test `check_request_runs_in_sandbox_and_reports_typed_outcome` passes."
      - "Test `judgment_request_respects_budget_and_records_provenance` passes."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace check_request_runs_in_sandbox_and_reports_typed_outcome}
      - {id: t2, kind: test, target: cargo test --locked --workspace judgment_request_respects_budget_and_records_provenance}
  - key: D7
    epic: D
    repo: aq-server
    title: "Host adapters: candidate.prepare, candidate.publish"
    type: feature
    class: standard-high
    needs: [D1b, D5, D6]
    continues: [AQ-15]
    spec: [aq-playbooks/docs/specs/0001-aq-playbooks.md]
    description: |
      ### Goal
      Playbooks can prepare an integration candidate and request guarded publication through D1's central delivery service. Publication happens only when the evidence the policy names is present and applies to that exact candidate (P10).

      ### What to build
      - `candidate.prepare` maps to D1a's candidate creation:
        - an explicit bounded source set and base, from retained source receipts only;
        - outcomes `prepared`, `conflict` (with conflict step and bounded paths) and `refused`.

        A repair needs a new candidate with a new operation ID; prior candidates stay immutable.
      - `candidate.publish` maps to D1b's policy-driven publication:
        - Inputs: the candidate, the required evidence references and the destination preconditions (target and `expected_old`).
        - Before dispatch, the host checks every evidence item the policy requires: review decision, check receipts and judgments where permitted. Each item must exist in its owning service, come from an authorized issuer, and be bound to this candidate's revision.
        - Stale evidence (source or candidate changed), missing evidence, or a caller-asserted flag refuses with a typed reason (test `publish_refused_without_required_evidence`).
        - Recovery is `Reconcilable`. A lost reply reconciles the same publication operation through D1b; it never pushes again.
        - Cancellation cannot undo a publication. A settled operation returns its existing disposition.
      - Use D5's intent rule: persist the intent with `Intent.id`, the contract fingerprint and the payload digest before the effect. Record the candidate and publication receipts so that `operation.get` and inspection show them (test `prepare_then_publish_records_receipts`).
      - The AQ integration layer, not the playbook, decides whether evidence is sufficient (§15 "AQ's integration layer checks accepted evidence before publication").

      ### Current state
