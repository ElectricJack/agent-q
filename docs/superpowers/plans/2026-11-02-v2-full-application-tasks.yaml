      - aq-server `docs/specs/0001-infrastructure-foundation.md` "Human login and machine identity", "Verification and completion"
    acceptance:
      - "The review report is submitted and every finding is filed with severity."
    deliverables:
      - {id: review, kind: review, target: other}
    integration: pull_request
