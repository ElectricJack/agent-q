    priority: high
  - key: B2
    epic: B
    repo: aq-server
    title: Issue, scope, revoke and re-adopt delegated permits
    type: feature
    class: deep-high
    review: adversarial
    needs: [B1, B3]
    continues: [AQ-08]
    spec: [aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md]
    description: |
      ### Goal
      aq-server issues a delegated permit for each attempt and enforces its scope on every runner route. It revokes permits, and re-binds them when a node's new boot re-adopts live sandboxes.

      ### What to build
      - **Issue and upgrade:**
        - Issue a preparation-scoped permit when a native offer is accepted. It is bound to the attempt, grant generation, sandbox identity, node plus boot, and hard deadline (SBX6).
        - Upgrade it to execution scope when the grant commits.
        - Persist permits durably in PostgreSQL, storing a verifier rather than the token.
        - Issuance is idempotent by operation ID: an exact replay returns the same permit, and changed bytes conflict.
      - **Permit authentication on every runner route.** Refuse:
        - other attempts;
        - expired permits;
        - a stale boot;
        - execution-only use under preparation scope.

        The routes:
        - material fetch: `/v1/worker/profiled/material`;
        - Prepared: `/v1/worker/profiled-v2/prepare`;
        - Started: `/v1/worker/profiled-v2/started` and `/v1/worker/profiled/started`;
        - renewal: `/v1/worker/profiled/renew`;
        - observations: `/v1/worker/observations/batch`;
        - terminal: `/v1/terminal-relay/{register,poll,output-poll,upload,control-upload}`;
        - artifact transfer: `/v1/worker/profiled/artifact` and `/v1/worker/profiled/source/{attempt}/{member}`;
        - results: `/v1/worker/profiled/results`, plus `/v1/worker/profiled-v2/stopped`;
        - mail: `/v2/worker/messages/{poll,ack}`.

        A permit never authorizes poll, accept or register (0005 §6). Node credentials keep working on node routes.
      - **Revoke** on node revocation (all its permits), attempt cancellation (B3) and grant expiry.
      - **Re-adoption** (0005 §4.1):
        - A new boot lists its live sandboxes (attempt plus grant generation), and the server re-binds those permits to the new boot.
        - Until then, renewals answer "awaiting node re-adoption" without extending anything.
        - If the renewal deadline passes first, the runner is told to stop and preserve.
      - **Server restart** (Review Focus 4): reconstruct permits and grants from storage. A renewal within the window resumes; otherwise stop and preserve. No duplicate result. Defaults: 120 s grant, renewed about every 15 s (0002 §5).
      - **Terminal aggregates:** per-node limits (SBX16) stay counted server-side across all of a node's sandboxes.

      ### Current state
      - Runner routes authenticate the node credential through `worker_api::authenticate_context` (`crates/aq-server/src/worker_api.rs:80`). The renewal handler is `profiled_execution/renewal/api.rs`.
      - The terminal relay is keyed by node plus boot (`terminal/peer.rs:34-47`, `:227-255`).
      - No permit storage or code exists.
      - Native cancellation does not exist yet. It comes from B3, which this task needs.

      ### Interfaces
      - **Consumes:** B1's pinned permit, re-adoption and renewal schemas; B3's cancellation records.
      - **Produces:**
        - permit issuance in the acceptance reply and the upgrade at grant;
        - the re-adoption endpoint;
        - a reusable permit-auth extractor, used by B6a2, C5a2, F3 and H4.

      ### Out of scope
      - Binding material leases to permits and refusing lease use by another attempt (C5a2). It touches the same `profiled_execution/material*` files, so leave lease records unchanged.
      - Cloudflare Access service-token lifecycle (E7).
      - Runner-side permit use (B6a2).
      - Node-side re-adoption (B5b).
      - Native cancellation itself (B3).
      - Wait routes (H4).

      ### References
      - `aq-server/docs/architecture/0005-sandboxed-execution-and-deployment-topology.md` §4 steps 3–5, §4.1, §6, §7
      - `aq-server/docs/architecture/0002-execution-and-recovery.md` §5
      - `aq-server/docs/specs/0002-execution-and-agent-access.md` §3, §8
    acceptance:
      - "Test `permit_scope_refuses_foreign_attempt_and_expired_use` passes."
      - "Test `node_reboot_requires_readoption_before_renewal_extends` passes."
      - "Test `server_restart_mid_attempt_resumes_or_preserves` (Review Focus 4) passes: the server restarts with an active permit; renewal resumes within the window, otherwise the runner is told to stop and preserve; no duplicate result is recorded."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace permit_scope_refuses_foreign_attempt_and_expired_use}
      - {id: t2, kind: test, target: cargo test --locked --workspace node_reboot_requires_readoption_before_renewal_extends}
      - {id: t3, kind: test, target: cargo test --locked --workspace server_restart_mid_attempt_resumes_or_preserves}
    integration: pull_request
  - key: B3
    epic: B
    repo: aq-server
    title: Native cancellation end to end
    type: feature
    class: standard-high
    needs: []
    continues: [AQ-08, AQ-10]
    spec: [aq-server/docs/architecture/0002-execution-and-recovery.md, aq-server/docs/specs/0002-execution-and-agent-access.md]
    description: |
      ### Goal
      Cancel a native (`profiled_v1`) attempt in any phase, durably. The directive reaches the worker through poll and renewal replies, and late results are recorded but not applied.

      ### What to build
      - **Cancel in every phase** (offered, preparing, granted, started). Admission records a durable cancellation ID and reason, and closes new authority-dependent actions. It does not claim the process stopped (0002 §6).
      - **Before grant:** release the task claim. Use a NeverGranted closure when no grant was issued. Test `native_cancel_before_grant_releases_claim`.
      - **After grant or start:**
        - Deliver the cancellation in `NativePollPage.cancellations` as `transport::Cancellation{cancellation_id, binding, authority_revision, reason}`.
        - Refuse renewal with `FailureCode::Cancelled`.
        - Settle `cancelled` only after stopped-writer proof (X3).

        Test `native_cancel_after_start_stops_and_settles_cancelled`. Use a fake worker.
      - **Ordering** (X6, X7):
        - Serialize cancellation against result acceptance for each attempt.
        - If cancellation is recorded first, a later result is retained but cannot qualify as successful completion.
        - If the result is accepted first, a later cancellation cannot erase it.
        - An old attempt that returns after its replacement keeps its history but cannot settle.

        Test `late_result_after_cancel_is_recorded_not_applied`.
      - **Replay:** the same operation ID with the same payload returns the original outcome. A changed payload conflicts.
      - **Owner API:** make `POST /api/execution/attempts/{id}/cancel` (owner-only, body `{operation_id, reason}`) handle native attempts. Route it through one domain function that the dashboard, `aqv2` and the playbook `operation.cancel` adapter will reuse.
      - **Recognition target:** within one active poll interval plus 1 s (0002 §10).

      ### Current state
      - `crates/aq-server/src/profiled_execution/producer/workflow.rs:232` always returns `cancellations: vec![]`.
      - `execution.rs:910` `execution_cancel` calls `load_attempt` (`execution.rs:148-152`), which selects only `kind='legacy_fixture'`. Legacy directives go to the `execution_directives` table.
      - The route is registered at `execution/api.rs:128`, with its handler at `:253`.
      - Native rows already have `cancellation_id`, and native routes refuse when it is set (`renewal/pinned.rs:75`, `initial_grant.rs:195`, `settlement/applicability.rs:341`). Nothing sets it for profiled attempts (grep only; unverified).
      - The wire types already exist in `aq-admission/src/transport.rs:214`:
        - `Cancellation`;
        - `CancellationReason::{OwnerRequest,InputsChanged,Expired,CredentialRevoked,RecoveryFence}`.

        `FailureCode::Cancelled` is in `control.rs`. The status enum is in `execution/profiled.rs:9`.

      ### Interfaces
      - **Consumes:** existing native authority rows and the settlement code.
      - **Produces:** the native cancel domain function, the owner route, and durable cancellation records. These are used by:
        - B2 (permit revocation);
        - D3;
        - D5 (`operation.cancel`);
        - G2 (task cancel command);
        - F7 (`aqv2` cancel).

      ### Out of scope
      - Node observation of cancellation (B5b).
      - Runner stop-and-preserve (B6a1).
      - Permit revocation (B2).
      - Action-union and task commands (G2).
      - The `operation.cancel` adapter (D5).
      - The CLI (F7) and dashboard actions (G3).
      - Automatic settlement on result arrival (D3).
      - Wire-contract changes (B1). Use the existing types.

      ### References
      - `aq-server/docs/architecture/0002-execution-and-recovery.md` §6, §9 (X3, X6, X7), §10 (cancellation budget)
      - `aq-server/docs/specs/0002-execution-and-agent-access.md` §7
    acceptance:
      - "Tests `native_cancel_before_grant_releases_claim`, `native_cancel_after_start_stops_and_settles_cancelled` and `late_result_after_cancel_is_recorded_not_applied` pass."
    deliverables:
      - {id: t1, kind: test, target: cargo test --locked --workspace native_cancel_before_grant_releases_claim}
      - {id: t2, kind: test, target: cargo test --locked --workspace native_cancel_after_start_stops_and_settles_cancelled}
      - {id: t3, kind: test, target: cargo test --locked --workspace late_result_after_cancel_is_recorded_not_applied}
