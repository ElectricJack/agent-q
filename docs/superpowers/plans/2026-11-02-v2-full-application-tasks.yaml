      - {id: t2, kind: test, target: cargo test --locked --workspace schedule_survives_restart_without_double_fire}
  - key: D9
    epic: D
    repo: aq-server
    title: Default coding policy and playbook install/activation API
    type: feature
    class: deep-high
    needs: [D5, D6, D7, D8, B4, G1a]
    continues: [AQ-12, GATE-05]
    spec: [aq-playbooks/docs/specs/0001-aq-playbooks.md, aq-playbooks/docs/research/0001-v1-to-v2-capability-selection.md]
    description: |
      ### Goal
      Every project runs a default coding playbook by default: implement, check, cross-family review, publish, complete, with bounded rework. The owner can install, validate, activate and roll back playbook artifacts without restarting the daemon.

      ### What to build
      - Author the coding playbook, using only the twelve commands:
        1. implement, via `work.ensure` with kind implementation;
        2. check, via `check.request` for every required check;
        3. review: `work.ensure` with kind review, constrained to a model family different from the implementer's, plus an optional `decision.request` to the owner;
        4. publish: `candidate.prepare`, then `candidate.publish` with the review and check evidence;
        5. complete, through the version-checked completion path;
        6. on failure or rejection, rework with the evidence attached (repair work), within the task's retry and spend budgets.

        Evidence is invalidated after any subject change (spec §13). Review output never substitutes for a check or a human decision.
      - Owner API and CLI for artifacts:
        - **install:** verified, immutable artifact bytes;
        - **validate:** compile and check registry compatibility against the pinned catalog;
        - **activate:** bind the artifact to a named callable or trigger;
        - **roll back:** re-activate the previous artifact.

        These use the host's existing `Request::Install` and `Request::Activate`, with idempotent operation IDs.
      - Activation affects only new runs. Admitted runs keep their captured manifest (P4, spec §5).
      - Make the coding policy the project default, replacing D3's built-in default completion policy.

      ### Current state
      - The daemon loads 1 to 4 artifacts only at startup, from the playbooks config `deployments` (`crates/aq-server/src/playbooks/config.rs:30-58`, `runtime.rs:162`), under the fixed profile `human_review_v2`.
      - The engine already has install and activate (`crates/aq-playbook-host/src/lib.rs:109-118`).
      - Existing routes are at `playbooks/api.rs:39-57`; inspection routes are at `playbooks/inspection.rs:310`.
      - The synthetic coding pilot is in `aq-playbooks-cli/src/pilots.rs`.
      - Replacement attempts and budgets are B4's (not in `needs`; unverified whether merged).

      ### Interfaces
      Consumes:
      - D5–D8's twelve adapters;
      - D3's completion pipeline;
      - B4's replacement attempts.

      Produces:
      - the coding playbook artifact;
      - the install, validate, activate and roll-back operations, which G9 calls through the action union and F7 can wrap;
      - the project-default policy setting.

      ### Out of scope
      - Dashboard playbook actions: G9.
      - The general `aqv2` CLI: F7. If this task adds a CLI entry point, it is never named `aq`.
      - Routing, watcher and report pilots: D11.
      - Adapter internals: D5–D8.
      - Persistence performance: D10.

      ### References
      - `aq-playbooks/docs/specs/0001-aq-playbooks.md` §5, §13, §15 ("Reusable workflows and the initial pilot")
      - `aq-playbooks/docs/research/0001-v1-to-v2-capability-selection.md` §4, §7
    acceptance:
      - "Test `coding_policy_review_rejection_creates_rework_attempt` passes."
      - "Test `activation_switches_future_runs_only` passes."
    deliverables:
