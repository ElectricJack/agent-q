[workspace]
resolver = "3"
members = ["crates/aq-protocol", "crates/aq-release", "crates/aq-server", "crates/aq-updater", "crates/aq-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aq-protocol = { path = "crates/aq-protocol" }
aq-release = { path = "crates/aq-release" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# uuid/chrono support is enabled here, not on sqlx: sqlx's own uuid/chrono features pull sqlx-sqlite into Cargo.lock.
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# dev
http-body-util = "0.1"
rsa = "0.9"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
