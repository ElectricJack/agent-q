[workspace]
resolver = "3"
members = ["crates/aq-agent-grants", "crates/aq-dashboard-contract", "crates/aq-supervisor-host", "crates/aqv2", "crates/aq-wait-engine", "crates/aq-central-authority", "crates/aq-result-media", "crates/aq-task-comments", "crates/aq-human-work", "crates/aq-human-cursor", "crates/aq-phase-terminal-protocol", "crates/aq-review-protocol", "crates/aq-playbook-host", "crates/aq-observation-admission", "crates/aq-session-cli", "crates/aq-terminal-relay-protocol", "crates/aq-terminal-relay", "crates/aq-observation-api", "crates/aq-accounting", "crates/aq-notify", "crates/aq-human-http", "crates/aq-notifications", "crates/aq-admission", "crates/aq-agent-api", "crates/aq-lifecycle-api", "crates/aq-selection", "crates/aq-profiles", "crates/aq-session-api", "crates/aq-release", "crates/aq-server", "crates/aq-updater"]
exclude = ["vendor/aq-session-host-0.1.7", "vendor/aq-codex-mapper-0.1.1", "vendor/aq-responses-transport-0.1.0", "vendor/aq-playbooks-0173673", "vendor/png-0.18.1-aq1", "vendor/aq-lifecycle-protocol-0.1.0", "vendor/aq-session-protocol-0.1.0", "vendor/aq-worker-protocol-0.1.1", "vendor/aq-worker-protocol-0.2.0", "vendor/aq-protocol-0.1.0", "vendor/aq-admission-0.2.0", "vendor/aq-admission-0.3.0", "vendor/aq-admission-0.3.1", "vendor/aq-admission-0.3.2", "vendor/aq-admission-0.3.3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aq-session-host = { path = "vendor/aq-session-host-0.1.7", version = "=0.1.7" }
aq-codex-mapper = { path = "vendor/aq-codex-mapper-0.1.1", version = "=0.1.1" }
aq-responses-transport = { path = "vendor/aq-responses-transport-0.1.0", version = "=0.1.0" }
aq-protocol = { path = "vendor/aq-protocol-0.1.0", version = "=0.1.0" }
aq-worker-protocol = { path = "vendor/aq-worker-protocol-0.2.0", version = "=0.2.0" }
aq-release = { path = "crates/aq-release" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
jsonwebtoken = "9"
nix = { version = "0.29", features = ["fs", "user"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# uuid/chrono support is enabled here, not on sqlx: sqlx's own uuid/chrono features pull sqlx-sqlite into Cargo.lock.
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# dev
http-body-util = "0.1"
rsa = "0.9"
tempfile = "3"

# Bound worker test artifacts while retaining workspace backtrace file:line.
# The test profile inherits these settings from dev.
#
# Interactive loops are incremental: an edit -> single-test rebuild of aq-server
# takes ~16 s incremental against ~127 s without. The cost is disk: the target's
# incremental/ directory grows to ~2.5 GB for one test binary and ~12 GB for
# all of them. CI and one-shot qualification builds gain nothing from it and
# set CARGO_INCREMENTAL=0, which overrides this. See AGENTS.md "Build health".
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

# Test fixtures generate RSA-2048 keys (tests/common/mod.rs). Unoptimized,
# keygen takes 2.5-12 s per test process; optimized, ~0.2 s. Only the
# big-integer prime search is optimized, so the rest of the build is unchanged.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

# CI-only images (scripts/update-lifecycle, scripts/product-smoke.py and
# scripts/recovery-smoke.py). Release images (release.yml) keep
# [profile.release]. Dropping ThinLTO alone saves nothing on a 4-vCPU runner
# (cold aq-server build: 796 s release, 793 s without LTO), because LTO builds
# dependencies as bitcode and generates code once. Optimization level is the
# lever: the same build takes 445 s with workspace crates at opt-level 0 and
# dependencies at 1, and the workspace rebuild that each further image
# (another version) needs drops the most. Debug assertions and overflow
# checks stay off, as in release; tests already run this code unoptimized.
[profile.ci-image]
inherits = "release"
lto = false
opt-level = 0
codegen-units = 16

[profile.ci-image.package."*"]
opt-level = 1

# Exact public transitive contract; existing published package bytes are unchanged.
[patch.crates-io]
# Exact published PNG source plus the narrow upstream malformed-PLTE fix.
png = { path = "vendor/png-0.18.1-aq1" }
aq-session-protocol = { path = "vendor/aq-session-protocol-0.1.0" }
aq-lifecycle-protocol = { path = "vendor/aq-lifecycle-protocol-0.1.0" }
