[workspace]
resolver = "3"
members = ["crates/aq-supervisor-host", "crates/aqv2", "crates/aq-wait-engine", "crates/aq-central-authority", "crates/aq-result-media", "crates/aq-phase-terminal-protocol", "crates/aq-review-protocol", "crates/aq-playbook-host", "crates/aq-observation-admission", "crates/aq-session-cli", "crates/aq-terminal-relay-protocol", "crates/aq-terminal-relay", "crates/aq-observation-api", "crates/aq-accounting", "crates/aq-notify", "crates/aq-human-http", "crates/aq-notifications", "crates/aq-admission", "crates/aq-agent-api", "crates/aq-lifecycle-api", "crates/aq-selection", "crates/aq-profiles", "crates/aq-session-api", "crates/aq-release", "crates/aq-server", "crates/aq-updater"]
exclude = ["vendor/aq-session-host-0.1.7", "vendor/aq-codex-mapper-0.1.1", "vendor/aq-responses-transport-0.1.0", "vendor/aq-playbooks-0173673", "vendor/png-0.18.1-aq1", "vendor/aq-playbooks-d3bd349", "vendor/aq-playbooks-a463e59", "vendor/aq-playbooks-42f9449", "vendor/aq-lifecycle-protocol-0.1.0", "vendor/aq-session-protocol-0.1.0", "vendor/aq-worker-protocol-0.1.1", "vendor/aq-worker-protocol-0.2.0", "vendor/aq-protocol-0.1.0", "vendor/aq-admission-0.3.0", "vendor/aq-admission-0.3.1", "vendor/aq-admission-0.3.2"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aq-session-host = { path = "vendor/aq-session-host-0.1.7", version = "=0.1.7" }
aq-codex-mapper = { path = "vendor/aq-codex-mapper-0.1.1", version = "=0.1.1" }
aq-responses-transport = { path = "vendor/aq-responses-transport-0.1.0", version = "=0.1.0" }
aq-protocol = { path = "vendor/aq-protocol-0.1.0", version = "=0.1.0" }
aq-worker-protocol = { path = "vendor/aq-worker-protocol-0.2.0", version = "=0.2.0" }
aq-release = { path = "crates/aq-release" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
jsonwebtoken = "9"
nix = { version = "0.29", features = ["fs", "user"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# uuid/chrono support is enabled here, not on sqlx: sqlx's own uuid/chrono features pull sqlx-sqlite into Cargo.lock.
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# dev
http-body-util = "0.1"
rsa = "0.9"
tempfile = "3"

# Bound worker test artifacts while retaining workspace backtrace file:line.
# The test profile inherits these settings from dev.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

# Exact public transitive contract; existing published package bytes are unchanged.
[patch.crates-io]
# Exact published PNG source plus the narrow upstream malformed-PLTE fix.
png = { path = "vendor/png-0.18.1-aq1" }
aq-session-protocol = { path = "vendor/aq-session-protocol-0.1.0" }
aq-lifecycle-protocol = { path = "vendor/aq-lifecycle-protocol-0.1.0" }
